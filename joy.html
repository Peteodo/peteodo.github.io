<script>
function buildZenSvg() {
  const outer = document.getElementById('zenOuter');
  const svg = document.getElementById('zenSvg');
  const W = outer.offsetWidth || 680;
  const H = outer.offsetHeight || 520;
  svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
  svg.setAttribute('width', W);
  svg.setAttribute('height', H);

  const stroke = 'rgba(100,90,70,0.13)';
  let markup = '';

  const baseY = H * 0.78;
  for (let i = 0; i < 8; i++) {
    const y = baseY + i * 15;
    const cp1x = W * 0.22, cp1y = y - 30;
    const cp2x = W * 0.72, cp2y = y + 14;
    markup += `<path class="base-line" d="M-10,${y} C${cp1x},${cp1y} ${cp2x},${cp2y} ${W+10},${y-16}" fill="none" stroke="${stroke}" stroke-width="0.8"/>`;
  }

  function stoneRings(cx, cy, r) {
    for (let k = 0; k < 4; k++) {
      const rr = r + k * 12;
      markup += `<ellipse class="base-line" cx="${cx}" cy="${cy}" rx="${rr*1.2}" ry="${rr*0.7}" fill="none" stroke="${stroke}" stroke-width="0.7" transform="rotate(-8,${cx},${cy})"/>`;
    }
  }
  stoneRings(W * 0.1, H * 0.84, 18);
  stoneRings(W * 0.85, H * 0.80, 15);

  const rx1 = W * 0.43, rx2 = W * 0.57, ryTop = H * 0.68;
  for (let x = rx1; x <= rx2; x += 9) {
    markup += `<line class="base-line" x1="${x}" y1="${ryTop}" x2="${x+3}" y2="${H*0.96}" stroke="${stroke}" stroke-width="0.7"/>`;
  }

  svg.innerHTML = markup;
}

window.addEventListener('load', buildZenSvg);
setTimeout(buildZenSvg, 50);
setTimeout(buildZenSvg, 300);

const bigColors = ['#c9a030','#b08828','#987020','#806018','#684810'];
const smallColors = ['#8888b8','#7070a0','#585888','#404070','#303060'];

function spawnRipples(containerId, colors, delayStep) {
  const container = document.getElementById(containerId);
  const size = containerId === 'rc1' ? 110 : 68;
  colors.forEach((color, i) => {
    setTimeout(() => {
      const ring = document.createElement('div');
      ring.className = 'ripple-ring';
      ring.style.cssText = `width:${size}px;height:${size}px;border-color:${color};--dur:${5.5 + i}s;`;
      container.appendChild(ring);
      leaveRippleTrace(container, ring, color, i);
      setTimeout(() => { if (ring.parentNode) ring.parentNode.removeChild(ring); }, (5.5 + i) * 1000 + 100);
    }, i * delayStep);
  });
}

function leaveRippleTrace(container, ring, color, rippleIndex) {
  if (rippleIndex % 2 !== 1) return;
  const traceDelay = 1500 + rippleIndex * 420;

  setTimeout(() => {
    if (!ring.parentNode) return;
    const ringStyle = window.getComputedStyle(ring);
    const trace = document.createElement('div');
    trace.className = 'trace-ring';
    trace.style.cssText = [
      `width:${ringStyle.width}`,
      `height:${ringStyle.height}`,
      `border-color:${softenTraceColor(color)}`,
      `transform:${ringStyle.transform === 'none' ? 'scale(1)' : ringStyle.transform}`
    ].join(';');
    container.appendChild(trace);
    trimRippleTraces(container);
  }, traceDelay);
}

function softenTraceColor(color) {
  if (!color || color[0] !== '#') return color;
  const hex = color.slice(1);
  const value = hex.length === 3
    ? hex.split('').map(ch => ch + ch).join('')
    : hex;
  const r = parseInt(value.slice(0, 2), 16);
  const g = parseInt(value.slice(2, 4), 16);
  const b = parseInt(value.slice(4, 6), 16);
  return `rgba(${r},${g},${b},0.22)`;
}

function trimRippleTraces(container) {
  const traces = container.querySelectorAll('.trace-ring');
  const maxTraces = container.id === 'rc1' ? 16 : 14;
  traces.forEach((trace, i) => {
    if (i < traces.length - maxTraces) trace.remove();
  });
}

function releaseGardenLines(buttonId, colors) {
  const outer = document.getElementById('zenOuter');
  const svg = document.getElementById('zenSvg');
  const button = document.getElementById(buttonId);
  const outerRect = outer.getBoundingClientRect();
  const buttonRect = button.getBoundingClientRect();
  const cx = buttonRect.left - outerRect.left + buttonRect.width / 2;
  const cy = buttonRect.top - outerRect.top + buttonRect.height / 2;
  const maxR = Math.hypot(outerRect.width, outerRect.height) * 0.55;

  for (let i = 0; i < 10; i++) {
    setTimeout(() => {
      const r = 34 + i * (maxR / 11);
      const drift = Math.sin(i * 1.7) * 8;
      const color = colors[i % colors.length];
      const ring = document.createElementNS('http://www.w3.org/2000/svg', 'ellipse');
      ring.setAttribute('class', 'wake-line');
      ring.setAttribute('cx', cx);
      ring.setAttribute('cy', cy + drift);
      ring.setAttribute('rx', r * 1.42);
      ring.setAttribute('ry', r * 0.48);
      ring.setAttribute('fill', 'none');
      ring.setAttribute('stroke', color);
      ring.setAttribute('stroke-width', i < 3 ? '0.75' : '0.55');
      ring.setAttribute('stroke-linecap', 'round');
      ring.setAttribute('transform', `rotate(${-7 + i * 1.5},${cx},${cy})`);
      ring.style.setProperty('--wake-dur', `${5.8 + i * 0.22}s`);
      svg.appendChild(ring);
      setTimeout(() => {
        if (ring.parentNode) ring.parentNode.removeChild(ring);
      }, 8300);
    }, i * 150);
  }

  for (let i = 0; i < 6; i++) {
    setTimeout(() => {
      const width = outerRect.width * (0.42 + i * 0.08);
      const y = cy + 16 + i * 20;
      const color = colors[(i + 2) % colors.length];
      const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      path.setAttribute('class', 'wake-stone');
      path.setAttribute('d', `M${cx - width / 2},${y} C${cx - width * 0.2},${y - 18} ${cx + width * 0.22},${y + 17} ${cx + width / 2},${y - 8}`);
      path.setAttribute('fill', 'none');
      path.setAttribute('stroke', color);
      path.setAttribute('stroke-width', '0.55');
      path.setAttribute('stroke-linecap', 'round');
      path.style.setProperty('--wake-dur', `${5.2 + i * 0.34}s`);
      svg.appendChild(path);
      setTimeout(() => {
        if (path.parentNode) path.parentNode.removeChild(path);
      }, 7800);
    }, i * 190);
  }
}

function trimSettledGardenLines(svg) {
  const settled = svg.querySelectorAll('.settled-line');
  const maxSettledLines = 18;
  settled.forEach((line, i) => {
    if (i < settled.length - maxSettledLines) line.remove();
  });
}

let lastBigIdx = -1, lastSmallIdx = -1;
const toneSetsBig = [[396,528,660,792],[432,528,648,864],[440,550,660,880],[384,480,576,768]];
const toneSetsSmall = [[528,660,880],[594,792,990],[512,682,853],[554,740,924]];
const singleToneSetsBig = [[396],[432],[480],[528],[594],[660],[792]];
const singleToneSetsSmall = [[512],[528],[554],[594],[660],[740],[880]];
let bigToneIdx = 0, smallToneIdx = 0;

function pickBellTone(chordSets, singleSets, toneIdx) {
  return Math.random() < 0.72
    ? singleSets[toneIdx % singleSets.length]
    : chordSets[toneIdx % chordSets.length];
}

function playTones(freqs, vol, wave) {
  try {
    const actx = new (window.AudioContext || window.webkitAudioContext)();
    freqs.forEach((freq, i) => {
      const osc = actx.createOscillator(), gain = actx.createGain();
      osc.connect(gain); gain.connect(actx.destination);
      osc.type = wave || 'sine';
      const t = actx.currentTime + i * 0.22;
      osc.frequency.setValueAtTime(freq, t);
      gain.gain.setValueAtTime(0, t);
      gain.gain.linearRampToValueAtTime(vol, t + 0.05);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 3.8);
      osc.start(t); osc.stop(t + 4.0);
    });
  } catch(e) {}
}

function playSingleBell(freq, vol) {
  try {
    const actx = new (window.AudioContext || window.webkitAudioContext)();
    const partials = [
      { ratio: 1, gain: vol, fade: 4.2 },
      { ratio: 2.01, gain: vol * 0.18, fade: 2.8 }
    ];

    partials.forEach(partial => {
      const osc = actx.createOscillator(), gain = actx.createGain();
      osc.connect(gain); gain.connect(actx.destination);
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq * partial.ratio, actx.currentTime);
      gain.gain.setValueAtTime(0, actx.currentTime);
      gain.gain.linearRampToValueAtTime(partial.gain, actx.currentTime + 0.045);
      gain.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + partial.fade);
      osc.start(actx.currentTime);
      osc.stop(actx.currentTime + partial.fade + 0.15);
    });
  } catch(e) {}
}

function showMsg(pool, lastRef, setLast) {
  let idx;
  do { idx = Math.floor(Math.random() * pool.length); } while (idx === lastRef && pool.length > 1);
  setLast(idx);
  const area = document.getElementById('msgArea');
  area.classList.add('fade');
  setTimeout(() => { area.textContent = pool[idx]; area.classList.remove('fade'); }, 480);
}

document.getElementById('bellBig').addEventListener('click', () => {
  const freqs = pickBellTone(toneSetsBig, singleToneSetsBig, bigToneIdx++);
  if (freqs.length === 1) playSingleBell(freqs[0], 0.12);
  else playTones(freqs, 0.13, 'sine');
  spawnRipples('rc1', bigColors, 360);
  releaseGardenLines('bellBig', ['rgba(176,136,40,0.2)','rgba(120,96,42,0.16)','rgba(205,176,92,0.14)']);
  if (Math.random() < 0.8) showMsg(creatingMessages, lastBigIdx, v => { lastBigIdx = v; });
  else showMsg(momentsMessages, lastSmallIdx, v => { lastSmallIdx = v; });
});

document.getElementById('bellSmall').addEventListener('click', () => {
  const freqs = pickBellTone(toneSetsSmall, singleToneSetsSmall, smallToneIdx++);
  if (freqs.length === 1) playSingleBell(freqs[0], 0.1);
  else playTones(freqs, 0.1, 'sine');
  spawnRipples('rc2', smallColors, 320);
  releaseGardenLines('bellSmall', ['rgba(112,112,160,0.19)','rgba(82,82,128,0.15)','rgba(150,150,200,0.13)']);
  if (Math.random() < 0.8) showMsg(momentsMessages, lastSmallIdx, v => { lastSmallIdx = v; });
  else showMsg(creatingMessages, lastBigIdx, v => { lastBigIdx = v; });
});
</script>
