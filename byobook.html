 if(pl.length<3||new Set(pl.map(p=>p.name.toLowerCase())).size<pl.length){$('#err').textContent='Need 3–10 players with different names.';return}
 if(!classic&&!on.length){$('#err').textContent='Pick at least one prompt pack.';return}
 let s=+$('#st').value;const sn=names[s]?.trim();s=sn?pl.findIndex(p=>p.name==sn):-1;names=pl.map(p=>p.name);
 S={pl,leader:s<0?Math.random()*pl.length|0:s,deck:pool(),target:pl.length<=4?5:4,round:1};draw()}
function draw(){clearInterval(tm);if(S.deck.length<2)S.deck=pool();S.pl.forEach(p=>p.gain=0);
 S.card=[S.deck.pop(),S.deck.pop()].map(fill);S.screen='pick';S.shown=0;S.redrawn=0;render()}
function render(){document.body.dataset.s=S.screen;const L=S.pl[S.leader];
 const head=`<div class=tag>Round ${S.round} · Picker: ${esc(L.name)}</div>`;
 if(S.screen=='pick'){app.innerHTML=head+(S.shown?`<div class=card><h2>${esc(L.name)}, pick a prompt</h2><div style="font-size:15px">Read your choice aloud, then everyone else seeks in their book!</div>
  ${S.card.map((c,i)=>`<button class="opt prompt" onclick="choose(${i})">${c}</button>`).join('')}${S.redrawn?'':'<button class="sm w2" onclick=redraw()>🔄 Redraw 2 new prompts</button>'}</div>`
  :`<div class=card style="padding:40px 18px"><h2>${esc(L.name)} takes the top card</h2><button class=o onclick="document.body.dataset.h=1;S.shown=1;render()">Draw card 🃏</button></div>`)}
 else if(S.screen=='seek'){app.innerHTML=`<div class=card><div class="prompt xl">${S.pick}</div></div>
  <div class=card><div class=timer id=tm>${fmt(secs)}</div>
  <button class="sm g" id=go onclick=timer()>I've got it! ⏱</button><button class="sm o" onclick="S.screen='judge';render()">End round</button></div>`}
 else if(S.screen=='judge'){app.innerHTML=head+`<div class=card><div class=prompt>${S.pick}</div></div>
  <div class=card><h2>Seekers read aloud…</h2><div>${esc(L.name)}, whose was best? They win a point</div>
  ${S.pl.map((p,i)=>i==S.leader?'':`<button class="opt" style="font-size:22px" onclick="win(${i})">📖 ${esc(p.name)}</button>`).join('')}</div>`}
 else if(S.screen=='scores'){const mx=S.target,srt=[...S.pl].sort((a,b)=>b.score-a.score),top=srt[0],nx=S.pl[S.next];
  app.innerHTML=`<div class=big>Scoreboard</div>`+(top.score>=mx?`<div class=tag style="background:var(--g)">🏆 ${esc(top.name)} reached ${mx}!</div>`:`<div class=tag style="background:var(--o)">First to ${mx} wins</div>`)+
  `<div style="margin-top:12px">${srt.map(p=>`<div class="sc ${p.gain?'up':''}"><div class=nm>${esc(p.name)}${p.gain?' ➕1':''}<div class=bar><i style="width:${Math.min(100,p.score/mx*100)}%"></i></div></div><div class=pt>${p.score}</div></div>`).join('')}</div>
  <div style="color:#fff;margin:10px">Next Picker: <b class=f style="font-size:22px">${esc(nx.name)}</b> 👉</div>
  <button class=g onclick=next()>Continue ▶</button><button class=r onclick=final()>End game</button>`}}
function redraw(){S.redrawn=1;if(S.deck.length<2)S.deck=pool();S.card=[S.deck.pop(),S.deck.pop()].map(fill);render()}
function choose(i){S.pick=S.card[i];S.screen='seek';render()}
function timer(){beep(1,.01);let t=secs;$('#go').disabled=true;const d=$('#tm');clearInterval(tm);
 tm=setInterval(()=>{t--;d.textContent=fmt(Math.max(t,0));d.classList.toggle('low',t<=10);d.classList.toggle('shake',t>0&&t<=5);if(t>0&&t<=10)beep(660,.09);if(t<=0){clearInterval(tm);d.classList.add('up');d.textContent="Time's up!";beep(440,.4)}},1000)}
function win(i){clearInterval(tm);S.pl[i].score++;S.pl[i].gain=1;S.next=(S.leader+1)%S.pl.length;S.screen='scores';render()}
function next(){S.leader=S.next;S.round++;draw()}
function final(){document.body.dataset.s='final';const srt=[...S.pl].sort((a,b)=>b.score-a.score),m=srt[0].score,w=srt.filter(p=>p.score==m);
 app.innerHTML=`<div class=trophy>🏆</div><div class=big>${w.length>1?'Joint winners!':'Winner!'}</div><div class=big style="color:var(--y)">${w.map(p=>esc(p.name)).join(' & ')}</div>
 <div style="margin-top:14px">${srt.map((p,i)=>`<div class="sc ${p.score==m?'lead':''}"><div class=pt>${i+1}</div><div class=nm>${esc(p.name)}</div><div class=pt>${p.score}</div></div>`).join('')}</div>
 <button class=o onclick=again()>Play again</button>`;
 for(let i=0;i<70;i++){const e=document.createElement('span');e.className='cf';e.textContent=['📚','🎉','⭐','🎊','📖'][i%5];e.style.left=Math.random()*100+'vw';e.style.animationDuration=2.5+Math.random()*3+'s';e.style.animationDelay=Math.random()*2+'s';document.body.append(e);setTimeout(()=>e.remove(),8000)}}
function again(){names=S.pl.map(p=>p.name);S.deck=[];setup()}
ld();setup();
</script></body></html>
