let STATE = createNewGame();

function fmtMoney(n){ return `$${n}`; }

function statusBadgeFor(state, familyId){
  const fam = getFamily(state, familyId);
  if(!fam.isAlive) return { cls:'defunct', text:'Defunct' };
  const ctrl = (state.mobControl && state.mobControl[familyId]) || Engine.calculateMobControl(state, familyId);
  if(ctrl.status==='CONTROLLED') return { cls:'controlled', text:'Controlled' };
  if(ctrl.status==='OVERTAKEN') return { cls:'overtaken', text:`Overtaken by ${getFamily(state,ctrl.controllerId).name}` };
  return { cls:'contested', text:'Contested' };
}

function renderStatusStrip(){
  const state = STATE;
  const el = document.getElementById('statusStrip');
  if(state.phase==='ENDED'){
    el.innerHTML = state.winnerId!==null
      ? `<span class="chip">Game Over — <b>${getFamily(state,state.winnerId).name}</b> is Kingpin</span>`
      : `<span class="chip">Game Over — <b>Mutual Destruction</b>, no Kingpin</span>`;
    return;
  }
  const fam = state.currentFamilyId!==null ? getFamily(state, state.currentFamilyId) : null;
  el.innerHTML = `
    <span class="chip">ROUND <b>${state.round}</b></span>
    <span class="chip">CURRENT TURN: <b style="color:${fam?fam.colour:'#fff'}">${fam?fam.name:'-'}</b></span>
    <span class="chip">ROLLING: <b>${fam?fam.name+"'s Home Mob":'-'}</b></span>
  `;
}

function renderTurnOrder(){
  const state = STATE;
  const el = document.getElementById('turnOrderStrip');
  const order = Engine.getRoundOrder(state.round);
  el.innerHTML = order.map(fid=>{
    const f = getFamily(state, fid);
    const cur = state.currentFamilyId===fid ? 'current' : '';
    const dead = !f.isAlive ? 'style="text-decoration:line-through;opacity:.5;"' : '';
    return `<span class="turn-pill ${cur}" ${dead}>${f.symbol} ${f.name}</span>`;
  }).join('');
}

function renderFaceLegend(){
  const el = document.getElementById('faceLegend');
  el.innerHTML = Object.entries(FACE_META).map(([face,m])=>
    `<div class="lg-row"><span><b>${face}</b> — ${m.label}</span><span>$${m.money}</span></div>`
  ).join('') + `<div class="lg-row"><span><b>4+4</b> — Clean Out</span><span>steal all</span></div>`;
}

// Keeps a just-assassinated die visible for a moment with a "hit" animation instead of
// having it vanish from the board instantly.
function triggerDeathFlash(state, dieId){
  state.deathFlashes = state.deathFlashes || [];
  state.deathFlashes.push({ dieId, ts: Date.now() });
  setTimeout(()=>{
    state.deathFlashes = (state.deathFlashes||[]).filter(f=>f.dieId!==dieId);
    render();
  }, 900);
}

function dieHtml(state, die, opts){
  opts = opts || {};
  const fam = getFamily(state, die.familyId);
  const classes = ['die'];
  if(die.isDon) classes.push('don');
  if(die.status==='HOSPITALISED') classes.push('hospitalised');
  if(die.location==='INFILTRATED') classes.push('infiltrated');
  if(opts.clickable) classes.push('clickable','selectable');
  if(opts.dying) classes.push('die-assassinated');
  const face = die.face ? die.face : '·';
  const style = `background:${fam.colour};`;
  return `<div class="${classes.join(' ')}" style="${style}" data-die-id="${die.id}" title="${fam.name}${die.isDon?' Don':''}${die.location==='INFILTRATED'?' (infiltrated)':''}">
    ${die.isDon?'<span class="don-crown">\u265B</span>':''}
    <span>${face}</span>
    <span class="sub">${fam.symbol}${die.location==='INFILTRATED'?'':''}</span>
  </div>`;
}

// Dice currently in this Home Mob, PLUS any just-assassinated die still mid-flash-animation
// (it's already status:REMOVED, but we keep rendering it briefly for dramatic effect).
function getPanelDice(state, familyId){
  const active = Engine.diceInMob(state, familyId);
  const flashIds = new Set((state.deathFlashes||[]).map(f=>f.dieId));
  if(flashIds.size===0) return { dice: active, flashIds };
  const flashing = state.dice.filter(d => d.hostFamilyId===familyId && d.status==='REMOVED' && flashIds.has(d.id));
  return { dice: [...active, ...flashing], flashIds };
}

function renderMobPanel(state, familyId){
  const fam = getFamily(state, familyId);
  const { dice: diceRaw, flashIds } = getPanelDice(state, familyId);
  const dice = diceRaw.sort((a,b)=> (b.isDon-a.isDon) || (a.familyId-b.familyId));
  const badge = statusBadgeFor(state, familyId);
  const isCurrent = state.currentFamilyId===familyId && state.phase!=='ENDED';
  const clickableDieIds = getClickableDieIdsFor(state, familyId);
  const diceHtml = dice.length ? dice.map(d=>dieHtml(state, d, { clickable: clickableDieIds.includes(d.id), dying: flashIds.has(d.id) })).join('') : '<div class="mob-empty-note">No dice remain here.</div>';
  const showTurnSummary = state.turn && state.turn.familyId===familyId && state.turn.summarySteps && state.turn.summarySteps.length;
  const turnSummaryHtml = showTurnSummary ? `
    <div class="turn-summary">
      <div class="turn-summary-head">This Turn</div>
      ${state.turn.summarySteps.map(s=>`<div class="turn-summary-step">${s}</div>`).join('')}
    </div>` : '';

  return `
  <div class="mob-panel ${fam.isHuman?'human':''} ${isCurrent?'active-turn':''}" data-mob-family="${familyId}">
    ${fam.protectedActive ? '<div class="protect-shield" title="Protected">\uD83D\uDEE1\uFE0F</div>' : ''}
    <div class="mob-head">
      <div class="fam-tag">
        <span class="fam-swatch" style="background:${fam.colour}"></span>
        <span class="fam-name" style="color:${fam.colour}">${fam.symbol} ${fam.name}${fam.isHuman ? (fam.id===0 ? ' (You)' : ' (Human)') : ''}</span>
      </div>
      <div class="status-badges">
        <span class="badge ${badge.cls}">${badge.text}</span>
        ${fam.isAlive ? `<span class="badge">Don: ${fam.donAlive?'Alive':'Dead'}</span>` : ''}
        ${fam.protectedActive ? '<span class="badge protected">Protected</span>' : ''}
      </div>
    </div>
    <div class="money-row">
      <div class="money-item"><span class="lbl">Street</span><span class="val">${fmtMoney(fam.streetMoney)}</span></div>
      <div class="money-item"><span class="lbl">Safe House</span><span class="val">${fmtMoney(fam.safeHouseMoney)}</span></div>
      <div class="money-item"><span class="lbl">Status</span><span class="val" style="font-size:12px;">${fam.isAlive?'ALIVE':'DEFUNCT'}</span></div>
    </div>
    <div class="dice-row">${diceHtml}</div>
    ${turnSummaryHtml}
  </div>`;
}

function getClickableDieIdsFor(state, mobFamilyId){
  const pd = state.pendingDecision;
  if(!pd) return [];
  if((pd.type==='FAMILY_TARGET_ASSASSINATE_DIE' || pd.type==='FAMILY_TARGET_HOSPITALISE_DIE') && pd.mobFamilyId===mobFamilyId) return pd.options.map(o=>o.dieId);
  if(pd.type==='INFILTRATED_ACTION' && state.turn.familyId===mobFamilyId) return pd.options.map(o=>o.dieId);
  return [];
}

function renderMobs(){
  const state = STATE;
  const grid = document.getElementById('mobsGrid');
  grid.innerHTML = state.families.map(f=>renderMobPanel(state, f.id)).join('');
  grid.querySelectorAll('.die[data-die-id]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const dieId = el.getAttribute('data-die-id');
      handleDieClick(dieId);
    });
  });
}

function renderLog(){
  const el = document.getElementById('event-log');
  const atBottom = el.scrollTop + el.clientHeight >= el.scrollHeight - 30;
  el.innerHTML = STATE.log.map(e=>`<div class="entry ${e.cls}">${e.text}</div>`).join('');
  if(atBottom || true) el.scrollTop = el.scrollHeight;
}

function handleDieClick(dieId){
  const state = STATE;
  const pd = state.pendingDecision;
  if(!pd) return;
  if((pd.type==='FAMILY_TARGET_ASSASSINATE_DIE' || pd.type==='FAMILY_TARGET_HOSPITALISE_DIE') && pd.options.some(o=>o.dieId===dieId)){
    Controller.applyFamilyTarget(state, dieId); render(); return;
  }
  if(pd.type==='INFILTRATED_ACTION' && pd.options.some(o=>o.dieId===dieId)){
    Controller.applyInfiltratedChoice(state, pd.dieId, dieId); render(); return;
  }
}

const PIP_LAYOUTS = { 1:[5], 2:[1,9], 3:[1,5,9], 4:[1,3,7,9], 5:[1,3,5,7,9], 6:[1,3,4,6,7,9] };
function miniDieHtml(face, opts){
  opts = opts || {};
  const active = new Set(PIP_LAYOUTS[face] || []);
  let cells = '';
  for(let i=1;i<=9;i++) cells += active.has(i) ? '<span class="pip"></span>' : '<span></span>';
  const label = opts.label || '';
  return `<div class="mini-die-wrap"><div class="mini-die ${opts.don?'don-mini':''}">${cells}</div>${label?`<div class="mini-die-label">${label}</div>`:''}</div>`;
}

function renderDecision(){
  const root = document.getElementById('decisionRoot');
  const state = STATE;
  const pd = state.pendingDecision;
  if(!pd || state.phase==='ENDED'){ root.innerHTML=''; return; }
  if(pd.type==='ROLL'){ root.innerHTML=''; return; } // handled by renderTurnBanner instead

  if(pd.type==='FAMILY_ACTION'){
    const fam = getFamily(state, pd.familyId);
    const own = state.turn.diceResults.filter(r=>!r.isInfiltrated);
    root.innerHTML = `
    <div class="decision-overlay"><div class="decision-card">
      <h2 style="color:${fam.colour}">Choose ONE Action for ${fam.name}</h2>
      <p class="sub">You may take at most one Special Action from the dice below.</p>
      <div class="mini-die-row">
        ${own.map(r=>miniDieHtml(r.face, { don:r.isDon, label:(r.isDon?'Don · ':'')+FACE_META[r.face].label })).join('')}
      </div>
      <div class="opt-grid">
        ${pd.options.map(a=>`<button class="opt-btn ${a==='NO_ACTION'?'noaction':''}" data-action="${a}">
          <span>${ACTION_LABELS[a]}</span><span class="tag">${a==='NO_ACTION'?'skip':'choose'}</span></button>`).join('')}
      </div>
    </div></div>`;
    root.querySelectorAll('[data-action]').forEach(btn=>{
      btn.onclick = ()=>{ Controller.submitFamilyAction(state, btn.getAttribute('data-action')); render(); };
    });
    return;
  }

  if(pd.type==='FAMILY_TARGET_ASSASSINATE_MOB' || pd.type==='FAMILY_TARGET_HOSPITALISE_MOB'){
    const fam = getFamily(state, pd.familyId);
    const verb = pd.type==='FAMILY_TARGET_ASSASSINATE_MOB' ? 'Assassinate' : 'Hospitalise';
    root.innerHTML = `
    <div class="decision-overlay"><div class="decision-card">
      <h2 style="color:${fam.colour}">${verb} — Choose a Family</h2>
      <p class="sub">Reach into any Home Mob on the board. Choose whose territory to hit first.</p>
      <div class="opt-grid">
        ${pd.options.map(o=>`<button class="opt-btn" data-fam="${o.familyId}"><span>${o.label}${o.hasVulnerableDon?' \u2620\uFE0F':''}</span><span class="tag">${o.hasVulnerableDon?'Don exposed!':'target'}</span></button>`).join('')}
        ${pd.options.length===0?'<div class="mob-empty-note">No legal targets anywhere on the board.</div>':''}
      </div>
    </div></div>`;
    root.querySelectorAll('[data-fam]').forEach(btn=>{
      btn.onclick = ()=>{ Controller.applyTargetMobChoice(state, Number(btn.getAttribute('data-fam'))); render(); };
    });
    return;
  }

  if(pd.type==='FAMILY_TARGET_ASSASSINATE_DIE' || pd.type==='FAMILY_TARGET_HOSPITALISE_DIE'){
    const fam = getFamily(state, pd.familyId);
    const mobFam = getFamily(state, pd.mobFamilyId);
    const verb = pd.type==='FAMILY_TARGET_ASSASSINATE_DIE' ? 'Assassinate' : 'Hospitalise';
    root.innerHTML = `
    <div class="decision-overlay"><div class="decision-card">
      <h2 style="color:${fam.colour}">${verb} — Choose a Mobster in ${mobFam.name}'s Mob</h2>
      <p class="sub">Click a die on the table below, or choose here.</p>
      <div class="opt-grid">
        ${pd.options.map(o=>`<button class="opt-btn" data-die="${o.dieId}"><span>${o.label}</span><span class="tag">target</span></button>`).join('')}
        ${pd.options.length===0?'<div class="mob-empty-note">No legal targets.</div>':''}
      </div>
    </div></div>`;
    root.querySelectorAll('[data-die]').forEach(btn=>{
      btn.onclick = ()=>{ Controller.applyFamilyTarget(state, btn.getAttribute('data-die')); render(); };
    });
    return;
  }

  if(pd.type==='FAMILY_TARGET_SHAKE_DOWN' || pd.type==='FAMILY_TARGET_CLEAN_OUT'){
    const fam = getFamily(state, pd.familyId);
    const verb = pd.type==='FAMILY_TARGET_CLEAN_OUT' ? 'Clean Out' : 'Shake Down';
    root.innerHTML = `
    <div class="decision-overlay"><div class="decision-card">
      <h2 style="color:${fam.colour}">${verb} — Choose a Family</h2>
      <p class="sub">${verb==='Clean Out'?'Take ALL of their Street Money.':'Take up to $4 of their Street Money.'}</p>
      <div class="opt-grid">
        ${pd.options.map(o=>`<button class="opt-btn" data-fam="${o.familyId}"><span>${o.label}</span><span class="tag">target</span></button>`).join('')}
      </div>
    </div></div>`;
    root.querySelectorAll('[data-fam]').forEach(btn=>{
      btn.onclick = ()=>{ Controller.applyFamilyTarget(state, Number(btn.getAttribute('data-fam'))); render(); };
    });
    return;
  }

  if(pd.type==='FAMILY_TARGET_INFILTRATE'){
    const fam = getFamily(state, pd.familyId);
    root.innerHTML = `
    <div class="decision-overlay"><div class="decision-card">
      <h2 style="color:${fam.colour}">Infiltrate — Choose a Home Mob</h2>
      <p class="sub">Send one of your mobsters undercover.</p>
      <div class="opt-grid">
        ${pd.options.map(o=>`<button class="opt-btn" data-fam="${o.familyId}"><span>${o.label}</span><span class="tag">infiltrate</span></button>`).join('')}
        ${pd.options.length===0?'<div class="mob-empty-note">No Mob has room.</div>':''}
      </div>
    </div></div>`;
    root.querySelectorAll('[data-fam]').forEach(btn=>{
      btn.onclick = ()=>{ Controller.applyFamilyTarget(state, Number(btn.getAttribute('data-fam'))); render(); };
    });
    return;
  }

  if(pd.type==='INFILTRATED_ACTION'){
    const fam = getFamily(state, pd.familyId);
    root.innerHTML = `
    <div class="decision-overlay"><div class="decision-card">
      <h2 style="color:${fam.colour}">${fam.name} — Infiltrated Assassination</h2>
      <p class="sub">${pd.note}</p>
      <div class="opt-grid">
        ${pd.options.map(o=>`<button class="opt-btn" data-die="${o.dieId}"><span>${o.label}</span><span class="tag">assassinate</span></button>`).join('')}
        <button class="opt-btn noaction" data-die="NO_ACTION"><span>Decline — collect $${FACE_META[ASSASSINATE_FACE].money} instead</span></button>
      </div>
    </div></div>`;
    root.querySelectorAll('[data-die]').forEach(btn=>{
      btn.onclick = ()=>{ Controller.applyInfiltratedChoice(state, pd.dieId, btn.getAttribute('data-die')); render(); };
    });
    return;
  }

  if(pd.type==='DEFUNCT_RECIPIENT'){
    const fam = getFamily(state, pd.familyId);
    root.innerHTML = `
    <div class="decision-overlay"><div class="decision-card">
      <h2 style="color:${fam.colour}">${fam.name} (Defunct) — Choose Recipient</h2>
      <p class="sub">${pd.note}</p>
      <div class="opt-grid">
        ${pd.options.map(o=>`<button class="opt-btn" data-fam="${o.familyId}"><span>${o.label}</span><span class="tag">choose</span></button>`).join('')}
      </div>
    </div></div>`;
    root.querySelectorAll('[data-fam]').forEach(btn=>{
      btn.onclick = ()=>{ Controller.applyRecipientChoice(state, Number(btn.getAttribute('data-fam'))); render(); };
    });
    return;
  }

  if(pd.type==='ROUND_END_CONTINUE'){
    const human = state.families.find(f=>f.isHuman);
    root.innerHTML = `
    <div class="decision-overlay"><div class="decision-card">
      <h2 style="color:var(--gold)">End of Round ${pd.roundNumber}</h2>
      <p class="sub">${human.name} is defunct, so this pause is just for you to check in on how the remaining families are doing before the AI plays on.</p>
      <div class="roll-cta"><button id="roundContinueBtn">Continue</button></div>
    </div></div>`;
    document.getElementById('roundContinueBtn').onclick = ()=>{ Controller.continueAfterRoundEnd(state); render(); };
    return;
  }
}

function renderFinal(){
  const root = document.getElementById('finalRoot');
  const state = STATE;
  if(state.phase!=='ENDED'){ root.innerHTML=''; return; }
  const winner = state.winnerId!==null ? getFamily(state, state.winnerId) : null;
  const scores = state.finalScores;
  root.innerHTML = `
  <div class="final-screen"><div class="final-card">
    <h1>${winner ? 'KINGPIN' : 'MUTUAL DESTRUCTION'}</h1>
    <div class="winner-name" style="color:${winner?winner.colour:'#c53535'}">
      ${winner ? `${winner.symbol} ${winner.name}` : 'No family survived the final roll'}
    </div>
    <table class="final-table">
      <thead><tr><th>Family</th><th>Street</th><th>Safe House</th><th>Final Wealth</th><th>Dice Left</th></tr></thead>
      <tbody>
        ${scores.map(s=>`<tr><td style="color:${s.colour}">${s.name}${winner && s.id===winner.id?' \u2605':''}</td><td>$${s.streetMoney}</td><td>$${s.safeHouseMoney}</td><td><b>$${s.finalWealth}</b></td><td>${s.remainingDice}</td></tr>`).join('')}
      </tbody>
    </table>
    <div style="margin-top:22px;"><button id="playAgainBtn" style="background:var(--gold);border:none;padding:12px 26px;border-radius:4px;font-weight:bold;cursor:pointer;text-transform:uppercase;letter-spacing:1px;">Play Again</button></div>
  </div></div>`;
  document.getElementById('playAgainBtn').onclick = ()=>{ newGame(); };
}

/* ---------------- rules panel ---------------- */

const RULES_HTML = `
  <h2>How to Play THE MOB</h2>
  <h4>Objective</h4><p>Be the last family standing. A family is eliminated the instant its Don is assassinated.</p>
  <h4>Dice Faces</h4><p>1 Infiltrate ($1) · 2 Hospitalise ($2) · 3 Make Money Safe ($3) · 4 Shake Down ($4) · 5 Protect ($5) · 6 Assassinate ($10). If a face's action isn't used, that die pays its Protection Money instead — so a 6 is the expensive trade-off (assassinate, or bank $10), while a 1 is cheap either way.</p>
  <h4>One Action Rule</h4><p>On your turn you roll every active die in your Home Mob. From your own (non-infiltrated) dice you may take at most ONE Special Action, no matter how many action faces you rolled. Rolling two 4s lets you choose Clean Out instead, seizing ALL of a rival's Street Money.</p>
  <h4>Assassinate &amp; Hospitalise Reach Anywhere</h4><p>These two actions aren't limited to your own Home Mob — you choose ANY family's Home Mob first, then choose which die inside it to hit. The die you're attacking WITH still comes from your own roll; only the target is open to the whole board. The one exception: you can never target your own family's dice, even an infiltrated die of yours sitting inside a rival's Mob.</p>
  <h4>The Don</h4><p>A Don never leaves home and can't be infiltrated. It cannot be Assassinated OR Hospitalised until it is the very last living member of its family still in its Home Mob — every other die there (yours or an infiltrator's, doesn't matter) has to fall first.</p>
  <h4>Infiltrated Dice</h4><p>A die that has infiltrated a rival's Home Mob is rolled by whoever's turn it is, but it belongs to its original family. If it shows a 6 (the Assassinate face), its original owner can independently assassinate a die in that same Mob — separate from the rolling family's one action. If it's killed first, that chance is lost.</p>
  <h4>Mob Control</h4><p>Whoever has the most living dice in a Home Mob controls it (ties favour the original owner). If an outside family strictly beats everyone else, they Overtake it. If two+ outside families tie for the lead, the Mob is Contested and nobody gets controller income. The controller collects a bonus equal to ALL protection money generated in that roll, on top of what each family already earns from its own dice.</p>
  <h4>Street vs Safe House</h4><p>Protection money lands on the Street, where it can be stolen by Shake Down or Clean Out. Make Money Safe moves your pre-roll Street Money into the Safe House, where it's permanently safe.</p>
  <h4>Defunct Families</h4><p>Once a Don falls, that family stops taking turns and can't control Mobs — but any surviving infiltrated dice keep rolling. Their old player still decides assassination targets, and chooses which living family receives any money those dice earn.</p>
  <h4>Final Payday</h4><p>When only one family remains, it gets one last roll of its Home Mob. All Protection Money is multiplied by 5 and goes straight to the Safe House.</p>
`;

function renderRules(show){
  const root = document.getElementById('rulesRoot');
  if(!show){ root.innerHTML=''; return; }
  root.innerHTML = `<div class="rules-overlay"><div class="rules-card">${RULES_HTML}<button class="closebtn" id="closeRulesBtn">Close</button></div></div>`;
  document.getElementById('closeRulesBtn').onclick = ()=>renderRules(false);
}

/* ---------------- turn banner (non-blocking "your turn" prompt) ---------------- */

function renderTurnBanner(){
  const root = document.getElementById('turnBannerRoot');
  const state = STATE;
  const pd = state.pendingDecision;
  if(!pd || pd.type!=='ROLL' || state.phase==='ENDED'){ root.innerHTML=''; return; }
  const fam = getFamily(state, pd.familyId);
  root.innerHTML = `
  <div class="turn-banner-wrap"><div class="turn-banner">
    <span class="tb-text"><b style="color:${fam.colour}">${fam.symbol} ${fam.name}'s Turn</b>
      <span class="tb-sub">Take a look at the board, then roll when you're ready.</span></span>
    <button id="rollDiceBtn">Roll the Dice</button>
  </div></div>`;
  document.getElementById('rollDiceBtn').onclick = ()=>{ Controller.startTurn(state); render(); };
}

/* ---------------- pre-game setup (personality selection) ---------------- */

function renderSetupScreen(){
  const root = document.getElementById('setupRoot');
  const state = STATE;
  if(state.phase !== 'SETUP'){ root.innerHTML = ''; return; }
  const otherFamilies = state.families.filter(f => f.id !== 0); // Falcone (id 0) is always the primary human seat
  root.innerHTML = `
  <div class="decision-overlay" style="align-items:center;">
    <div class="decision-card" style="max-width:640px; max-height:80vh;">
      <h2 style="color:var(--gold)">Choose Your Rivals</h2>
      <p class="sub">Each family defaults to an AI personality. Tap to change any of them — including handing a seat to another local human — before the game begins.</p>
      ${otherFamilies.map(f => `
        <div style="margin-bottom:16px;">
          <div style="color:${f.colour}; font-weight:bold; margin-bottom:6px;">${f.symbol} ${f.name}</div>
          <div style="display:flex; gap:8px; flex-wrap:wrap;">
            ${SETUP_SEAT_OPTIONS.map(p => `
              <button class="opt-btn personality-btn" data-fam="${f.id}" data-personality="${p.key}"
                style="flex:1 1 130px; text-align:center; ${state.aiPersonality[f.id]===p.key ? 'border-color:var(--gold); background:#3a2d18;' : ''}">
                <span style="width:100%;">${p.name}</span>
              </button>`).join('')}
          </div>
          <div style="font-size:11px; color:var(--paper-dim); margin-top:5px;">${setupOptionDef(state.aiPersonality[f.id]).tagline}</div>
        </div>
      `).join('')}
      <div class="roll-cta"><button id="startGameBtn">Start Game</button></div>
    </div>
  </div>`;
  root.querySelectorAll('.personality-btn').forEach(btn=>{
    btn.onclick = ()=>{
      const fam = Number(btn.getAttribute('data-fam'));
      const key = btn.getAttribute('data-personality');
      state.aiPersonality[fam] = key;
      render();
    };
  });
  document.getElementById('startGameBtn').onclick = ()=>{
    // Apply seat assignments: a family whose selection is 'HUMAN' becomes human-controlled
    // (hot-seat style — the same device/browser prompts whoever's turn it is); everyone
    // else stays AI, driven by whatever personality was selected. Falcone (id 0) is
    // unaffected — always the default primary human seat.
    state.families.forEach(f=>{
      if(f.id === 0) return;
      f.isHuman = (state.aiPersonality[f.id] === 'HUMAN');
    });
    state.phase = 'PLAYING';
    Controller.beginGame(state);
    render();
  };
}

/* ---------------- master render ---------------- */

function render(){
  renderSetupScreen();
  renderStatusStrip();
  renderTurnOrder();
  renderFaceLegend();
  renderMobs();
  renderLog();
  renderDecision();
  renderTurnBanner();
  renderFinal();
}

function newGame(){
  STATE = createNewGame();
  document.getElementById('finalRoot').innerHTML='';
  render(); // shows the personality setup screen; Controller.beginGame() fires once Start Game is clicked
}

document.getElementById('newGameBtn').onclick = newGame;
document.getElementById('rulesBtn').onclick = ()=>renderRules(true);
document.getElementById('helpFloatBtn').onclick = ()=>renderRules(true);

/* =========================================================================
   DEBUG MODE — not exposed in normal UI, accessible via window.MOB_DEBUG
   ========================================================================= */

window.MOB_DEBUG = {
  state: () => STATE,
  forceFace: (dieId, face) => { const d = getDie(STATE, dieId); if(d) d.face = face; render(); },
  killDie: (dieId) => { Engine.killDie(STATE, dieId); Engine.recalculateAllMobControl(STATE); render(); },
  moveDie: (dieId, targetFamilyId) => { const d = getDie(STATE, dieId); if(d){ d.location='INFILTRATED'; d.hostFamilyId=targetFamilyId; Engine.recalculateAllMobControl(STATE);} render(); },
  setMoney: (familyId, street, safe) => { const f = getFamily(STATE, familyId); if(street!==undefined) f.streetMoney=street; if(safe!==undefined) f.safeHouseMoney=safe; render(); },
  makeDefunct: (familyId) => { Engine.killDon(STATE, familyId); Engine.recalculateAllMobControl(STATE); render(); },
  setPersonality: (familyId, key) => { if(setupOptionDef(key)) STATE.aiPersonality[familyId] = key; render(); },
  inspect: () => JSON.parse(JSON.stringify(STATE)),
};

/* ---------------- boot ---------------- */
// STATE starts in the SETUP phase — render() shows the personality picker;
// Controller.beginGame() fires once the player clicks Start Game.
render();

</script>
</body>
</html>
