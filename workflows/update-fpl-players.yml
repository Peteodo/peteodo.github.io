name: Update FPL players data

# Refreshes players.json once a day, and any time you trigger it manually
# from the Actions tab. This keeps the "10 and Done" player search working
# without the app ever needing to fetch the huge full FPL payload itself.

on:
  schedule:
    - cron: '0 6 * * *'   # 06:00 UTC daily — edit if you want a different time
  workflow_dispatch: {}    # adds a "Run workflow" button in the Actions tab

permissions:
  contents: write

jobs:
  update-players:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch and trim FPL player + team data
        run: |
          curl -s https://fantasy.premierleague.com/api/bootstrap-static/ | \
            jq '{
              elements: [.elements[] | {id, first_name, second_name, web_name, team}],
              teams: [.teams[] | {id, short_name}],
              updated: (now | todate)
            }' > players.json

      - name: Commit players.json if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add players.json
          git diff --staged --quiet || git commit -m "Update FPL players data"
          git push
