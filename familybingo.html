<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
<title>Family Bingo 🎉</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@700;800&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --gold: #FFD700;
    --bg: #1a0533;
    --accent: #6C3BE8;
    --accent-dark: #4c1d95;
    --member-glow: rgba(108,59,232,0.35);
  }

  body {
    font-family: 'Nunito', sans-serif;
    background: var(--bg);
    min-height: 100vh;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background:
      radial-gradient(ellipse at 15% 0%, var(--member-glow) 0%, transparent 55%),
      radial-gradient(ellipse at 85% 100%, rgba(236,72,153,0.2) 0%, transparent 55%);
  }

  /* ── HEADER ── */
  .header {
    background: linear-gradient(135deg, var(--accent-dark), var(--accent), var(--accent-dark));
    padding: 12px 14px 0;
    box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    position: relative; z-index: 10;
  }
  .header::before {
    content: '';
    position: absolute; inset: 0;
    background: repeating-linear-gradient(45deg, transparent, transparent 10px, rgba(255,255,255,0.03) 10px, rgba(255,255,255,0.03) 20px);
    pointer-events: none;
  }
  .header-title {
    font-family: 'Fredoka One', cursive;
    font-size: clamp(1.5rem, 5vw, 2.2rem);
    color: var(--gold);
    text-shadow: 0 0 20px rgba(255,215,0,0.6), 2px 2px 0 var(--accent);
    text-align: center; letter-spacing: 2px;
    position: relative; z-index: 1; margin-bottom: 4px;
  }
  .header-sub {
    color: rgba(255,255,255,0.6);
    text-align: center; font-size: 0.7rem; font-weight: 700;
    letter-spacing: 1px; text-transform: uppercase;
    position: relative; z-index: 1; margin-bottom: 10px;
  }

  /* ── TABS ── */
  .tabs {
    display: flex; gap: 4px;
    position: relative; z-index: 1;
    overflow-x: auto; scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    font-family: 'Fredoka One', cursive;
    font-size: 1rem; padding: 9px 18px;
    border: none; border-radius: 12px 12px 0 0;
    cursor: pointer; white-space: nowrap;
    transition: all 0.2s; flex-shrink: 0;
    color: rgba(255,255,255,0.5);
    background: rgba(255,255,255,0.08);
  }
  .tab:hover:not(.active) { background: rgba(255,255,255,0.16); color: rgba(255,255,255,0.85); }
  .tab.active {
    background: var(--bg);
    color: #fff;
    box-shadow: 0 -3px 0 0 var(--tab-color, #FFD700) inset;
  }
  .tab-progress {
    display: inline-block;
    background: rgba(255,255,255,0.15);
    border-radius: 10px; padding: 1px 7px;
    font-size: 0.65rem; margin-left: 5px;
    font-family: 'Nunito', sans-serif; font-weight: 800;
  }
  .tab.active .tab-progress { color: var(--tab-color,#FFD700); background: rgba(255,255,255,0.1); }

  /* ── REFRESH BAR ── */
  .refresh-bar {
    display: flex; align-items: center; justify-content: center;
    gap: 8px; padding: 6px 14px;
    background: rgba(0,0,0,0.3);
    border-bottom: 1px solid rgba(255,255,255,0.06);
    font-size: 0.68rem; color: rgba(255,255,255,0.32); font-weight: 700;
    position: relative; z-index: 9;
  }
  .refresh-btn {
    background: rgba(255,215,0,0.1); border: 1px solid rgba(255,215,0,0.25);
    color: #FFD700; font-family: 'Nunito', sans-serif;
    font-size: 0.68rem; font-weight: 800;
    padding: 3px 11px; border-radius: 20px;
    cursor: pointer; transition: all 0.2s;
  }
  .refresh-btn:hover { background: rgba(255,215,0,0.2); }
  .refresh-btn:disabled { opacity: 0.3; cursor: not-allowed; }

  /* ── MAIN ── */
  .main {
    padding: 12px 10px 50px;
    max-width: 540px; margin: 0 auto;
    position: relative; z-index: 1;
  }
  .board-panel { display: none; }
  .board-panel.active { display: block; }

  /* ── PROGRESS ── */
  .progress-label {
    font-size: 0.68rem; color: rgba(255,255,255,0.4);
    font-weight: 800; text-align: right;
    margin-bottom: 4px; letter-spacing: 0.5px;
  }
  .progress-wrap {
    margin-bottom: 10px;
    background: rgba(255,255,255,0.07);
    border-radius: 50px; height: 7px; overflow: hidden;
  }
  .progress-bar {
    height: 100%; border-radius: 50px;
    transition: width 0.4s ease;
  }

  /* ── GRID ── */
  /* Grid fills the viewport width minus padding; cells are square via aspect-ratio */
  .bingo-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 7px;
    width: 100%;
  }

  /* ── TILE ── */
  .tile {
    position: relative;
    aspect-ratio: 1 / 1;
    border-radius: 12px;
    cursor: pointer;
    overflow: hidden;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.2s;
    border: 2px solid rgba(255,255,255,0.09);
    box-shadow: 0 3px 10px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.07);
    /* flex so text can fill */
    display: flex; align-items: center; justify-content: center;
  }
  .tile:hover { transform: scale(1.04); box-shadow: 0 6px 18px rgba(0,0,0,0.5); }
  .tile:active { transform: scale(0.95); }

  .tile-bg {
    position: absolute; inset: 0; border-radius: inherit;
    transition: opacity 0.25s;
  }

  /* Text layer — fills tile with padding, vertically & horizontally centred */
  .tile-text-wrap {
    position: relative; z-index: 2;
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
    padding: 8px 6px;
    text-align: center;
  }
  .tile-text {
    font-family: 'Nunito', sans-serif;
    font-weight: 800;
    color: #e8d8ff;
    line-height: 1.15;
    word-break: break-word;
    hyphens: auto;
    /* font-size driven by JS fitText */
    width: 100%;
  }

  /* Crossed state */
  .tile.crossed {
    border-color: rgba(248,113,113,0.55);
    box-shadow: 0 3px 14px rgba(239,68,68,0.3), inset 0 1px 0 rgba(255,255,255,0.1);
  }
  .tile.crossed .tile-text { color: rgba(255,255,255,0.35); }

  /* X overlay */
  .tile-x {
    display: none;
    position: absolute; inset: 0; z-index: 3;
    align-items: center; justify-content: center;
    pointer-events: none;
  }
  .tile.crossed .tile-x { display: flex; }

  .x-circle {
    width: 54%; height: 54%;
    background: #ef4444;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 0 4px rgba(239,68,68,0.22), 0 3px 14px rgba(0,0,0,0.35);
    animation: x-pop 0.22s cubic-bezier(0.34,1.56,0.64,1) both;
  }
  .x-circle svg {
    width: 55%; height: 55%;
  }
  @keyframes x-pop {
    from { transform: scale(0) rotate(-30deg); opacity: 0; }
    to   { transform: scale(1) rotate(0deg);   opacity: 1; }
  }

  /* ── RESET BTN ── */
  .reset-btn {
    display: block; margin: 14px auto 0;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    color: rgba(255,255,255,0.38);
    font-family: 'Nunito', sans-serif; font-size: 0.72rem; font-weight: 800;
    padding: 7px 18px; border-radius: 20px;
    cursor: pointer; letter-spacing: 0.4px; transition: all 0.2s;
  }
  .reset-btn:hover { background: rgba(239,68,68,0.15); border-color: rgba(239,68,68,0.3); color: #fca5a5; }

  /* ── STATUS ── */
  .status-msg { text-align: center; padding: 60px 20px; font-size: 0.95rem; line-height: 1.8; position: relative; z-index: 1; }
  .status-msg.loading { color: rgba(255,255,255,0.45); }
  .status-msg.error   { color: #fca5a5; }
  .spinner {
    width: 38px; height: 38px;
    border: 4px solid rgba(255,255,255,0.08); border-top-color: var(--gold);
    border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 14px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── LINE OVERLAY (small reward) ── */
  .line-overlay {
    display: none; position: fixed; inset: 0; z-index: 900;
    background: rgba(5,0,20,0.82);
    align-items: center; justify-content: center; flex-direction: column;
    cursor: pointer;
  }
  .line-overlay.show { display: flex; }
  .line-emoji  { font-size: clamp(3rem,12vw,5rem); animation: pop 0.35s cubic-bezier(0.34,1.56,0.64,1) both; }
  .line-text   { font-family:'Fredoka One',cursive; font-size:clamp(1.6rem,7vw,3rem); color:#fff; margin-top:10px; animation: pop 0.35s 0.08s cubic-bezier(0.34,1.56,0.64,1) both; text-shadow:0 0 20px rgba(255,255,255,0.3); }
  .line-sub    { font-family:'Fredoka One',cursive; font-size:clamp(1rem,4vw,1.4rem); color:rgba(255,255,255,0.5); margin-top:6px; animation: pop 0.35s 0.16s cubic-bezier(0.34,1.56,0.64,1) both; }
  .overlay-tap { color:rgba(255,255,255,0.28); font-size:0.78rem; margin-top:24px; animation: fadeIn 1s 0.7s both; font-weight:700; letter-spacing:1px; text-transform:uppercase; }

  /* ── BINGO OVERLAY ── */
  .bingo-overlay {
    display: none; position: fixed; inset: 0; z-index: 1000;
    background: rgba(5,0,20,0.9);
    align-items: center; justify-content: center; flex-direction: column;
    cursor: pointer;
  }
  .bingo-overlay.show { display: flex; }
  .bingo-word {
    font-family: 'Fredoka One', cursive;
    font-size: clamp(5rem,20vw,9rem);
    color: var(--gold);
    text-shadow: 0 0 40px rgba(255,215,0,0.8), 4px 4px 0 #6C3BE8;
    animation: pop 0.5s cubic-bezier(0.34,1.56,0.64,1) both;
    letter-spacing: 4px;
  }
  .bingo-name { font-family:'Fredoka One',cursive; font-size:clamp(1.4rem,5vw,2.4rem); color:#e0d0ff; margin-top:8px; animation: pop 0.5s 0.15s cubic-bezier(0.34,1.56,0.64,1) both; }

  @keyframes pop {
    from { transform: scale(0) rotate(-8deg); opacity: 0; }
    to   { transform: scale(1) rotate(0deg);  opacity: 1; }
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  /* ── CONFETTI ── */
  .cp { position:fixed; top:-20px; border-radius:2px; animation:fall linear forwards; z-index:999; }
  @keyframes fall {
    0%   { transform:translateY(0) rotate(0deg); opacity:1; }
    100% { transform:translateY(110vh) rotate(720deg); opacity:0; }
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-title">🎉 FAMILY BINGO 🎉</div>
  <div class="header-sub">Tap a square to mark it off!</div>
  <div class="tabs" id="tabs"></div>
</div>

<div class="refresh-bar">
  <span id="lastLoaded">Loading…</span>
  <button class="refresh-btn" id="refreshBtn" onclick="loadData(true)">↻ Refresh</button>
</div>

<div class="main" id="main">
  <div class="status-msg loading"><div class="spinner"></div>Loading your family boards…</div>
</div>

<div class="line-overlay" id="lineOverlay">
  <div class="line-emoji">⭐</div>
  <div class="line-text" id="lineText">Line!</div>
  <div class="line-sub" id="lineSub"></div>
  <div class="overlay-tap">Tap to continue</div>
</div>

<div class="bingo-overlay" id="bingoOverlay">
  <div class="bingo-word">BINGO!</div>
  <div class="bingo-name" id="bingoName"></div>
  <div class="overlay-tap">Tap anywhere to continue</div>
</div>

<script>
// ── CONFIG ────────────────────────────────────────────────────────────────────
const SHEET_ID    = '1MK_tdaXP4Emr7zeUD00HZl8UwcI9425RuDVyYynDRvg';
const GID         = '832165623';
const STORAGE_KEY = 'familyBingo_v5';
const SHEET_CSV   = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&gid=${GID}`;
const BOARD_SIZE  = 9; // always 9 squares

const PROXIES = [
  u => `https://corsproxy.io/?${encodeURIComponent(u)}`,
  u => `https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`,
  u => `https://cors-anywhere.herokuapp.com/${u}`,
];

const PALETTE = [
  { primary:'#7C3AED', dark:'#4c1d95', tileDark:'#3b1275', tile:'#4a1d96', glow:'rgba(124,58,237,0.38)', tab:'#a78bfa', xColor:'#a78bfa' },
  { primary:'#DB2777', dark:'#831843', tileDark:'#5c0d3b', tile:'#7d1450', glow:'rgba(219,39,119,0.38)', tab:'#f472b6', xColor:'#f472b6' },
  { primary:'#0891B2', dark:'#164e63', tileDark:'#074a60', tile:'#0e5f7a', glow:'rgba(8,145,178,0.38)',  tab:'#38bdf8', xColor:'#38bdf8' },
  { primary:'#D97706', dark:'#78350f', tileDark:'#6b2d07', tile:'#92400e', glow:'rgba(217,119,6,0.38)',  tab:'#fbbf24', xColor:'#fbbf24' },
  { primary:'#059669', dark:'#064e3b', tileDark:'#044a37', tile:'#065f46', glow:'rgba(5,150,105,0.38)',  tab:'#34d399', xColor:'#34d399' },
];

const LINE_PATTERNS = [
  [0,1,2],[3,4,5],[6,7,8],
  [0,3,6],[1,4,7],[2,5,8],
  [0,4,8],[2,4,6],
];
const LINE_NAMES = ['top row','middle row','bottom row','left column','middle column','right column','diagonal ↘','diagonal ↙'];

// ── STATE ─────────────────────────────────────────────────────────────────────
let members   = [];
let crossed   = {};
let announcedLines = {};
let activeTab = 0;

// ── STORAGE ───────────────────────────────────────────────────────────────────
function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      crossed, announcedLines,
      boards: members.map(m => ({ name: m.name, board: m.board }))
    }));
  } catch(e) {}
}

function restoreBoards() {
  try {
    const raw = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
    crossed        = raw.crossed        || {};
    announcedLines = raw.announcedLines || {};
    if (raw.boards) raw.boards.forEach(b => {
      const m = members.find(x => x.name === b.name);
      if (m && b.board && b.board.length === BOARD_SIZE) {
        // validate all ids still exist in pool
        const ids = new Set(m.allItems.map(x => x.id));
        if (b.board.every(x => ids.has(x.id))) m.board = b.board;
      }
    });
  } catch(e) { crossed = {}; announcedLines = {}; }
}

// ── UTILITIES ─────────────────────────────────────────────────────────────────
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const xKey = (name, id) => `${name}__${id}`;
const isCrossed = (name, id) => !!crossed[xKey(name, id)];
const countCrossed = m => m.board ? m.board.filter(it => isCrossed(m.name, it.id)).length : 0;

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length-1; i>0; i--) { const j=~~(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

function buildBoard(m) {
  m.board = shuffle(m.allItems).slice(0, BOARD_SIZE);
}

// ── FETCH & PARSE ─────────────────────────────────────────────────────────────
async function fetchViaProxies(url) {
  const errs = [];
  for (const proxy of PROXIES) {
    try {
      const res = await fetch(proxy(url), { signal: AbortSignal.timeout(9000) });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const text = await res.text();
      if (text.trim().startsWith('<')) throw new Error('Got HTML not CSV');
      return text;
    } catch(e) { errs.push(e.message); }
  }
  throw new Error('All proxies failed: ' + errs.join(' | '));
}

function parseCSV(text) {
  return text.trim().split('\n').map(line => {
    const cols=[]; let cur='', inQ=false;
    for (const ch of line) {
      if (ch==='"') { inQ=!inQ; continue; }
      if (ch===',' && !inQ) { cols.push(cur.trim()); cur=''; continue; }
      cur+=ch;
    }
    cols.push(cur.trim());
    return cols;
  });
}

function buildMembers(rows) {
  const map = new Map();
  for (let i=1; i<rows.length; i++) {
    const [id, member, text] = rows[i];
    if (!id||!member||!text) continue;
    if (!map.has(member)) map.set(member, []);
    map.get(member).push({ id: id.replace(/\s/g,''), text });
  }
  return Array.from(map.entries()).map(([name, allItems]) => ({ name, allItems, board: null }));
}

// ── FIT TEXT ──────────────────────────────────────────────────────────────────
// After render, shrink/grow each tile's text to fill the tile as much as possible
function fitAllText() {
  document.querySelectorAll('.tile').forEach(tile => {
    const wrap = tile.querySelector('.tile-text-wrap');
    const span = tile.querySelector('.tile-text');
    if (!wrap || !span) return;

    const availW = wrap.clientWidth  - 16;
    const availH = wrap.clientHeight - 16;
    if (!availW || !availH) return;

    // Binary search font size between 9 and 48px
    let lo = 9, hi = 48, best = 9;
    span.style.whiteSpace = 'normal';
    for (let iter = 0; iter < 12; iter++) {
      const mid = (lo + hi) / 2;
      span.style.fontSize = mid + 'px';
      if (span.scrollWidth <= availW && span.scrollHeight <= availH) {
        best = mid; lo = mid + 0.5;
      } else {
        hi = mid - 0.5;
      }
    }
    span.style.fontSize = Math.max(9, best - 1) + 'px';
  });
}

// ── TOGGLE ────────────────────────────────────────────────────────────────────
function toggleTile(memberName, itemId) {
  const key = xKey(memberName, itemId);
  if (crossed[key]) delete crossed[key]; else crossed[key] = true;
  saveState();
  render();
  checkWins(memberName);
}

// ── WIN DETECTION ─────────────────────────────────────────────────────────────
function getCrossedIndices(m) {
  return new Set((m.board||[]).map((it,i) => isCrossed(m.name,it.id) ? i : -1).filter(i=>i>=0));
}

function checkWins(memberName) {
  const m = members.find(x => x.name === memberName);
  if (!m || !m.board) return;
  const cx = getCrossedIndices(m);
  if (cx.size === BOARD_SIZE) { triggerBingo(memberName); return; }
  for (let li=0; li<LINE_PATTERNS.length; li++) {
    if (LINE_PATTERNS[li].every(i => cx.has(i))) {
      const lk = `${memberName}__L${li}`;
      if (!announcedLines[lk]) {
        announcedLines[lk] = true;
        saveState();
        triggerLine(memberName, li);
        return;
      }
    }
  }
}

// ── RESET ─────────────────────────────────────────────────────────────────────
function resetBoard(memberName) {
  if (!confirm(`Reset ${memberName}'s board?\nNew squares will be randomly chosen.`)) return;
  const m = members.find(x => x.name === memberName);
  if (!m) return;
  Object.keys(crossed).forEach(k => { if (k.startsWith(memberName+'__')) delete crossed[k]; });
  Object.keys(announcedLines).forEach(k => { if (k.startsWith(memberName+'__')) delete announcedLines[k]; });
  buildBoard(m);
  saveState();
  render();
}

// ── SWITCH TAB ────────────────────────────────────────────────────────────────
function switchTab(i) { activeTab = i; render(); }

// ── RENDER ────────────────────────────────────────────────────────────────────
function render() {
  if (!members.length) return;
  const pal = PALETTE[activeTab % PALETTE.length];
  document.documentElement.style.setProperty('--member-glow', pal.glow);
  document.documentElement.style.setProperty('--accent',      pal.primary);
  document.documentElement.style.setProperty('--accent-dark', pal.dark);

  // Tabs
  document.getElementById('tabs').innerHTML = members.map((m,i) => {
    const p = PALETTE[i % PALETTE.length];
    const done = countCrossed(m);
    const total = m.board ? m.board.length : 0;
    return `<button class="tab ${i===activeTab?'active':''}"
      style="--tab-color:${p.tab}"
      onclick="switchTab(${i})">
      ${esc(m.name)}<span class="tab-progress">${done}/${total}</span>
    </button>`;
  }).join('');

  // Boards
  document.getElementById('main').innerHTML = members.map((m,mi) => {
    const p    = PALETTE[mi % PALETTE.length];
    const done = countCrossed(m);
    const total= m.board ? m.board.length : 0;
    const pct  = total ? Math.round(done/total*100) : 0;

    const tiles = (m.board||[]).map(item => {
      const x = isCrossed(m.name, item.id);
      const sn = m.name.replace(/\\/g,'\\\\').replace(/'/g,"\\'");
      const si = item.id.replace(/\\/g,'\\\\').replace(/'/g,"\\'");
      return `<div class="tile${x?' crossed':''}" onclick="toggleTile('${sn}','${si}')">
        <div class="tile-bg" style="background:linear-gradient(145deg,${x?'#1c1c1c,#2a2a2a':p.tileDark+','+p.tile})"></div>
        <div class="tile-text-wrap">
          <span class="tile-text">${esc(item.text)}</span>
        </div>
        <div class="tile-x">
          <div class="x-circle" style="background:${p.primary};box-shadow:0 0 0 4px ${p.glow},0 3px 14px rgba(0,0,0,0.35)">
            <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round">
              <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
          </div>
        </div>
      </div>`;
    }).join('');

    return `<div class="board-panel ${mi===activeTab?'active':''}" id="panel-${mi}">
      <div class="progress-label">${done} of ${total} marked off — ${pct}%</div>
      <div class="progress-wrap">
        <div class="progress-bar" style="width:${pct}%;background:linear-gradient(90deg,${p.dark},${p.primary})"></div>
      </div>
      <div class="bingo-grid">${tiles}</div>
      <button class="reset-btn" onclick="resetBoard('${m.name.replace(/'/g,"\\'")}')">↺ New random board for ${esc(m.name)}</button>
    </div>`;
  }).join('');

  // Fit text after DOM settles
  requestAnimationFrame(() => requestAnimationFrame(fitAllText));
}

// ── CELEBRATIONS ──────────────────────────────────────────────────────────────
function triggerLine(name, li) {
  document.getElementById('lineText').textContent = `${name} got a line! ⭐`;
  document.getElementById('lineSub').textContent  = LINE_NAMES[li] || '';
  document.getElementById('lineOverlay').classList.add('show');
  spawnConfetti(28, 1.2, 2.2);
}
document.getElementById('lineOverlay').addEventListener('click', () => {
  document.getElementById('lineOverlay').classList.remove('show');
});

function triggerBingo(name) {
  document.getElementById('bingoName').textContent = `🎊 ${name} wins! 🎊`;
  document.getElementById('bingoOverlay').classList.add('show');
  spawnConfetti(100, 1.5, 3.5);
}
document.getElementById('bingoOverlay').addEventListener('click', () => {
  document.getElementById('bingoOverlay').classList.remove('show');
  document.querySelectorAll('.cp').forEach(e=>e.remove());
});

const CC = ['#FFD700','#EC4899','#7C3AED','#22C55E','#0EA5C9','#F97316','#fff','#f472b6'];
function spawnConfetti(n, minD, maxD) {
  for (let i=0; i<n; i++) setTimeout(()=>{
    const el = document.createElement('div');
    el.className = 'cp';
    const d = minD + Math.random()*(maxD-minD);
    el.style.cssText = `left:${Math.random()*100}vw;background:${CC[~~(Math.random()*CC.length)]};
      animation-duration:${d}s;animation-delay:${Math.random()*0.6}s;
      transform:rotate(${Math.random()*360}deg);
      width:${5+Math.random()*8}px;height:${8+Math.random()*10}px;
      border-radius:${Math.random()>.5?'50%':'3px'}`;
    document.body.appendChild(el);
    el.addEventListener('animationend', ()=>el.remove());
  }, i*22);
}

// ── LOAD DATA ─────────────────────────────────────────────────────────────────
async function loadData(isRefresh=false) {
  const btn = document.getElementById('refreshBtn');
  const lbl = document.getElementById('lastLoaded');
  btn.disabled=true; btn.textContent='↻ Loading…';

  if (!members.length) {
    document.getElementById('main').innerHTML =
      '<div class="status-msg loading"><div class="spinner"></div>Loading your family boards…</div>';
  }

  try {
    const csv  = await fetchViaProxies(SHEET_CSV);
    const rows = parseCSV(csv);
    const fresh = buildMembers(rows);
    if (!fresh.length) throw new Error('No data rows found — check sheet columns: id, Family Member, text');

    members = fresh;

    // Restore saved boards & state BEFORE building missing boards
    restoreBoards();

    // Build boards for anyone who doesn't have one yet
    members.forEach(m => { if (!m.board || m.board.length !== BOARD_SIZE) buildBoard(m); });

    if (activeTab >= members.length) activeTab = 0;
    saveState();
    render();

    const now = new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
    lbl.textContent = `Last updated ${now}`;
  } catch(err) {
    console.error(err);
    if (!members.length) {
      document.getElementById('main').innerHTML = `<div class="status-msg error">
        <strong>⚠️ Couldn't load the spreadsheet</strong><br><br>
        ${err.message}<br><br>
        Make sure the sheet is shared as <em>"Anyone with the link can view"</em>, then tap Refresh.
      </div>`;
    }
    lbl.textContent = 'Load failed — tap Refresh to retry';
  } finally {
    btn.disabled=false; btn.textContent='↻ Refresh';
  }
}

// Also refit text on resize
window.addEventListener('resize', () => requestAnimationFrame(fitAllText));

loadData();
</script>
