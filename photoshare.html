.w{max-width:640px;margin:0 auto;padding:26px 16px 40px;text-align:center}

 else if(S.screen=='scores'){const mx=S.target,srt=[...S.pl].sort((a,b)=>b.score-a.score),top=srt[0],nx=S.pl[S.next];

  `<div style="margin-top:12px">${srt.map(p=>`<div class="sc ${p.gain?'up':''}"><div class=nm>${esc(p.name)}${p.gain?' ➕1':''}<div class=bar><i style="width:${Math.min(100,p.score/mx*100)}%"></i></div></div><div class=pt>${p.score}</div></div>`).join('')}</div>
  ${phCard()}<div style="margin:10px">Next Picker: <b class=f style="font-size:21px">${esc(nx.name)}</b> 👉</div><button class=g onclick=next()>Continue ▶</button><button class=r onclick=final()>End game</button>`}}
function choose(i){S.pick=S.card[i];S.screen='seek';render()}
function timer(){beep(1,.01);let t=secs;$('#go').disabled=true;const d=$('#tm');clearInterval(tm);

function final(q){document.body.dataset.s='final';const srt=[...S.pl].sort((a,b)=>b.score-a.score),m=srt[0].score,w=srt.filter(p=>p.score==m);

 <div style="margin-top:14px">${srt.map((p,i)=>`<div class="sc ${p.score==m?'lead':''}"><div class=pt>${i+1}</div><div class=nm>${esc(p.name)}</div><div class=pt>${p.score}</div></div>`).join('')}</div><button class=g onclick=recap()>📖 Game recap</button><button class=o onclick=again()>Play again</button>`;

function phCard(){const i=S.log.length-1,e=S.log[i];return `<div class=card><div class=hint>Winning photo for the recap (optional)</div>${e.photo?`<img class=th src='${e.photo}'>`:''}<button class='sm o' onclick='pp(${i})'>📷 ${e.photo?'Change photo':'Add winning photo'}</button><div class=hint style='margin-top:6px'>Either get the winner to send you the photo or go old school and just take a picture of the image on their phone!</div></div>`}

function txt(){const s=[...S.pl].sort((a,b)=>b.score-a.score),m=s[0].score;return '📷 Photo Share\n🏆 '+s.filter(p=>p.score==m).map(p=>p.name).join(' & ')+' won!\n'+s.map(p=>p.name+' '+p.score).join(' · ')+'\n\n'+S.log.map(e=>'Round '+e.r+': “'+e.p+'”\n   🏆 '+e.w+' (picked by '+e.pk+')').join('\n')}
function recap(){S.screen='recap';document.body.dataset.s='recap';const s=[...S.pl].sort((a,b)=>b.score-a.score),m=s[0].score;
 app.innerHTML=`<div class=big>Game recap</div><div class=tag style='background:var(--av)'>🏆 ${s.filter(p=>p.score==m).map(p=>esc(p.name)).join(' &amp; ')}</div><div style='margin:10px'>${s.map(p=>esc(p.name)+' '+p.score).join(' · ')}</div>${S.log.map((e,i)=>`<div class=pol>${e.photo?`<img class=ph0 src='${e.photo}'>`:`<div class=ph><span>${esc(e.p)}</span></div>`}<div class=cap><b>Round ${e.r}: ${esc(e.p)}</b><br>🏆 ${esc(e.w)} · picked by ${esc(e.pk)}<br><button class='sm w2' onclick='pp(${i})'>📷 ${e.photo?'Change':'Add'} photo</button></div></div>`).join('')}<button class=g onclick=copyRecap()>📋 Copy text summary</button><button class=o onclick=imgRecap()>🖼 Make recap image</button><div id=ri></div><button class=w2 onclick=final(1)>← Back</button>`}
async function copyRecap(){const t=txt(),el=$('#ri');try{await navigator.clipboard.writeText(t);el.innerHTML=`<div class=hint>Copied! Paste it into your group chat.</div>`}catch(e){el.innerHTML=`<textarea readonly style='width:100%;height:170px'>${esc(t)}</textarea>`;el.firstChild.select()}}
function wrap(x,t,mw,ml){let l='',o=[];for(const k of t.split(' ')){const n=l?l+' '+k:k;if(x.measureText(n).width>mw&&l){o.push(l);l=k}else l=n}o.push(l);return o.slice(0,ml)}
function shareImg(){try{navigator.share({files:[new File([S.blob],'photo-share-recap.jpg',{type:'image/jpeg'})],title:'Photo Share recap'}).catch(()=>{})}catch(e){}}
async function imgRecap(){const el=$('#ri'),L=S.log;el.textContent='Making image…';try{await document.fonts.load('40px Shrikhand')}catch(e){}
 const W=1080,F=n=>n+'px Shrikhand,Georgia,serif',rn=(i,k)=>{const v=Math.sin(i*127.1+k*311.7)*43758.5453;return v-Math.floor(v)},s=[...S.pl].sort((a,b)=>b.score-a.score),m=s[0].score;
 const im=await Promise.all(L.map(e=>new Promise(r=>{if(!e.photo)return r(null);const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=e.photo})));
 const col=[320,340],P=L.map((e,i)=>{const q=[400,360,420,380][i%4]-(rn(i,1)*24|0),c=col[0]<=col[1]?0:1,cx=50+c*510+235+(rn(i,2)-.5)*40,cy=col[c]+q/2+24;col[c]+=q+150+(rn(i,3)*60|0);return{q,cx,cy,rot:(rn(i,4)-.5)*.15}});
 const H=Math.max(...col)+50,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
 x.fillStyle='#f6ecd2';x.fillRect(0,0,W,H);x.fillStyle='#d8c79c';for(let a=20;a<W;a+=40)for(let b=80;b<H;b+=40){x.beginPath();x.arc(a,b,1.6,0,7);x.fill()}
 for(let a=40;a<W;a+=44){x.fillStyle='#d9ccab';x.beginPath();x.arc(a,30,9,0,7);x.fill();x.strokeStyle='#8c8c8c';x.lineWidth=6;x.lineCap='round';x.beginPath();x.moveTo(a,8);x.lineTo(a,34);x.stroke()}
 x.textAlign='center';x.save();x.translate(W/2,170);x.rotate(-.025);x.font=F(88);x.fillStyle='#e2672a';x.fillText('📷 Photo Share',4,4);x.fillStyle='#3b2416';x.fillText('📷 Photo Share',0,0);x.restore();
 x.font='italic 700 26px Georgia,serif';x.fillStyle='#6b4a35';x.fillText('Game night · '+new Date().toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'}),W/2,215);
 x.font=F(44);x.fillStyle='#d8432b';x.fillText('🏆 '+s.filter(p=>p.score==m).map(p=>p.name).join(' & '),W/2,268);x.font='italic 700 28px Georgia,serif';x.fillStyle='#3b2416';x.fillText(s.map(p=>p.name+' '+p.score).join(' · '),W/2,308);
 L.forEach((e,i)=>{const p=P[i],q=p.q,h=q/2;x.save();x.translate(p.cx,p.cy);x.rotate(p.rot);
  x.shadowColor='#0006';x.shadowBlur=14;x.shadowOffsetY=6;x.fillStyle='#fffaf0';x.fillRect(-h-8,-h-8,q+16,q+16);x.shadowColor='transparent';
  if(im[i]){const k=Math.min(im[i].width,im[i].height);x.drawImage(im[i],(im[i].width-k)/2,(im[i].height-k)/2,k,k,-h,-h,q,q)}

  [[-1,-1],[1,-1],[1,1],[-1,1]].forEach(([a,b])=>{const u=a*(h+8),v=b*(h+8),t=58;x.fillStyle='#3b2416';x.beginPath();x.moveTo(u,v);x.lineTo(u-a*t,v);x.lineTo(u,v-b*t);x.closePath();x.fill();x.strokeStyle='#8a6446';x.lineWidth=2;x.stroke()});
  x.fillStyle=['#f0b02ccc','#2d9bb6cc','#d8432bcc','#7fae3fcc'][i%4];x.save();x.translate((rn(i,6)-.5)*80,-h-8);x.rotate((rn(i,5)-.5)*.5);x.fillRect(-50,-14,100,28);x.restore();
  x.save();x.translate(0,h+30);x.rotate(-p.rot*1.6+.02);x.shadowColor='#0005';x.shadowBlur=8;x.shadowOffsetY=3;x.fillStyle='#fffdf5';x.fillRect(-q*.46,-34,q*.92,100);x.shadowColor='transparent';
  x.fillStyle='#3b2416';x.font='italic 700 22px Georgia,serif';wrap(x,'Round '+e.r+': '+e.p,q*.86,2).forEach((l,j)=>x.fillText(l,0,-3+j*25));
  x.fillStyle='#d8432b';x.font=F(26);x.fillText('🏆 '+e.w,0,56);

 el.innerHTML=`<img src='${c.toDataURL('image/jpeg',.9)}' style='width:100%;border-radius:6px;margin-top:10px'><div class=hint>Press and hold the image to save or share</div>`;
