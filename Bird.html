<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bird!</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f0fdf4; /* Soft bird-watching green */
            text-align: center;
            overflow: hidden;
        }

        #game-container {
            display: none;
        }

        #bird-display {
            font-size: 120px;
            cursor: pointer;
            transition: transform 0.1s, color 0.3s;
            user-select: none;
            display: inline-block;
            /* Using a specific bird-like font weight/style */
            color: #333; 
        }

        #bird-display:active {
            transform: scale(0.8);
        }

        #exultation {
            margin-bottom: 30px;
            font-size: 28px;
            font-weight: bold;
            color: #166534;
            height: 40px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }

        button.main-btn {
            padding: 15px 40px;
            font-size: 22px;
            background-color: #22c55e;
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: background 0.2s;
        }

        button.main-btn:hover {
            background-color: #16a34a;
        }

        .instruction-text {
            margin-top: 30px;
            font-size: 18px;
            color: #666;
        }
    </style>
</head>
<body>

    <div id="start-screen">
        <h1>Bird Game</h1>
        <p>Ready to spot some real birds?</p>
        <button class="main-btn" onclick="startGame()">New Game</button>
    </div>

    <div id="game-container">
        <div id="exultation">Keep your eyes peeled!</div>
        
        <!-- Wrapped in a div to handle the color change via CSS filter/color -->
        <div id="bird-display" onclick="spotBird()">🐦</div>

        <p class="instruction-text">Click the bird when you see a "BIRD!"</p>
        
        <button class="main-btn" onclick="location.reload()" style="margin-top: 40px; font-size: 14px; padding: 10px 20px; background-color: #94a3b8;">Reset Game</button>
    </div>

    <script>
        const exultations = [
            "Great work!", "Nice birding!", "Eagle eyes!", "What a find!",
            "Absolutely majestic!", "You've got the knack!", "Bird-tastic!",
            "Splendid spotting!", "A rare sight indeed!", "Top-tier birding!",
            "Look at those feathers!", "Incredible observation!", "You're a natural!",
            "Phenomenal focus!", "Wing-tastic catch!", "Feather-finder extraordinaire!",
            "Simply tweet-heart!", "Spectacular sighting!", "Bird-spotting champion!",
            "Magical discovery!", "Breathtaking!", "Expert level birding!"
        ];

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playRandomBirdSound() {
            const soundType = Math.floor(Math.random() * 3);
            
            if (soundType === 0) {
                // High Peep
                createChirp(2500, 0.1, 0.05);
            } else if (soundType === 1) {
                // Double Chirp
                createChirp(1800, 0.05, 0.03);
                setTimeout(() => createChirp(2100, 0.05, 0.03), 100);
            } else {
                // Up-Slide
                createChirp(1200, 0.2, 0.1, 2800);
            }
        }

        function createChirp(freq, duration, volume, endFreq = null) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            if (endFreq) {
                osc.frequency.exponentialRampToValueAtTime(endFreq, audioCtx.currentTime + duration);
            }

            gain.gain.setValueAtTime(volume, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        function getRandomColor() {
            const hue = Math.floor(Math.random() * 360);
            return `hsl(${hue}, 70%, 50%)`;
        }

        function startGame() {
            // Resume AudioContext (Browsers require a user click to start audio)
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('game-container').style.display = 'block';
        }

        function spotBird() {
            playRandomBirdSound();

            // Change Message
            const textElement = document.getElementById('exultation');
            textElement.innerText = exultations[Math.floor(Math.random() * exultations.length)];

            // Change Bird Color
            const bird = document.getElementById('bird-display');
            bird.style.color = getRandomColor();
            
            // Subtle random tilt
            bird.style.transform = `rotate(${Math.random() * 30 - 15}deg)`;
        }
    </script>
</body>
</html>
