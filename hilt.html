<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Hilt v1.5</title>
<script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
<style>
:root{--bg:#dc57a0;--card:#fff;--ink:#141414;--y:#f7a21b;--g:#3fb67a;--r:#e8505b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#a83a76}}
:root[data-theme="dark"]{--bg:#a83a76}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:600 16px/1.3 system-ui,sans-serif;min-height:100vh}
.w{max-width:680px;margin:0 auto;padding:12px 14px 40px;text-align:center}
.f,h1,h2,button,.tag,.cd b{font-family:'Lilita One',Impact,'Arial Black',sans-serif;font-weight:400}
.logo{font-size:clamp(44px,13vw,72px);line-height:1;margin:6px 0;color:#fff;letter-spacing:2px;text-transform:uppercase;text-shadow:-2px -2px 0 #141414,2px -2px 0 #141414,-2px 2px 0 #141414,2px 2px 0 #141414,5px 5px 0 var(--y),6px 6px 0 #141414}
.sub{color:#fff;font-weight:800;margin:6px 0 14px}
.card{background:var(--card);border:4px solid #141414;border-radius:18px;box-shadow:5px 5px 0 #141414;padding:14px;margin:12px 0}
.card h2{margin:0 0 8px;font-size:24px}
input{width:100%;font:inherit;font-weight:700;padding:10px 14px;border:3px solid #141414;border-radius:14px;background:#fff;color:#141414;margin:6px 0;text-align:center}
button{font-size:20px;padding:10px 20px;border:4px solid #141414;border-radius:14px;background:var(--y);color:#141414;box-shadow:4px 4px 0 #141414;cursor:pointer;margin:6px 4px}
button:active{transform:translate(3px,3px);box-shadow:1px 1px 0 #141414}button.g{background:var(--g)}button.r{background:var(--r);color:#fff}button.w2{background:#fff}button.sm{font-size:16px;padding:5px 12px}button:disabled{opacity:.45;pointer-events:none}
.tag{display:inline-block;background:#141414;color:#fff;border-radius:30px;padding:4px 14px;font-size:18px;margin:3px}
.code{font:400 54px 'Lilita One',Impact,sans-serif;letter-spacing:8px}
.pb{background:#fff;border:3px solid #141414;border-radius:14px;padding:8px 10px;margin:8px 0;text-align:left}
.pb.turn{background:#fff2b8;box-shadow:0 0 0 4px var(--g)}.pb.out{opacity:.6}
.hd{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.nm{font-size:19px;font-weight:800;flex:1}
.st{font-size:13px;opacity:.8}.rw{display:flex;gap:4px;flex-wrap:wrap;min-height:6px;margin-top:6px}
.cd{width:46px;height:64px;background:#141414;color:#fff;border:2px solid #141414;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;flex:none;user-select:none}
.cd b{font-size:26px;line-height:1}.cd small{font-size:9px;margin-top:2px;text-transform:uppercase;letter-spacing:.5px}
.cd.ft{background:#f7a21b;color:#141414}.cd.legend{background:#dc57a0;color:#fff}.cd.favor{background:#fff;color:#141414;border-color:#dc57a0}.cd.fury{background:#fff4b0}.cd.winter{background:#d7ecf7}
.cd.big{width:60px;height:84px}.cd.big b{font-size:34px}.cd.big.ft b{font-size:26px}.cd.big small{font-size:10px}
.cd.sel{transform:translateY(-10px);box-shadow:0 0 0 4px var(--g)}.cd.tg{cursor:pointer;box-shadow:0 0 0 3px var(--r)}.cd.tg.sel{box-shadow:0 0 0 4px var(--g)}
.hand{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;padding:14px 0 4px}.hand .cd{cursor:pointer}
.chip{display:inline-block;width:28px;height:28px;border-radius:50%;border:3px solid #141414;vertical-align:middle;text-align:center;font-size:15px;line-height:22px}
.log{font-size:14px;text-align:left;background:#0003;color:#fff;border-radius:12px;padding:8px 12px}
.log div:first-child{font-weight:800}.hero{color:#fff;font:400 clamp(34px,10vw,56px)/1 'Lilita One',Impact,sans-serif;text-shadow:3px 3px 0 #141414;margin:10px 0}
dialog{border:4px solid #141414;border-radius:18px;max-width:560px;text-align:left;box-shadow:5px 5px 0 #141414;background:#fff;color:#141414}dialog::backdrop{background:#0008}
.top{display:flex;justify-content:flex-end}
.hand{align-items:flex-end}.rw{align-items:flex-start}
.cd.ft{width:88px;height:114px;justify-content:flex-start;padding:6px 5px 5px;text-align:center}
.cd.ft b{font-size:30px;line-height:1.1}.cd.ft small{font-size:12px;font-weight:800;margin:1px 0 3px;letter-spacing:.4px}
.cd.ft i{font:600 10.5px/1.15 system-ui,sans-serif;font-style:normal;margin-top:auto;padding-top:3px;border-top:1.5px solid #14141466;width:100%}
.cd.big.ft{width:106px;height:142px}.cd.big.ft b{font-size:38px}.cd.big.ft small{font-size:13px}.cd.big.ft i{font-size:12px}
.pts{font:400 26px/1 'Lilita One',Impact,sans-serif;background:#141414;color:#fff;border-radius:20px;min-width:44px;padding:5px 10px;text-align:center}
.ldr{background:var(--g);border:2px solid #141414;border-radius:20px;padding:1px 10px;font:400 14px 'Lilita One',Impact,sans-serif}
.cd.mini,.cd.ft.mini{width:34px;height:46px;padding:0;justify-content:center;border-radius:6px}.cd.mini b,.cd.ft.mini b{font-size:18px}.cd.mini small,.cd.mini i{display:none}
</style></head><body><div class="w"><div class="top"><button class="sm w2" onclick="document.querySelector('#rules').showModal()">? Rules</button></div>
<div class="logo">Hilt</div><div class="sub">Winning is the easy part. · v1.5</div><div id="app"></div><div id="err" style="color:#fff;font-weight:800;margin-top:10px"></div></div>
<dialog id="rules"><div id="rl" style="font-size:15px"></div><div style="text-align:center"><button onclick="document.querySelector('#rules').close()">Got it</button></div></dialog>
<script>
const $=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sh=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const CN=['Pink','Orange','White'],CC=['#dc57a0','#f7a21b','#e9e9e9'],CS=['✿','☀','◎'];
const FATE={bait:['↩','Bait','Take one of your played force cards back into your hand. Bait takes its place (worth 0).'],fury:['2×','Fury','Doubles all your force cards. One Fury per player per battle.'],winter:['❄','Winter','Played mid-table, once per battle. Every force card is worth 1 (Fury still doubles). Legend is immune.'],crows:['⊕','Crows','The battle ends now. Highest total strength wins.'],doves:['⊗','Doves','The battle ends now. No winner; same chip and Favor next battle.'],legend:['10','Legend','Worth 10. Ignores Winter and Fury. Can’t be swapped by Bait.'],favor:['1','Favor','Worth 1. Last winner starts with it and picks the chip.']};
const SH={bait:'Swap a played force card back into your hand',fury:'Doubles all your force cards',winter:'Every force card is worth 1',crows:'Battle ends now. Highest total wins',doves:'Battle ends. No winner, nothing changes',legend:'Worth 10. Ignores Winter and Fury',favor:'Worth 1. Picks the next chip'};
const RULES=[['Goal','Win battles to collect chips. Three chips of one colour, or one of each colour, wins.'],['Deal','10 cards each, plus one extra for every chip you hold (on each redeal).'],['Battle','The Favor holder picks the chip. Play goes clockwise from their left. On your turn play a card to your row, or pass. If everyone else has passed you can keep playing until you pass. Highest total strength wins the chip and the Favor card (worth 1 next battle).'],['Ties','Fewest cards played wins, then the highest single card, then clockwise from the Favor holder.'],['Round end','When one or no players have cards left after a battle, the round ends: everything is reshuffled and redealt.'],['Passing','If you pass with no force (numbered) cards in hand you may discard your whole hand to speed up the round end.'],['Fate cards',Object.values(FATE).map(f=>f[1]+': '+f[2]).join(' ')],['Tip','Don’t be the last player with cards, but don’t overcommit either.']];
$('#rl').innerHTML=RULES.map(r=>`<p><b>${esc(r[0])}:</b> ${esc(r[1])}</p>`).join('');

/* ---------- engine ---------- */
const isN=c=>/^\d+$/.test(c.k),num=c=>isN(c)?+c.k:0,base=c=>c.k=='legend'?10:c.k=='favor'?1:num(c);
function mkDeck(){let id=0,d=[];const add=(k,n)=>{for(let i=0;i<n;i++)d.push({i:id++,k})};add('1',15);['2','3','4','5','6','10'].forEach(k=>add(k,8));add('bait',15);add('fury',6);add('legend',3);add('winter',3);add('crows',3);add('doves',3);return d}
function str(n,p){const f=p.row.some(c=>c.k=='fury')?2:1;return p.row.reduce((s,c)=>s+(c.k=='favor'?1:c.k=='legend'?10:isN(c)?(n.winter?1:num(c))*f:0),0)}
function deal(n){const pool=sh([...n.deck,...n.discard,...(n.mid||[]),...n.players.flatMap(p=>[...p.hand,...p.row.filter(c=>c.k!='favor')])]);
 n.players.forEach(p=>{p.hand=pool.splice(0,10+p.chips.reduce((a,b)=>a+b,0));p.row=[]});n.deck=pool;n.discard=[];n.mid=[]}
function nextActive(n,from){const N=n.players.length;for(let k=1;k<=N;k++){const j=(from+k)%N;if(!n.players[j].passed)return j}return -1}
function begin(n,keep){n.players.forEach(p=>{p.row=[];p.passed=!p.hand.length});n.players[n.favor].row=[{i:'f',k:'favor'}];n.winter=false;n.mid=[];n.turn=-1;
 if(keep)go(n);else n.phase='pick'}
function go(n){n.phase='battle';n.turn=nextActive(n,n.favor);if(n.turn<0)endBattle(n,'')}
const say=(n,m)=>{n.log=[m,...(n.log||[])].slice(0,6)};
function rank(n){const N=n.players.length;return n.players.map((p,j)=>({j,s:str(n,p),c:p.row.length,m:Math.max(0,...p.row.map(base)),d:(j-n.favor+N)%N})).sort((a,b)=>b.s-a.s||a.c-b.c||b.m-a.m||a.d-b.d)}
function tieReason(n,r){const top=r.filter(x=>x.s==r[0].s);if(top.length<2)return '';
 const nm=x=>n.players[x.j].name,L=(a,f)=>a.map(x=>nm(x)+' '+f(x)).join(', ');
 const jn=a=>a.length<2?a[0]:a.slice(0,-1).join(', ')+' and '+a[a.length-1];let t=`Tie on ${r[0].s} strength between ${jn(top.map(nm))}. `;
 const minC=Math.min(...top.map(x=>x.c)),a=top.filter(x=>x.c==minC);
 if(a.length<top.length){t+=`Tiebreak 1, fewest cards played: ${L(top,x=>'played '+x.c)}${top.some(x=>x.j==n.favor)?' (the Favor card counts as a played card)':''}. `;if(a.length==1)return t+`${nm(a[0])} wins.`}
 else t+=`Everyone tied played ${minC} card${minC==1?'':'s'}, so tiebreak 1 (fewest cards) doesn’t separate them. `;
 const maxM=Math.max(...a.map(x=>x.m)),b=a.filter(x=>x.m==maxM);
 if(b.length<a.length){t+=`Tiebreak 2, highest single card: ${L(a,x=>'has a '+x.m)}. `;if(b.length==1)return t+`${nm(b[0])} wins.`}
 else t+=`Their highest single cards are both ${maxM}, so tiebreak 2 doesn’t separate them. `;
 return t+`Tiebreak 3, clockwise from the Favor holder (${n.players[n.favor].name}): ${nm(b[0])} comes first and wins.`}
function endBattle(n,kind){const N=n.players.length,pl=n.players;let msg;const snap=pl.map(p=>({name:p.name,s:str(n,p),c:p.row.length,cards:p.row.map(c=>({k:c.k}))}));
 const sum={id:Math.random().toString(36).slice(2),round:n.round,chip:n.chip,kind:kind||'',winter:!!n.winter,winner:null,res:snap,newRound:0};n.summary=sum;
 const dump=()=>{pl.forEach(p=>{n.discard.push(...p.row.filter(c=>c.k!='favor'));p.row=[]});n.discard.push(...n.mid);n.mid=[]};
 if(kind=='doves'){dump();say(n,'🕊 Doves! No one wins. Same chip, same Favor.');}
 else{const r=rank(n);const w=r[0].j;sum.winner=pl[w].name;sum.tie=tieReason(n,r);sum.res=r.map(x=>({...snap[x.j],win:x.j==w}));dump();
  pl[w].chips[n.chip]++;n.favor=w;say(n,`🏆 ${pl[w].name} won the ${CN[n.chip]} chip with ${r[0].s} strength${kind=='crows'?' (Crows)':''}.`);
  if(pl[w].chips.some(c=>c>=3)||pl[w].chips.every(c=>c>=1)){n.phase='over';n.winner=w;return}}
 if(pl.filter(p=>p.hand.length).length<=1){pl.forEach(p=>{n.discard.push(...p.hand);p.hand=[]});n.round++;sum.newRound=n.round;deal(n);say(n,`🔄 Round ${n.round}: cards redealt.`)}
 begin(n,kind=='doves')}
function adv(n){if(n.players.every(p=>p.passed))endBattle(n,'');else n.turn=nextActive(n,n.turn)}

/* ---------- networking: public MQTT broker over secure websockets, host-authoritative ---------- */
const BROKERS=['wss://broker.emqx.io:8084/mqtt','wss://broker.hivemq.com:8884/mqtt'],NS='hiltgame-v1/';
let me='',code='',G=null,sel=null,tgt=null,myName='',cl=null,isHost=false,mode=null,revealed=null,auto=false,names=['Player 1','Player 2','Player 3'];
const err=m=>{$('#err').textContent=m||'';if(m)setTimeout(()=>{if($('#err').textContent==m)$('#err').textContent=''},12000)};
const rid=()=>Math.random().toString(36).slice(2,10),T=(s)=>NS+code+'/'+s;
const pub=(t,o,r)=>{try{cl&&cl.publish(t,typeof o=='string'?o:JSON.stringify(o),{retain:!!r})}catch(e){}};
function conn(opts,onMsg,onReady,onFail,i=0){if(i>=BROKERS.length){onFail();return}
 const c=mqtt.connect(BROKERS[i],{connectTimeout:8000,reconnectPeriod:0,keepalive:20,...opts});let up=false,moved=false;
 const next=()=>{if(up||moved)return;moved=true;clearTimeout(to);try{c.end(true)}catch(e){}conn(opts,onMsg,onReady,onFail,i+1)};
 const to=setTimeout(next,9000);
 c.on('connect',()=>{if(up||moved)return;up=true;clearTimeout(to);c.options.reconnectPeriod=2000;onReady(c)});
 c.on('error',next);
 c.on('message',(t,p)=>{try{onMsg(t,JSON.parse(p.toString()))}catch(e){}})}
function nameOk(){const e=$('#nm');if(e)myName=e.value.trim();if(!myName){err('Enter a name first.');return false}try{localStorage.setItem('hilt-name',myName)}catch(x){}return true}
function create(){if(!nameOk())return;mode='online';if(!window.mqtt){err('Couldn’t load the networking library. Check your connection.');return}
 code=Array.from({length:4},()=>'ABCDEFGHJKMNPQRSTUVWXYZ'[Math.random()*23|0]).join('');isHost=true;me='host';err('Opening game…');
 let taken=false;
 conn({clientId:'hilt-h-'+rid(),will:{topic:T('alive'),payload:'',retain:true}},(t,m)=>{if(t==T('alive')&&!G)taken=true;else if(t==T('h'))onHost(m)},
  c=>{cl=c;c.subscribe(T('alive'));c.subscribe(T('h'));
   setTimeout(()=>{if(taken){try{c.end(true)}catch(e){}cl=null;create();return}
    const up=()=>pub(T('alive'),'1',true);up();c.on('connect',()=>{up();c.subscribe(T('h'))});
    err('');G={v:1,phase:'lobby',host:'host',pls:[{id:'host',name:myName}]};render()},1500)},
  ()=>err('Can’t reach the game server. Your network may block it — try another network or mobile data.'))}
function onHost(m){if(!G||!m)return;const id=m.id;
 if(m.t=='join'){const nm=String(m.name||'Player').slice(0,14);
  if(G.phase=='lobby'){if(!G.pls.some(p=>p.id==id)){if(G.pls.length>=6){send(id,{t:'err',m:'Game is full.'});return}G.pls.push({id,name:nm})}}
  else if(!G.players.some(p=>p.id==id)){const p=G.players.find(p=>p.name==nm&&p.id!='host');if(!p){send(id,{t:'err',m:'That game has already started.'});return}p.id=id}
  G.v++;bcast();render()}
 else if(m.t=='act')hostAct(m.m,id);
 else if(m.t=='bye'&&G.phase=='lobby'){G.pls=G.pls.filter(p=>p.id!=id);G.v++;bcast();render()}}
function view(id){const n=JSON.parse(JSON.stringify(G));if(n.deck){n.deck=new Array(n.deck.length).fill(0);n.discard=[]}
 (n.players||[]).forEach(p=>{if(p.id!=id)p.hand=p.hand.map(()=>({k:'?'}))});return n}
const send=(id,o)=>pub(T('c/'+id),o);
function bcast(){(G.phase=='lobby'?G.pls:G.players).forEach(p=>{if(p.id!='host')send(p.id,{t:'state',s:view(p.id)})})}
function join(){if(!nameOk())return;mode='online';code=$('#cd').value.trim().toUpperCase();if(code.length!=4){err('Enter the 4-letter code.');return}
 if(!window.mqtt){err('Couldn’t load the networking library. Check your connection.');return}
 me=rid();let alive=false,got=false;err('Connecting to server…');
 conn({clientId:'hilt-c-'+me,will:{topic:T('h'),payload:JSON.stringify({t:'bye',id:me})}},(t,m)=>{
   if(t==T('alive'))alive=true;
   else if(m.t=='state'){got=true;err('');if(!G||m.s.v>=G.v){G=m.s;render()}}
   else if(m.t=='err'){err(m.m);onlineHome()}},
  c=>{cl=c;c.subscribe(T('alive'));c.subscribe(T('c/'+me));err('Looking for game '+code+'…');
   const hello=()=>pub(T('h'),{t:'join',id:me,name:myName});
   setTimeout(()=>{if(!alive){err('No game with that code. Check the code, and make sure the host’s tab is still open.');onlineHome();return}
    hello();c.on('connect',()=>{if(G)hello()});
    setTimeout(()=>{if(!got&&cl===c){err('The host didn’t answer. Make sure their tab is open and in front, then try again.');onlineHome()}},8000)},1800)},
  ()=>err('Can’t reach the game server. Your network may block it — try another network or mobile data.'))}
function dispatch(m){if(mode=='local')hostAct(m,(m.a=='start'||m.a=='again')?'host':me);else if(isHost)hostAct(m,'host');else if(cl&&cl.connected)pub(T('h'),{t:'act',id:me,m});else err('Not connected.')}
function hostAct(m,who){if(!G)return;const n=JSON.parse(JSON.stringify(G));if(apply(n,who,m)===false)return;n.v=G.v+1;G=n;sel=tgt=null;if(mode=='online')bcast();render()}

function cleanup(){if(cl){try{if(isHost)pub(T('alive'),'',true);else pub(T('h'),{t:'bye',id:me});cl.end()}catch(e){}cl=null}
 isHost=false;G=null;sel=tgt=null;revealed=null;mode=null}
function home(){cleanup();err('');
 app.innerHTML=`<div class=card><h2>How do you want to play?</h2>
 <button class=g onclick=localSetup()>📱 Local — pass the pad</button><div class=st>One device, passed around the table. Great for testing.</div>
 <button onclick=onlineHome()>🌐 Online — each on their own device</button><div class=st>Create a game and share a 4-letter code. No account needed.</div></div>`}
function onlineHome(){cleanup();mode='online';try{myName=myName||localStorage.getItem('hilt-name')||''}catch(e){}
 app.innerHTML=`<div class=card><h2>Your name</h2><input id=nm maxlength=14 placeholder="Name" value="${esc(myName)}">
 <button class=g onclick=create()>Create game</button><h2 style="margin-top:14px">…or join a friend</h2><input id=cd maxlength=4 placeholder="CODE" style="text-transform:uppercase">
 <button onclick=join()>Join game</button><div class=st>The host keeps their tab open during play.</div><button class="sm w2" onclick="home()">← Back</button></div>`}
/* ---------- local pass-the-pad mode ---------- */
function localSetup(){cleanup();mode='local';
 app.innerHTML=`<div class=card><h2>Players</h2>${names.map((n,i)=>`<input value="${esc(n)}" maxlength=14 oninput="names[${i}]=this.value">`).join('')}
 <div><button class="sm w2" onclick="addP(-1)" ${names.length<=2?'disabled':''}>− Remove</button><button class="sm w2" onclick="addP(1)" ${names.length>=6?'disabled':''}>+ Add player</button></div>
 <button class=g onclick=startLocal()>Start game</button><div class=st>Hands are hidden between turns. Tick “Test mode” in-game to skip the hand-over screens.</div><button class="sm w2" onclick="home()">← Back</button></div>`}
function addP(d){if(d>0&&names.length<6)names.push('Player '+(names.length+1));if(d<0&&names.length>2)names.pop();localSetup()}
function startLocal(){mode='local';code='Pass the pad';me='host';revealed=null;
 G={v:1,phase:'lobby',host:'host',pls:names.map((n,i)=>({id:'p'+i,name:(n.trim()||'Player '+(i+1)).slice(0,14)}))};hostAct({a:'start'},'host')}
const toggleAuto=()=>{auto=!auto;render()};
function actor(){if(!G||G.phase=='lobby'||G.phase=='over')return null;if(G.phase=='pick')return G.players[G.favor].id;const p=G.players[G.turn];return p?p.id:null}
let seen='';
function showSummary(){const S=G.summary,lab=c=>FATE[c.k]?FATE[c.k][1]:c.k;
 const t=S.kind=='doves'?'🕊 Doves — no winner':'🏆 '+esc(S.winner)+' wins the '+CN[S.chip]+' chip'+(S.kind=='crows'?' (Crows)':'');
 app.innerHTML=`<div class=card><div class=st>Battle result · Round ${S.round}</div><h2 style="font-size:28px;margin:6px 0">${t}</h2>
 ${S.tie?`<div class=pb style="background:#fff2b8;margin:10px 0">⚖️ <b>Tie-break:</b> ${esc(S.tie)}</div>`:''}
 ${S.kind!='doves'?`<span class=chip style="background:${CC[S.chip]}">${CS[S.chip]}</span>`:''}
 ${S.res.map(r=>`<div class="pb ${r.win?'turn':''}"><div class=hd><span class=nm>${r.win?'🏆 ':''}${esc(r.name)}</span><span class=pts>${r.s}</span></div>
 <div class=st>${r.s} strength · ${r.c} card${r.c==1?'':'s'} played: ${esc(r.cards.map(lab).join(', ')||'none')}</div><div class=rw>${r.cards.map(c=>cd(c,'mini')).join('')}</div></div>`).join('')}
 ${S.winter?'<div class=st>❄ Winter was in play: force cards counted as 1.</div>':''}
 ${S.newRound?`<div class=st>🔄 Round ${S.newRound} begins: all cards reshuffled and redealt.</div>`:''}
 <button class=g onclick="seen='${S.id}';render()">${G.phase=='over'?'See final result':'Continue'}</button></div>`}
function render(){if(G&&G.summary&&G.phase!='lobby'&&G.summary.id!==seen){showSummary();return}if(mode=='local')localRender();else render2()}
function localRender(){if(!G)return;if(G.phase=='lobby'){localSetup();return}
 if(G.phase=='over'){me='host';render2();return}
 const a=actor();if(auto)revealed=a;
 if(a!==revealed){const p=G.players.find(x=>x.id==a);
  app.innerHTML=`<div><span class=tag>🔁 Pass the pad</span><button class="sm w2" onclick="home()">Leave</button><button class="sm w2" onclick="toggleAuto()">☐ Test mode</button></div>
  <div class=card><div class=st>Hand over the device to</div><div class=code style="font-size:44px;letter-spacing:2px">${esc(p.name)}</div>
  <div class=st>${esc((G.log||[])[0]||'')}</div><button class=g onclick="revealed='${a}';render()">I’m ${esc(p.name)} — show my hand</button></div>`;return}
 me=a;render2()}

/* ---------- actions (run on the host) ---------- */
function apply(n,who,m){const p=n.players&&n.players[n.turn];
 if(m.a=='start'){if(who!='host'||n.phase!='lobby'||n.pls.length<2)return false;
  Object.assign(n,{phase:'pick',round:1,deck:mkDeck(),discard:[],mid:[],log:[],chip:null,winner:null,winter:false,
   players:n.pls.map(q=>({id:q.id,name:q.name,hand:[],row:[],passed:false,chips:[0,0,0]})),favor:Math.random()*n.pls.length|0});
  delete n.pls;deal(n);begin(n,false);say(n,'Game on! '+n.players[n.favor].name+' holds the Favor.');return}
 if(m.a=='again'){if(who!='host'||n.phase!='over')return false;const pls=n.players.map(q=>({id:q.id,name:q.name}));for(const k of Object.keys(n))if(k!='v'&&k!='host')delete n[k];n.phase='lobby';n.pls=pls;return}
 if(m.a=='pick'){if(n.phase!='pick'||n.players[n.favor].id!=who||![0,1,2].includes(m.c))return false;n.chip=m.c;go(n);return}
 if(n.phase!='battle'||!p||p.id!=who)return false;
 if(m.a=='pass'){p.passed=true;if(m.dis&&!p.hand.some(isN)){n.discard.push(...p.hand);p.hand=[];say(n,`${p.name} passed and discarded their hand.`)}else say(n,`${p.name} passed.`);adv(n);return}
 if(m.a=='play'){const c=p.hand[m.sel];if(!c)return false;
  if(c.k=='fury'&&p.row.some(x=>x.k=='fury'))return false;if(c.k=='winter'&&n.winter)return false;
  if(c.k=='bait'){const t=p.row[m.tgt];if(!t||!isN(t))return false;p.hand.splice(m.sel,1);p.hand.push(t);p.row[m.tgt]=c;say(n,`${p.name} played Bait and took back a ${t.k}.`)}
  else{p.hand.splice(m.sel,1);if(c.k=='winter'){n.winter=true;n.mid.push(c);say(n,`❄ ${p.name} played Winter!`)}else{p.row.push(c);say(n,`${p.name} played ${FATE[c.k]?FATE[c.k][1]:c.k}.`)}}
  if(c.k=='crows'){endBattle(n,'crows');return}if(c.k=='doves'){endBattle(n,'doves');return}
  if(!p.hand.length)p.passed=true;adv(n);return}
 return false}
const start=()=>dispatch({a:'start'}),pick=c=>dispatch({a:'pick',c}),play=()=>dispatch({a:'play',sel,tgt}),pass=d=>dispatch({a:'pass',dis:!!d}),again=()=>dispatch({a:'again'});
const pickSel=i=>{sel=sel===i?null:i;tgt=null;render()},pickTgt=i=>{tgt=i;render()};

/* ---------- views ---------- */
const cd=(c,cls='',oc='')=>{const f=FATE[c.k];return `<div class="cd ${f?'ft '+c.k:''} ${cls}" ${oc} title="${f?esc(f[1]+': '+f[2]):''}"><b>${f?f[0]:c.k}</b>${f?`<small>${f[1]}</small><i>${SH[c.k]}</i>`:''}</div>`};
const chips=p=>p.chips.map((n,i)=>n?`<span class=chip style="background:${CC[i]}" title="${CN[i]}">${n>1?n:CS[i]}</span>`:'').join(' ')||'<span class=st>no chips</span>';
function render2(){if(!G)return;
 const head=`<div><span class=tag>${mode=='local'?'🔁 Pass the pad':'Game '+code}</span>${G.round?`<span class=tag>Round ${G.round}</span>`:''}<button class="sm w2" onclick="home()">Leave</button>${mode=='local'?`<button class="sm w2" onclick="toggleAuto()">${auto?'☑':'☐'} Test mode</button>`:''}</div>`;
 if(G.phase=='lobby'){app.innerHTML=head+`<div class=card><div class=st>Share this code with friends</div><div class=code>${code}</div><h2>Players (${G.pls.length}/6)</h2>
  ${G.pls.map((p,i)=>`<div class=pb><span class=nm>${esc(p.name)}${p.id==me?' (you)':''}${p.id==G.host?' 👑':''}</span></div>`).join('')}
  ${G.host==me?`<button class=g ${G.pls.length<2||G.pls.length>6?'disabled':''} onclick=start()>Start game</button><div class=st>2–6 players</div>`:'<div class=st>Waiting for the host to start…</div>'}</div>`;return}
 const mi=G.players.findIndex(p=>p.id==me),M=G.players[mi],T=G.players[G.turn],myTurn=G.phase=='battle'&&T&&T.id==me;
 const lead=G.phase=='battle'?rank(G)[0].j:-1;
 let h=head+`<div>${G.chip!=null&&G.phase!='over'?`<span class=tag>Battle for <span class=chip style="background:${CC[G.chip]}">${CS[G.chip]}</span> ${CN[G.chip]}</span>`:''}${G.winter?'<span class=tag style="background:#4a9fd0">❄ Winter</span>':''}<span class=tag>Deck ${G.deck.length}</span></div>`;
 if(G.phase=='over'){const w=G.players[G.winner];h+=`<div class=hero>🏆 ${esc(w.name)} wins!</div>${G.players.map(p=>`<div class=pb><span class=nm>${esc(p.name)}</span> ${chips(p)}</div>`).join('')}${G.host==me?'<button class=g onclick=again()>Back to lobby</button>':'<div class=st style="color:#fff">Waiting for host…</div>'}`}
 else{h+=G.players.map((p,j)=>`<div class="pb ${j==G.turn&&G.phase=='battle'?'turn':''} ${p.passed?'out':''}"><div class=hd><span class=nm>${esc(p.name)}${p.id==me?' (you)':''}${j==G.favor?' ⚑':''}</span>${lead==j?'<span class=ldr>Leading</span>':''}${chips(p)}<span class=pts title="Current strength">${str(G,p)}</span></div>
  <div class=st>${p.hand.length} in hand · ${p.row.length} played${p.passed&&G.phase=='battle'?' · passed':''}${j==G.turn&&G.phase=='battle'?' · <b>thinking…</b>':''}</div>
  <div class=rw>${p.row.map((c,k)=>cd(c,(j==mi&&sel!=null&&M.hand[sel]?.k=='bait'&&isN(c)?'tg ':'')+(j==mi&&tgt===k?'sel':''),j==mi&&sel!=null&&M.hand[sel]?.k=='bait'&&isN(c)?`onclick="pickTgt(${k})"`:'')).join('')}</div></div>`).join('');
  h+=`<div class=card>`;
  if(G.phase=='pick')h+=G.players[G.favor].id==me?`<h2>You hold the Favor — pick a chip</h2>${[0,1,2].map(c=>`<button onclick=pick(${c}) style="background:${CC[c]}">${CS[c]} ${CN[c]}</button>`).join('')}`:`<h2>${esc(G.players[G.favor].name)} is picking a chip…</h2>`;
  else if(M){const sc=sel!=null?M.hand[sel]:null,bait=sc&&sc.k=='bait',ok=myTurn&&sc&&!(sc.k=='fury'&&M.row.some(x=>x.k=='fury'))&&!(sc.k=='winter'&&G.winter)&&(!bait||(tgt!=null&&M.row[tgt]&&isN(M.row[tgt])));
   h+=`<h2>${myTurn?'Your turn':'Your hand'}</h2><div class=st>${sc?(FATE[sc.k]?esc(FATE[sc.k][1]+': '+FATE[sc.k][2]):'Force card: adds '+sc.k+' strength.')+(bait?' Now tap a numbered card in your row.':''):'Tap a card to select it.'}</div>
   <div class=hand>${M.hand.map((c,i)=>cd(c,'big '+(sel===i?'sel':''),`onclick="pickSel(${i})"`)).join('')||'<span class=st>No cards left</span>'}</div>
   ${myTurn?`<button class=g ${ok?'':'disabled'} onclick=play()>Play card</button><button class=r onclick="pass(false)">Pass</button>${!M.hand.some(isN)&&M.hand.length?'<button class="r" onclick="pass(true)">Pass &amp; discard hand</button>':''}`:''}`}
  else h+='<h2>Spectating</h2>';
  h+='</div>'}
 h+=`<div class=log>${(G.log||[]).map(m=>`<div>${esc(m)}</div>`).join('')}</div>`;app.innerHTML=h}
home();
</script></body></html>
