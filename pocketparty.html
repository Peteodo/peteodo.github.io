<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pocket Party v1.2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fredoka:wght@500;600;700&family=Lilita+One&display=swap" rel="stylesheet">
<style>
/* Layout: one phone-width column on a bold colour world that changes per game.
   Everything interactive is a chunky outlined "sticker" with a hard offset shadow. */
:root{
  --ink:#1d1230; --paper:#fffaf0; --mute:#5a4a78; --line:#1d1230;
  --bg:#ffd23f; --accent:#3a86ff; --on-a:#ffffff; --pop:#ff5fa2;
  --danger:#c4162a;
  --bs:90%; --bl:64%;
  --font-d:'Lilita One','Fredoka',ui-rounded,'Avenir Next Rounded',system-ui,sans-serif;
  --font-u:'Fredoka',ui-rounded,'Avenir Next Rounded',system-ui,sans-serif;
  --font-b:'DM Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:light;
}
.t-lobby{--bg:#ffd23f;--accent:#3a86ff;--on-a:#ffffff;--pop:#ff5fa2}
.t-herd{--bg:#ff7ab6;--accent:#ffe14d;--on-a:#1d1230;--pop:#7b5cff}
.t-blob{--bg:#62e3a0;--accent:#7b5cff;--on-a:#ffffff;--pop:#ffd23f}
.t-insider{--bg:#8f73ff;--accent:#ff9f1c;--on-a:#1d1230;--pop:#3dd6d0}
*{box-sizing:border-box;font-synthesis-weight:none}
html{min-height:100%}
body{margin:0;min-height:100vh;color:var(--ink);font:16px/1.45 var(--font-b);-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;
  background-color:var(--bg);
  background-image:radial-gradient(rgba(255,255,255,.42) 2.5px,transparent 3px);background-size:26px 26px;
  transition:background-color .45s}
.deco{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.deco i{position:absolute;display:block;opacity:.5}
.deco i:nth-child(1){width:150px;height:150px;border-radius:50%;background:var(--pop);right:-50px;top:70px}
.deco i:nth-child(2){width:110px;height:110px;border-radius:28px;background:var(--accent);left:-40px;bottom:190px;transform:rotate(22deg)}
.deco i:nth-child(3){width:90px;height:90px;background:#fff;right:12%;bottom:120px;clip-path:polygon(50% 0,100% 100%,0 100%);transform:rotate(14deg)}
.deco i:nth-child(4){width:60px;height:60px;border-radius:50%;border:10px solid #fff;left:-26px;top:46%}
.deco i:nth-child(5){width:70px;height:70px;background:var(--pop);left:56%;top:-26px;border-radius:30% 70% 60% 40%/40% 50% 50% 60%}
@media (prefers-reduced-motion:no-preference){
  .deco i{animation:bob 9s ease-in-out infinite}
  .deco i:nth-child(2n){animation-duration:12s;animation-direction:reverse}
  @keyframes bob{0%,100%{translate:0 0}50%{translate:0 -18px}}
}
#app{position:relative;z-index:1;max-width:520px;margin:0 auto;padding:max(14px,env(safe-area-inset-top,0px)) 16px 24px}
#top{display:flex;align-items:center;gap:10px;padding-bottom:14px}
#top[hidden]{display:none}
.pill{font:600 13px var(--font-u);letter-spacing:.1em;text-transform:uppercase;background:var(--paper);border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink);padding:4px 12px;border-radius:999px;white-space:nowrap}
#who{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:600 17px var(--font-u)}
.dot{width:14px;height:14px;border-radius:50%;background:#18c76a;border:3px solid var(--ink);flex:none}
.dot.off{background:#ff3b5c}
#stage{display:flex;flex-direction:column;gap:16px}
.kicker{align-self:flex-start;background:var(--ink);color:var(--paper);font:600 12px var(--font-u);letter-spacing:.12em;text-transform:uppercase;padding:5px 12px;border-radius:999px}
.title{font:700 40px/1.04 var(--font-d);margin:0;text-wrap:balance;overflow-wrap:anywhere;text-shadow:3px 3px 0 rgba(255,255,255,.55)}
.tx{margin:0;overflow-wrap:anywhere;font-weight:500}
.tx.dim{font-size:17px}
.tx.big{font:700 32px/1.1 var(--font-d);background:var(--paper);border:3px solid var(--ink);border-radius:20px;box-shadow:4px 4px 0 var(--ink);padding:12px 16px}
.tx.note{font-size:14px;font-weight:700}
.tx.err{color:var(--danger);font-weight:700;min-height:1.4em;background:var(--paper);border-radius:12px;padding:0 10px}
.tx.err:empty{display:none}
.prompt{background:var(--accent);color:var(--on-a);border:3px solid var(--ink);box-shadow:6px 6px 0 var(--ink);border-radius:28px;padding:18px 20px 22px;transform:rotate(-1.2deg)}
.prompt .pk{display:inline-block;background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:999px;font:600 12px var(--font-u);letter-spacing:.12em;text-transform:uppercase;padding:3px 12px}
.prompt .pt{font:700 42px/1.04 var(--font-d);margin-top:10px;overflow-wrap:anywhere;text-wrap:balance}
.prompt .pt.q{font-size:34px}
.btn{display:block;width:100%;min-height:56px;border-radius:18px;border:3px solid var(--ink);background:var(--paper);color:var(--ink);font:600 18px var(--font-u);padding:10px 16px;cursor:pointer;text-align:center;box-shadow:0 5px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(5px);box-shadow:0 0 0 var(--ink)}
.btn.primary{background:var(--accent);color:var(--on-a)}
.btn.ghost{background:var(--paper)}
.btn.danger{background:#ffe3e6;color:var(--danger)}
.btn[disabled]{opacity:.5;cursor:default}
.btn:focus-visible,.field:focus-visible,.grp:focus-visible,.card:focus-visible,.secret:focus-visible{outline:4px solid var(--ink);outline-offset:3px}
.field{width:100%;min-height:56px;border-radius:18px;border:3px solid var(--ink);background:var(--paper);color:var(--ink);font:600 19px var(--font-u);padding:0 16px;min-width:0;box-shadow:inset 0 3px 0 rgba(29,18,48,.1)}
.field::placeholder{color:#8b7ca6;font-weight:500}
.field.code{font:700 34px var(--font-d);letter-spacing:.3em;text-transform:uppercase;text-align:center;padding-left:.3em}
label.lb{font:600 13px var(--font-u);letter-spacing:.12em;text-transform:uppercase}
.row{display:flex;gap:10px}
.row>.field{flex:1}
.row>.btn{width:auto;flex:none}
.grid2{display:flex;flex-direction:column;gap:6px}
.share{background:var(--paper);border:3px solid var(--ink);border-radius:26px;box-shadow:6px 6px 0 var(--ink);padding:16px;display:flex;flex-direction:column;gap:10px}
.share .code{font:700 64px/1 var(--font-d);letter-spacing:.08em;text-align:center}
.share .code span{display:inline-block;color:var(--c);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:3px 3px 0 var(--ink);transform:rotate(var(--r))}
.share .tl{font:600 13px var(--font-u);letter-spacing:.12em;text-transform:uppercase;text-align:center;color:var(--mute)}
.share .field{min-height:48px;font-size:14px;box-shadow:none}
.av{--h:200;width:34px;height:34px;flex:none;border-radius:50%;background:hsl(var(--h) 92% 64%);border:3px solid var(--ink);display:grid;place-items:center;font:700 17px/1 var(--font-d);color:var(--ink)}
.roster{display:flex;flex-wrap:wrap;gap:10px}
.chip{display:flex;align-items:center;gap:8px;background:var(--paper);border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink);border-radius:999px;padding:4px 14px 4px 4px;font:600 16px var(--font-u)}
.chip .av{width:28px;height:28px;font-size:14px;border-width:2.5px}
.chip.off{opacity:.55}
.chip small{font:600 11px var(--font-u);letter-spacing:.08em;text-transform:uppercase;background:var(--ink);color:var(--paper);border-radius:999px;padding:1px 7px}
.cards{display:flex;flex-direction:column;gap:14px}
.card{display:flex;gap:14px;align-items:center;width:100%;text-align:left;border:3px solid var(--ink);background:var(--paper);color:var(--ink);border-radius:24px;box-shadow:5px 5px 0 var(--ink);padding:12px 14px;cursor:pointer;font:inherit;transition:transform .08s,box-shadow .08s}
.card:active:not([disabled]){transform:translate(5px,5px);box-shadow:0 0 0 var(--ink)}
.card[disabled]{opacity:.55;cursor:default;box-shadow:3px 3px 0 var(--ink)}
.card .ic{flex:none;width:68px;height:68px;border-radius:20px;border:3px solid var(--ink);background:var(--bg);display:grid;place-items:center}
.card .ic svg{width:48px;height:48px}
.card .cb{min-width:0}
.card .ct{font:700 25px/1.1 var(--font-d)}
.card .cd{font-size:14px;margin-top:2px;color:var(--mute);font-weight:500}
.card .cs{display:inline-block;margin-top:6px;font:600 11px var(--font-u);letter-spacing:.08em;text-transform:uppercase;background:var(--accent);color:var(--on-a);border-radius:999px;padding:2px 10px;border:2px solid var(--ink)}
.list{display:flex;flex-direction:column;gap:12px}
.grp{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:3px solid var(--ink);background:var(--paper);color:var(--ink);border-radius:20px;box-shadow:4px 4px 0 var(--ink);padding:10px 14px;font:inherit}
button.grp{cursor:pointer;transition:transform .08s,box-shadow .08s}
button.grp:active{transform:translate(4px,4px);box-shadow:0 0 0 var(--ink)}
.grp.sel{background:var(--pop);transform:rotate(-1.2deg) scale(1.02)}
.grp .n{flex:none;min-width:40px;height:40px;border-radius:50%;background:var(--accent);color:var(--on-a);border:3px solid var(--ink);display:grid;place-items:center;font:700 21px var(--font-d)}
.grp .m{flex:1;min-width:0}
.grp .l{font:700 24px/1.1 var(--font-d);overflow-wrap:anywhere}
.grp .w{color:var(--mute);font-size:14px;font-weight:500;overflow-wrap:anywhere}
.tag{flex:none;font:600 12px var(--font-u);letter-spacing:.08em;text-transform:uppercase;background:var(--pop);color:var(--ink);border:2.5px solid var(--ink);border-radius:999px;padding:3px 10px}
.tag.cow{background:#ff7ab6}
.score{display:flex;align-items:center;gap:10px;padding:8px 14px 8px 8px;background:var(--paper);border:3px solid var(--ink);border-radius:20px;box-shadow:3px 3px 0 var(--ink)}
.score.you{outline:4px solid var(--ink);outline-offset:2px}
.score.lead{background:var(--pop)}
.score .r{width:20px;font:700 20px var(--font-d);text-align:center}
.score .nm{flex:1;min-width:0;font:600 18px var(--font-u);overflow-wrap:anywhere}
.score .p{font:700 30px/1 var(--font-d)}
.goal{font-size:13px;font-weight:700;margin:2px 0 0}
.timerbox{background:var(--paper);border:3px solid var(--ink);box-shadow:6px 6px 0 var(--ink);border-radius:28px;padding:12px 12px 14px;text-align:center}
.timer{font:700 84px/1 var(--font-d);font-variant-numeric:tabular-nums;text-shadow:4px 4px 0 var(--pop)}
.timer.low{color:var(--danger);animation:none}
.tl{font:600 14px var(--font-u);letter-spacing:.1em;text-transform:uppercase}
.secret{width:100%;text-align:center;border:3px dashed var(--ink);background:var(--paper);color:var(--ink);border-radius:26px;padding:22px 16px;cursor:pointer;font:inherit}
.secret.open{border-style:solid;background:var(--accent);color:var(--on-a);box-shadow:6px 6px 0 var(--ink)}
.secret .sa{font:600 15px var(--font-u);letter-spacing:.1em;text-transform:uppercase}
.secret:not(.open) .sa{font-size:20px}
.secret .sr{font:600 14px var(--font-u);letter-spacing:.14em;text-transform:uppercase}
.secret .sw2{font:700 46px/1.05 var(--font-d);margin:8px 0;overflow-wrap:anywhere}
.secret .ss{font-size:15px;font-weight:500}
.blobs{display:flex;flex-wrap:wrap;gap:18px;justify-content:center;padding:8px 0}
.blob{--h:200;background:hsl(var(--h) var(--bs) var(--bl));color:var(--ink);border:3px solid var(--ink);box-shadow:5px 5px 0 var(--ink);border-radius:46% 54% 52% 48%/56% 44% 56% 44%;padding:20px 24px 14px;display:flex;flex-direction:column;align-items:center;gap:8px;min-width:100px;max-width:100%}
.blob.you{box-shadow:0 0 0 4px var(--paper),0 0 0 7px var(--ink),5px 5px 0 7px var(--ink)}
.blob.mini{min-width:0;padding:14px 16px 12px}
.eyes{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.eye{position:relative;display:inline-block;width:32px;height:32px;border-radius:50%;background:#fff;border:3px solid var(--ink)}
.eye::after{content:'';position:absolute;left:50%;top:50%;width:13px;height:13px;border-radius:50%;background:var(--ink);transform:translate(calc(-50% + var(--px,0px)),calc(-50% + var(--py,0px)))}
.blob .bn{font:600 15px/1.2 var(--font-u);text-align:center;overflow-wrap:anywhere}
.hero{display:flex;gap:14px;justify-content:center;align-items:flex-end;padding:6px 0 2px}
.hero .blob:nth-child(2n){margin-bottom:12px}
@media (prefers-reduced-motion:no-preference){
  .blob{animation:wob 7s ease-in-out infinite}
  .blob:nth-child(2n){animation-delay:-3s}
  .hero .blob{animation:hop 2.4s ease-in-out infinite}
  .hero .blob:nth-child(2){animation-delay:-.6s}.hero .blob:nth-child(3){animation-delay:-1.2s}.hero .blob:nth-child(4){animation-delay:-1.8s}
  @keyframes wob{0%,100%{border-radius:46% 54% 52% 48%/56% 44% 56% 44%}50%{border-radius:54% 46% 46% 54%/46% 56% 44% 54%}}
  @keyframes hop{0%,100%{translate:0 0}40%{translate:0 -14px}}
  .fresh>*{animation:pop .5s cubic-bezier(.2,1.5,.4,1) backwards}
  .fresh>*:nth-child(2){animation-delay:.05s}.fresh>*:nth-child(3){animation-delay:.1s}.fresh>*:nth-child(4){animation-delay:.15s}.fresh>*:nth-child(n+5){animation-delay:.2s}
  @keyframes pop{from{opacity:0;transform:translateY(18px) scale(.94)}to{opacity:1}}
}
#hostbar{position:fixed;left:0;right:0;bottom:0;z-index:3;background:var(--paper);border-top:3px solid var(--ink);padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px))}
#hostbar[hidden]{display:none}
#hostbar .in{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
#hostbar .hl{font:600 11px var(--font-u);letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
#hostbar .btns{display:flex;gap:10px;flex-wrap:wrap}
#hostbar .btn{flex:1 1 140px;min-height:50px;font-size:17px}
#banner{position:fixed;left:16px;right:16px;top:max(10px,env(safe-area-inset-top,0px));max-width:488px;margin:0 auto;background:#ff3b5c;color:#fff;border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);border-radius:16px;padding:10px 14px;font:600 16px var(--font-u);text-align:center;z-index:5}
#banner[hidden]{display:none}
.logowrap{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-top:4px}
.logo{display:flex;flex-wrap:wrap;column-gap:.28em;font:700 clamp(46px,15vw,70px)/.98 var(--font-d);margin:0}
.logo .w{display:flex}
.logo .w span{display:inline-block;color:var(--c);-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:4px 4px 0 var(--ink);transform:rotate(var(--r))}
.ver{font:600 14px var(--font-u);background:var(--ink);color:var(--paper);padding:4px 12px;border-radius:999px}
.or{display:flex;align-items:center;gap:12px;font:600 13px var(--font-u);letter-spacing:.12em;text-transform:uppercase}
.or::before,.or::after{content:'';flex:1;height:3px;border-radius:2px;background:var(--ink)}
.warn{background:var(--paper);border:3px solid var(--ink);border-radius:16px;padding:10px 14px;font-size:14px;font-weight:500}
.foot{position:relative;z-index:1;text-align:center;font:600 12px var(--font-u);letter-spacing:.12em;text-transform:uppercase;margin:0;padding:0 0 calc(100px + env(safe-area-inset-bottom,0px));opacity:.7}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:9}
.confetti i{position:absolute;top:-24px;left:var(--l);width:var(--w);height:calc(var(--w)*1.5);background:var(--c);border:2px solid var(--ink);border-radius:3px;animation:fall var(--d) cubic-bezier(.3,.6,.5,1) forwards;transform:rotate(var(--r))}
@keyframes fall{to{transform:translate(var(--x),112vh) rotate(calc(var(--r) + 720deg))}}
.blob.mini .eye{width:28px;height:28px}.blob.mini .eye::after{width:11px;height:11px}
</style>
</head>
<body class="t-lobby">
<div class="deco" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
<div id="app">
  <div id="top" hidden><span class="pill" id="roompill"></span><span id="who"></span><span class="dot" id="net" title="Connection"></span></div>
  <main id="stage"></main>
</div>
<p class="foot" id="foot"></p>
<div id="hostbar" hidden></div>
<div id="banner" hidden role="status"></div>

<script>
(function(){
'use strict';
/* ===================== helpers ===================== */
var PREFIX='pocketparty-', LETTERS='ABCDEFGHJKLMNPQRSTUVWXYZ', HUES=[8,38,92,158,196,226,272,322];
var TIMING={play:300000,debate:90000};
var VERSION='1.2',LCOLS=['#ff5fa2','#3a86ff','#fffaf0','#62e3a0','#ff9f1c','#8f73ff'];
document.title='Pocket Party v'+VERSION;
var $=function(s,r){return (r||document).querySelector(s)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var pick=function(a){return a[Math.floor(Math.random()*a.length)]};
var store={get:function(k){try{return localStorage.getItem(k)}catch(e){return null}},set:function(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
var app=document.body,stage=$('#stage'),hostbar=$('#hostbar'),banner=$('#banner');
$('#foot').textContent='Pocket Party v'+VERSION;

/* ===================== content ===================== */
var QUESTIONS=['Name a fruit','Name a pizza topping','Name a farm animal','Name a colour of the rainbow','Name a car brand','Name a type of pasta','Name something in a kitchen drawer','Name a superhero','Name a board game','Name a Premier League club','Name a type of cheese','Name a fast food chain','Name a famous detective','Name a flavour of crisps','Name a hot drink','Name something you pack for a holiday','Name a Disney film','Name a breakfast food','Name a type of shoe','Name a famous river','Name a musical instrument','Name a European capital city','Name a sport played with a ball','Name a type of biscuit','Name a famous wizard','Name an ice cream flavour','Name something you see at the beach','Name a card game','Name a sandwich filling','Name a type of tree','Name a type of dog','Name a streaming service','Name a gemstone','Name a bird','Name a vegetable on a roast dinner','Name a planet','Name a famous bridge','Name a country in Africa','Name something people forget when leaving the house','Name a type of bread'];
var WORDS=['lighthouse','trampoline','penguin','umbrella','volcano','saxophone','toaster','scarecrow','pyramid','submarine','bicycle','kettle','parachute','snowman','helicopter','telescope','hammock','vacuum cleaner','treasure chest','windmill','castle','pirate','dinosaur','rainbow','campfire','backpack','guitar','mirror','skateboard','circus','avocado','popcorn','sandcastle','lawnmower','dentist','rollercoaster','pancake','ladder','snorkel','scissors','wheelbarrow','fireworks','library','igloo','microwave','tractor','compass','chimney','pillow','kangaroo','football','ghost','robot','cactus','wizard','mermaid','spaceship','moustache','ice cream','bunk bed'];
var BLOB_CATS=['Music','Film','Food','Animals','Places','Jobs','Sport','Famous people','Hobbies','Things in your home','Clothes','Games','Drinks','TV shows'];
var BLOB_WORDS=['Lightning','Sunday','Giant','Cold','Gold','Fast','Night','Round','Sweet','Wild','Red','Tiny','Ancient','Loud','Cheap','Water','Summer','Soft','Magic','Heavy','Sticky','Dark','Spicy','Lucky','Sleepy','Crunchy','Royal','Secret','Flying','Twisted'];

/* ===================== answer matching ===================== */
function norm(s){
  var t=String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/&/g,' and ').replace(/[^a-z0-9 ]+/g,' ').replace(/\s+/g,' ').trim();
  t=t.replace(/^(a|an|the) /,'');
  var w=t.split(' '),last=w[w.length-1]||'';
  if(last.length>3&&last.slice(-1)==='s'&&last.slice(-2)!=='ss')w[w.length-1]=last.slice(0,-1);
  return w.join('');
}
function canon(map,k){var n=0;while(map[k]!==undefined&&map[k]!==k&&n++<50)k=map[k];return k}
function makeGroups(entries,merges){
  var by={},order=[];
  entries.forEach(function(e){
    var k=canon(merges,norm(e.text)||String(e.text).toLowerCase());
    if(!by[k]){by[k]={key:k,texts:{},refs:[]};order.push(k)}
    by[k].refs.push(e.ref);
    var t=String(e.text).trim();by[k].texts[t]=(by[k].texts[t]||0)+1;
  });
  return order.map(function(k){
    var g=by[k],best=Object.keys(g.texts).sort(function(a,b){return g.texts[b]-g.texts[a]})[0];
    return {key:k,refs:g.refs,label:best};
  }).sort(function(a,b){return b.refs.length-a.refs.length||a.label.localeCompare(b.label)});
}
function mergeKeys(G,a,b){
  var ca=canon(G.merges,a),cb=canon(G.merges,b);
  if(ca===cb)return;
  G.merges[cb]=ca;G.mergeLog.push(cb);
}
function tapGroup(G,key){
  if(G.sel===null||G.sel===undefined){G.sel=key}
  else if(G.sel===key){G.sel=null}
  else{mergeKeys(G,G.sel,key);G.sel=null}
}
function undoMerge(G){var k=G.mergeLog.pop();if(k!==undefined)delete G.merges[k];G.sel=null}

/* ===================== host state ===================== */
var H={code:'',players:{},order:[],seq:0,game:null};
var ME={role:null,id:null,name:'',token:null,code:''};
function isOn(id){return !!(H.players[id]&&H.players[id].connected)}
function nameOf(id){return H.players[id]?H.players[id].name:'Someone'}
function hueOf(id){return H.players[id]?H.players[id].hue:200}
function idsOn(G){return G.ids.filter(isOn)}
function connectedPlayers(){return H.order.map(function(i){return H.players[i]}).filter(function(p){return p.connected})}
function addPlayer(name,token,conn){
  var id=H.order.length===0&&!H.players.h&&token==='host'?'h':'p'+(++H.seq);
  var p={id:id,name:name,token:token,conn:conn,connected:true,hue:HUES[H.order.length%HUES.length],lastStr:null,lastLive:null};
  H.players[id]=p;H.order.push(id);return p;
}
function seqOf(id){return H.order.indexOf(id)}
function byJoin(ids){return ids.slice().sort(function(a,b){return seqOf(a)-seqOf(b)})}
function scoreRows(G,pid,tagFn){
  return G.ids.map(function(id){return {name:nameOf(id),hue:hueOf(id),pts:G.scores[id]||0,you:id===pid,tag:tagFn?tagFn(id):''}}).sort(function(a,b){return b.pts-a.pts});
}

/* ---- Herd Mentality ---- */
Games.herd={
  name:'Herd Mentality',min:3,theme:'herd',
  blurb:'Think like the herd. Match the most popular answer to score a point, and avoid ending up with the cow.',
  init:function(ids){
    var G={kind:'herd',ids:ids,round:0,scores:{},cow:null,used:[],target:7,winner:null};
    ids.forEach(function(i){G.scores[i]=0});
    herdNext(G);return G;
  },
  check:function(G){
    if(G.phase!=='answer')return;
    var on=idsOn(G);
    if(on.length&&on.every(function(i){return G.answers[i]!==undefined}))G.phase='reveal';
  },
  act:function(G,pid,a,v){
    if(G.phase!=='answer')return;
    if(a==='ans'&&typeof v==='string'&&v.trim())G.answers[pid]=v.trim().slice(0,40);
    else if(a==='change')delete G.answers[pid];
  },
  host:function(G,a,v){
    if(a==='tap'&&G.phase==='reveal')tapGroup(G,String(v));
    else if(a==='undo'&&G.phase==='reveal')undoMerge(G);
    else if(a==='reveal'&&G.phase==='answer'&&Object.keys(G.answers).length)G.phase='reveal';
    else if(a==='reroll'&&G.phase==='answer')herdReroll(G);
    else if(a==='score'&&G.phase==='reveal')herdScore(G);
    else if(a==='next'&&G.phase==='result')herdNext(G);
  },
  screen:function(G,pid){
    var kick='Herd Mentality · Round '+G.round;
    var board={k:'scores',goal:'First to '+G.target+' wins, but not while holding the cow.',rows:scoreRows(G,pid,function(id){return G.cow===id?'COW':''})};
    var on=idsOn(G),isH=pid==='h';
    if(G.phase==='answer'){
      var mine=G.answers[pid],n=on.filter(function(i){return G.answers[i]!==undefined}).length;
      var blocks=[{k:'prompt',kicker:'The question',t:G.q,q:1}];
      if(mine===undefined){blocks.push({k:'text',c:'dim',t:'Write the answer you think most of the group will give.'},{k:'input',id:'ans',ph:'Your answer',btn:'Lock in'});}
      else{blocks.push({k:'text',c:'dim',t:'Your answer'},{k:'text',c:'big',t:mine},{k:'btn',id:'change',label:'Change answer',kind:'ghost'});}
      blocks.push({k:'live'},board);
      return {theme:'herd',kicker:kick,blocks:blocks,live:n+' of '+on.length+' answered'};
    }
    if(G.phase==='reveal'){
      var gs=makeGroups(Object.keys(G.answers).map(function(i){return {ref:i,text:G.answers[i]}}),G.merges);
      var bl=[{k:'prompt',kicker:'The question',t:G.q,q:1},
        {k:'text',c:'dim',t:isH?'Tap two answers that mean the same thing to merge them, then score the round.':'Here are the answers. The host is checking which ones match.'},
        {k:'groups',tapId:isH?'h:tap':null,groups:gs.map(function(g){return {key:g.key,label:g.label,n:g.refs.length,names:byJoin(g.refs).map(nameOf).join(', '),sel:G.sel===g.key}})}];
      return {theme:'herd',kicker:kick,blocks:bl};
    }
    if(G.phase==='result'||G.phase==='over'){
      var L=G.last;
      var b2=[{k:'prompt',kicker:G.phase==='over'?'Winner':'The question',t:G.phase==='over'?nameOf(G.winner):G.q,q:G.phase==='over'?0:1}];
      if(G.phase==='over')b2.push({k:'text',c:'dim',t:'Reached '+G.target+' points without the cow. '+G.q+' was the final question.'});
      b2.push({k:'groups',groups:L.groups.map(function(g){return {key:g.key,label:g.label,n:g.refs.length,names:byJoin(g.refs).map(nameOf).join(', '),tag:L.scorers.indexOf(g.refs[0])>=0?'+1 each':''}})});
      if(L.scorers.length)b2.push({k:'text',c:'dim',t:'The herd was '+L.groups[0].label+'. '+L.scorers.length+' scored.'});
      else b2.push({k:'text',c:'dim',t:L.groups[0].refs.length<2?'Nobody matched anyone. No points.':'The biggest groups tied. No points this round.'});
      if(L.cowTo)b2.push({k:'text',c:'dim',t:nameOf(L.cowTo)+' was the odd one out and takes the cow.'});
      if(L.blocked)b2.push({k:'text',c:'dim',t:nameOf(L.blocked)+' has enough points but is holding the cow. Pass it on to win.'});
      b2.push(board);
      return {theme:'herd',kicker:kick,blocks:b2,fx:G.phase==='over'?'confetti':''};

  },
  hostBtns:function(G){
    var b=[];
    if(G.phase==='answer'){b.push({id:'h:reveal',label:'Reveal now',kind:'ghost'});b.push({id:'h:reroll',label:'Reroll question',kind:'ghost'})}
    if(G.phase==='reveal'){b.push({id:'h:score',label:'Score it',kind:'primary'});if(G.mergeLog.length)b.push({id:'h:undo',label:'Undo merge',kind:'ghost'});}
    if(G.phase==='result')b.push({id:'h:next',label:'Next round',kind:'primary'});
    if(G.phase==='over'){b.push({id:'h:start:herd',label:'Play again',kind:'primary'});b.push({id:'h:menu',label:'Back to menu',kind:'ghost'});}
    else b.push({id:'h:menu',label:'Back to menu',kind:'danger'});
    return b;
  }
};
function herdNext(G){
  var pool=QUESTIONS.filter(function(q){return G.used.indexOf(q)<0});
  if(!pool.length){G.used=[];pool=QUESTIONS}
  G.q=pick(pool);G.used.push(G.q);G.round++;G.phase='answer';G.answers={};G.merges={};G.mergeLog=[];G.sel=null;G.last=null;
}
function herdReroll(G){
  var pool=QUESTIONS.filter(function(q){return G.used.indexOf(q)<0});
  if(!pool.length){G.used=[G.q];pool=QUESTIONS.filter(function(q){return q!==G.q})}
  G.q=pick(pool);G.used.push(G.q);G.answers={};
}
function herdScore(G){
  var keys=Object.keys(G.answers);
  var gs=makeGroups(keys.map(function(i){return {ref:i,text:G.answers[i]}}),G.merges);
  if(!gs.length){herdNext(G);return}
  var maxN=gs[0].refs.length;
  var top=gs.filter(function(g){return g.refs.length===maxN});
  var scorers=(maxN>=2&&top.length===1)?top[0].refs.slice():[];
  scorers.forEach(function(i){G.scores[i]=(G.scores[i]||0)+1});
  var singles=gs.filter(function(g){return g.refs.length===1});
  var cowTo=null;
  if(singles.length===1&&keys.length>=3){cowTo=singles[0].refs[0];G.cow=cowTo}
  var blocked=null;
  var eligible=G.ids.filter(function(i){return G.scores[i]>=G.target&&i!==G.cow}).sort(function(a,b){return G.scores[b]-G.scores[a]});
  if(eligible.length){G.winner=eligible[0];G.phase='over'}
  else{G.phase='result';if(G.cow&&G.scores[G.cow]>=G.target)blocked=G.cow}
  G.last={groups:gs.map(function(g){return {key:g.key,label:g.label,refs:g.refs}}),scorers:scorers,cowTo:cowTo,blocked:blocked};
}

/* ---- Blob Party ---- */
function bkey(b){return b.slice().sort().join('+')}
function blobByKey(G,k){return G.blobs.filter(function(b){return bkey(b)===k})[0]||[]}
function blobOf(G,id){return G.blobs.filter(function(b){return b.indexOf(id)>=0})[0]||[id]}
function blobView(G,pid){
  return G.blobs.map(function(b){
    var m=byJoin(b);
    return {names:m.map(nameOf),hue:H.players[m[0]]?H.players[m[0]].hue:200,you:b.indexOf(pid)>=0};
  });
}
Games.blob={
  name:'Blob Party',min:3,theme:'blob',
  blurb:'Everyone answers the same prompt. Give matching answers and you merge into one blob. Become a single Mega Blob together.',
  init:function(ids){

    blobNext(G);return G;
  },

    if(G.phase!=='answer')return;
    var act=G.blobs.filter(function(b){return b.some(isOn)});

  },
  act:function(G,pid,a,v){
    if(G.phase!=='answer')return;
    var k=bkey(blobOf(G,pid));
    if(a==='ans'&&typeof v==='string'&&v.trim())G.answers[k]={text:v.trim().slice(0,40),by:pid};
    else if(a==='change')delete G.answers[k];
  },
  host:function(G,a,v){
    if(a==='tap'&&G.phase==='reveal')tapGroup(G,String(v));
    else if(a==='undo'&&G.phase==='reveal')undoMerge(G);
    else if(a==='reveal'&&G.phase==='answer'&&Object.keys(G.answers).length)G.phase='reveal';
    else if(a==='reroll'&&G.phase==='answer')blobReroll(G);
    else if(a==='merge'&&G.phase==='reveal')blobMerge(G);
    else if(a==='next'&&G.phase==='result')blobNext(G);
  },
  screen:function(G,pid){
    var kick='Blob Party · Round '+G.round,isH=pid==='h';
    var prompt={k:'prompt',kicker:G.cat,t:G.word};
    if(G.phase==='answer'){
      var mb=blobOf(G,pid),key=bkey(mb),ans=G.answers[key];
      var act=G.blobs.filter(function(b){return b.some(isOn)});
      var n=act.filter(function(b){return G.answers[bkey(b)]!==undefined}).length;
      var blocks=[prompt,{k:'blobs',blobs:[{names:byJoin(mb).map(nameOf),hue:H.players[byJoin(mb)[0]]?H.players[byJoin(mb)[0]].hue:200,you:true}]}];
      if(ans===undefined){
        blocks.push({k:'text',c:'dim',t:mb.length>1?'Your blob answers together. Talk it over, then one of you sends it.':'Write something that fits the category and the word. Aim to match other people.'});
        blocks.push({k:'input',id:'ans',ph:'Your answer',btn:'Send'});
      }else{
        blocks.push({k:'text',c:'dim',t:mb.length>1?nameOf(ans.by)+' sent your blob\'s answer':'Your answer'});
        blocks.push({k:'text',c:'big',t:ans.text});
        blocks.push({k:'btn',id:'change',label:'Change answer',kind:'ghost'});
      }
      blocks.push({k:'live'});
      return {theme:'blob',kicker:kick,blocks:blocks,live:n+' of '+act.length+' '+(act.length===1?'blob':'blobs')+' answered'};
    }
    if(G.phase==='reveal'){
      var gs=makeGroups(Object.keys(G.answers).map(function(k){return {ref:k,text:G.answers[k].text}}),G.merges);
      return {theme:'blob',kicker:kick,blocks:[prompt,
        {k:'text',c:'dim',t:isH?'Tap two answers that mean the same thing to merge them, then merge the blobs.':'The host is checking which answers match.'},
        {k:'groups',tapId:isH?'h:tap':null,groups:gs.map(function(g){return {key:g.key,label:g.label,n:g.refs.length,names:byJoin([].concat.apply([],g.refs.map(function(k){return blobByKey(G,k)}))).map(nameOf).join(', '),sel:G.sel===g.key}})}]};
    }
    if(G.phase==='result'||G.phase==='won'){
      var b2=[];
      if(G.phase==='won')b2.push({k:'prompt',kicker:'Everyone is one',t:'Mega Blob!'},{k:'text',c:'dim',t:'You all matched after '+G.round+(G.round===1?' round.':' rounds.')});
      else b2.push(prompt);
      b2.push({k:'blobs',blobs:blobView(G,pid)});
      if(G.phase==='result'){
        if(G.last.merged.length)G.last.merged.forEach(function(m){b2.push({k:'text',c:'dim',t:m.names+' all said '+m.label+' and merged.'})});
        else b2.push({k:'text',c:'dim',t:'No matches this round. Try to think more alike.'});
        b2.push({k:'text',c:'note',t:G.blobs.length+' blobs left'});
      }
      return {theme:'blob',kicker:kick,blocks:b2,fx:G.phase==='won'?'confetti':''};
    }
    return {theme:'blob',kicker:kick,blocks:[]};
  },
  hostBtns:function(G){
    var b=[];
    if(G.phase==='answer'){b.push({id:'h:reveal',label:'Reveal now',kind:'ghost'});b.push({id:'h:reroll',label:'Reroll prompt',kind:'ghost'})}
    if(G.phase==='reveal'){b.push({id:'h:merge',label:'Merge blobs',kind:'primary'});if(G.mergeLog.length)b.push({id:'h:undo',label:'Undo merge',kind:'ghost'});}
    if(G.phase==='result')b.push({id:'h:next',label:'Next round',kind:'primary'});
    if(G.phase==='won'){b.push({id:'h:start:blob',label:'Play again',kind:'primary'});b.push({id:'h:menu',label:'Back to menu',kind:'ghost'});}
    else b.push({id:'h:menu',label:'Back to menu',kind:'danger'});
    return b;
  }
};
function blobNext(G){
  var w;do{w=pick(BLOB_WORDS)}while(w===G.word);
  G.cat=pick(BLOB_CATS);G.word=w;G.round++;G.phase='answer';G.answers={};G.merges={};G.mergeLog=[];G.sel=null;G.last=null;
}
function blobReroll(G){
  var w;do{w=pick(BLOB_WORDS)}while(w===G.word);
  G.cat=pick(BLOB_CATS);G.word=w;G.answers={};
}
function blobMerge(G){
  var gs=makeGroups(Object.keys(G.answers).map(function(k){return {ref:k,text:G.answers[k].text}}),G.merges);
  var next=[],used={},merged=[];
  gs.forEach(function(g){
    var members=[];g.refs.forEach(function(k){members=members.concat(blobByKey(G,k));used[k]=1});
    members=byJoin(members);next.push(members);
    if(g.refs.length>1)merged.push({label:g.label,names:members.map(nameOf).join(', ')});
  });
  G.blobs.forEach(function(b){if(!used[bkey(b)])next.push(b)});
  G.blobs=next;G.last={merged:merged};
  G.phase=G.blobs.length===1?'won':'result';
}

/* ---- Insider ---- */
Games.insider={
  name:'Insider',min:4,theme:'insider',
  blurb:'One player knows a secret word and answers yes/no questions out loud. Someone else secretly knows it too. Find the word, then find the Insider.',
  init:function(ids){
    var G={kind:'insider',ids:ids,round:0,scores:{},masterIdx:-1,used:[],votes:{}};
    ids.forEach(function(i){G.scores[i]=0});
    insiderNext(G);return G;
  },
  tick:function(G){
    var now=Date.now();
    if(G.phase==='play'&&now>=G.endsAt)insiderResolve(G,true);
    else if(G.phase==='debate'&&now>=G.endsAt){G.phase='vote'}
  },
  check:function(G){
    if(G.phase!=='vote')return;
    var on=idsOn(G);
    if(on.length&&on.every(function(i){return G.votes[i]!==undefined}))insiderResolve(G,false);
  },
  act:function(G,pid,a,v){
    if(a==='guessed'&&G.phase==='play'&&pid===G.master){G.phase='debate';G.endsAt=Date.now()+TIMING.debate}
    else if(a==='reroll'&&pid===G.master&&(G.phase==='brief'||G.phase==='play'))insiderReroll(G);
    else if(a==='vote'&&G.phase==='vote'&&G.ids.indexOf(v)>=0&&v!==pid&&v!==G.master)G.votes[pid]=v;
  },
  host:function(G,a){
    if(a==='begin'&&G.phase==='brief'){G.phase='play';G.endsAt=Date.now()+TIMING.play}
    else if(a==='giveup'&&G.phase==='play')insiderResolve(G,true);
    else if(a==='tovote'&&G.phase==='debate')G.phase='vote';
    else if(a==='reveal'&&G.phase==='vote')insiderResolve(G,false);
    else if(a==='next'&&(G.phase==='result'||G.phase==='short'))insiderNext(G);
  },
  screen:function(G,pid){
    var kick='Insider · Round '+G.round,isH=pid==='h';
    var board={k:'scores',unit:'pts',rows:scoreRows(G,pid)};
    if(G.phase==='short')return {theme:'insider',kicker:kick,title:'Not enough players',blocks:[{k:'text',c:'dim',t:'Insider needs at least 3 players connected. Wait for people to rejoin or go back to the menu.'}]};
    var role=pid===G.master?'Master':pid===G.insider?'Insider':'Commoner';
    var sec={k:'secret',id:'r'+G.round,role:role};
    if(role==='Master'){sec.t=G.word;sec.sub='You know the word. Answer yes or no out loud and never give hints.'}
    else if(role==='Insider'){sec.t=G.word;sec.sub='You know the word too. Steer the group to it without being caught.'}
    else{sec.t='No word for you';sec.sub='Ask the Master yes or no questions out loud to find the word.'}
    if(G.phase==='brief'){
      return {theme:'insider',kicker:kick,title:nameOf(G.master)+' is the Master',blocks:[
        {k:'text',c:'dim',t:'Peek at your role in private, then hide it before anyone looks.'},sec]
        .concat(pid===G.master?[{k:'btn',id:'reroll',label:'Reroll the word',kind:'ghost'}]:[])
        .concat(G.rerolls?[{k:'text',c:'note',t:rerollNote(G)}]:[])
        .concat([{k:'text',c:'note',t:isH?'Start the timer when everyone has looked.':'The host starts the timer when everyone has looked.'}])};
    }
    if(G.phase==='play'){
      var bl=[{k:'timer',endsAt:G.endsAt,label:'Find the word'},sec];
      if(pid===G.master)bl.push({k:'btn',id:'guessed',label:'They guessed the word',kind:'primary'});
      else bl.push({k:'text',c:'dim',t:'Ask '+nameOf(G.master)+' yes or no questions out loud.'});
      if(pid===G.master)bl.push({k:'btn',id:'reroll',label:'Reroll the word',kind:'ghost',confirm:1});
      if(G.rerolls)bl.push({k:'text',c:'note',t:rerollNote(G)});
      return {theme:'insider',kicker:kick,title:'Twenty questions, sort of',blocks:bl};
    }
    if(G.phase==='debate'){
      return {theme:'insider',kicker:kick,title:'The word was guessed',blocks:[
        {k:'timer',endsAt:G.endsAt,label:'Discuss'},
        {k:'text',c:'dim',t:'Somebody knew the word all along. Who steered the group? Argue it out, then vote.'}]};
    }
    if(G.phase==='vote'){
      var n=idsOn(G).filter(function(i){return G.votes[i]!==undefined}).length;
      var opts=G.ids.filter(function(i){return i!==pid&&i!==G.master}).map(function(i){return {v:i,label:nameOf(i),on:G.votes[pid]===i}});
      return {theme:'insider',kicker:kick,title:'Who is the Insider?',live:n+' of '+idsOn(G).length+' voted',blocks:[
        {k:'text',c:'dim',t:G.votes[pid]?'Vote locked. Tap another name to change it.':'Pick who you think knew the word.'},
        {k:'choices',id:'vote',opts:opts},{k:'live'}]};
    }
    var r=G.result,blocks=[],title;
    if(r.kind==='timeout'){title='Time is up';blocks.push({k:'text',c:'dim',t:'Nobody found the word, so nobody scores.'})}
    else if(r.kind==='caught'){title='Insider caught';blocks.push({k:'text',c:'dim',t:'The group voted correctly. Everyone except the Insider scores 1.'})}
    else{title='The Insider got away';blocks.push({k:'text',c:'dim',t:'The vote missed. The Insider scores 2.'})}
    blocks.push({k:'prompt',kicker:'The word was',t:G.word});
    blocks.push({k:'text',c:'big',t:'The Insider was '+nameOf(G.insider)});
    if(r.tally){
      blocks.push({k:'text',c:'dim',t:'Votes'});
      blocks.push({k:'scores',unit:'votes',rows:G.ids.filter(function(i){return i!==G.master}).map(function(i){return {name:nameOf(i),hue:hueOf(i),pts:r.tally[i]||0,you:i===pid,tag:i===G.insider?'INSIDER':''}}).sort(function(a,b){return b.pts-a.pts})});
    }
    blocks.push({k:'text',c:'dim',t:'Scoreboard'});blocks.push(board);
    return {theme:'insider',kicker:kick,title:title,blocks:blocks,fx:r.kind==='caught'?'confetti':''};
  },
  hostBtns:function(G){
    var b=[];
    if(G.phase==='brief')b.push({id:'h:begin',label:'Start the timer',kind:'primary'});
    if(G.phase==='play')b.push({id:'h:giveup',label:'Give up',kind:'danger'});
    if(G.phase==='debate')b.push({id:'h:tovote',label:'Go to vote',kind:'primary'});
    if(G.phase==='vote')b.push({id:'h:reveal',label:'Reveal now',kind:'ghost'});
    if(G.phase==='result'||G.phase==='short'){if(G.phase==='result')b.push({id:'h:next',label:'Next round',kind:'primary'});b.push({id:'h:menu',label:'Back to menu',kind:'ghost'})}
    else b.push({id:'h:menu',label:'Back to menu',kind:'danger'});
    return b;
  }
};
function rerollNote(G){return 'The Master rerolled the word '+G.rerolls+(G.rerolls===1?' time.':' times.')+' A reroll during the round restarts the timer.'}
function insiderReroll(G){
  var pool=WORDS.filter(function(w){return G.used.indexOf(w)<0&&w!==G.word});
  if(!pool.length)pool=WORDS.filter(function(w){return w!==G.word});
  G.word=pick(pool);G.used.push(G.word);G.rerolls=(G.rerolls||0)+1;
  if(G.phase==='play')G.endsAt=Date.now()+TIMING.play;
}
function insiderNext(G){
  G.round++;
  var on=idsOn(G);
  if(on.length<3){G.phase='short';return}
  var m=null;
  for(var i=0;i<G.ids.length;i++){G.masterIdx=(G.masterIdx+1)%G.ids.length;var c=G.ids[G.masterIdx];if(isOn(c)){m=c;break}}
  var ins=pick(on.filter(function(x){return x!==m}));
  var pool=WORDS.filter(function(w){return G.used.indexOf(w)<0});
  if(!pool.length){G.used=[];pool=WORDS}
  G.word=pick(pool);G.used.push(G.word);
  G.master=m;G.insider=ins;G.rerolls=0;G.phase='brief';G.votes={};G.result=null;G.endsAt=null;
}
function insiderResolve(G,timeout){
  if(timeout){G.result={kind:'timeout'}}
  else{
    var tally={};G.ids.forEach(function(i){tally[i]=0});
    Object.keys(G.votes).forEach(function(v){tally[G.votes[v]]=(tally[G.votes[v]]||0)+1});
    var top=Math.max.apply(null,Object.keys(tally).map(function(k){return tally[k]}));
    var leaders=Object.keys(tally).filter(function(k){return tally[k]===top});
    var caught=top>0&&leaders.length===1&&leaders[0]===G.insider;
    if(caught)G.ids.forEach(function(i){if(i!==G.insider)G.scores[i]+=1});
    else G.scores[G.insider]+=2;
    G.result={kind:caught?'caught':'escaped',tally:tally};
  }
  G.phase='result';
}

/* ===================== host: screens, pushing, actions ===================== */
function lobbyScreen(pid){
  var rows=H.order.map(function(i){var p=H.players[i];return {name:p.name,hue:p.hue,on:p.connected,you:p.id===pid,host:p.id==='h'}});
  var isH=pid==='h',blocks=[{k:'share'},{k:'roster',rows:rows}];
  if(isH){
    blocks.push({k:'text',c:'dim',t:'Pick a game once everyone has joined.'});
    blocks.push({k:'cards',opts:Object.keys(Games).map(function(key){var g=Games[key];return {id:'h:start:'+key,title:g.name,t:g.blurb,sub:g.min+'+ players',dis:connectedPlayers().length<g.min,theme:g.theme,icon:key}})});
  }else blocks.push({k:'text',c:'dim',t:'Waiting for '+nameOf('h')+' to pick a game.'});
  return {theme:'lobby',kicker:'Lobby',title:isH?'Invite your friends':'You are in',blocks:blocks};
}
function sitOut(pid){
  var g=Games[H.game.kind];
  return {theme:g.theme,kicker:g.name,title:'Game in progress',blocks:[{k:'text',c:'dim',t:'You joined partway through. You will be dealt into the next game when the host starts one.'}]};
}
function buildScreen(pid){
  var s;
  if(!H.game)s=lobbyScreen(pid);
  else if(H.game.ids.indexOf(pid)<0)s=sitOut(pid);
  else s=Games[H.game.kind].screen(H.game,pid);
  if(pid==='h')s.hostBtns=H.game?Games[H.game.kind].hostBtns(H.game):[];
  return s;
}
function sendTo(p,m){
  if(p.id==='h'){onMsg(m)}
  else if(p.conn&&p.conn.open){try{p.conn.send(m)}catch(e){}}
}
function pushAll(){
  H.order.forEach(function(id){
    var p=H.players[id],s=buildScreen(id),live=s.live||'';
    delete s.live;
    var str=JSON.stringify(s);
    if(str!==p.lastStr){p.lastStr=str;p.lastLive=live;s.live=live;sendTo(p,{t:'screen',s:s,now:Date.now()})}
    else if(live!==p.lastLive){p.lastLive=live;sendTo(p,{t:'live',live:live})}
  });
}
function afterChange(){
  if(H.game){var g=Games[H.game.kind];if(g.check)g.check(H.game)}
  pushAll();
}
function hostHandle(pid,msg){
  if(!msg||msg.t!=='act')return;
  var a=String(msg.a||'');
  if(a.indexOf('h:')===0){
    if(pid!=='h')return;
    var parts=a.slice(2).split(':');
    if(parts[0]==='start'){
      var g=Games[parts[1]];
      if(g&&connectedPlayers().length>=g.min)H.game=g.init(connectedPlayers().map(function(p){return p.id}));
    }else if(parts[0]==='menu'){H.game=null}
    else if(H.game)Games[H.game.kind].host(H.game,parts[0],msg.v);
  }else if(H.game&&H.game.ids.indexOf(pid)>=0){
    Games[H.game.kind].act(H.game,pid,a,msg.v);
  }
  afterChange();
}
function onJoin(conn,m){
  var name=String(m.name||'').trim().slice(0,12),token=String(m.token||'').slice(0,64);
  if(!name||!token){conn.send({t:'err',msg:'Enter a name to join.'});return}
  var all=H.order.map(function(i){return H.players[i]});
  var p=all.filter(function(x){return x.token===token})[0];
  if(!p){
    var same=all.filter(function(x){return x.name.toLowerCase()===name.toLowerCase()})[0];
    if(same){
      if(same.connected){conn.send({t:'err',msg:'That name is taken. Pick another.'});return}
      p=same;p.token=token;
    }
  }
  if(p){
    if(p.conn&&p.conn!==conn){try{p.conn.close()}catch(e){}}
    p.conn=conn;p.connected=true;p.lastStr=null;p.lastLive=null;
  }else p=addPlayer(name,token,conn);
  conn.__pid=p.id;
  conn.send({t:'welcome',id:p.id,name:p.name,code:H.code});
  afterChange();
}
function onPlayerClose(c){
  var p=H.players[c.__pid];
  if(p&&p.conn===c){p.connected=false;afterChange()}
}
function onPlayerData(c,m){
  if(!m)return;
  if(m.t==='join')onJoin(c,m);
  else if(m.t==='act'&&c.__pid)hostHandle(c.__pid,m);
}
setInterval(function(){
  if(ME.role!=='host'||!H.game)return;
  var g=Games[H.game.kind];
  if(g.tick)g.tick(H.game);
  afterChange();
},1000);

/* ===================== networking (PeerJS) ===================== */
var peer=null,conn=null,openTimer=null,retryTimer=null,connecting=false;
function teardown(){
  leaving=true;joined=false;connecting=false;
  clearTimeout(openTimer);clearTimeout(retryTimer);
  try{if(conn)conn.close()}catch(e){}
  try{if(peer)peer.destroy()}catch(e){}
  peer=null;conn=null;ME.role=null;ME.id=null;
  H.players={};H.order=[];H.seq=0;H.game=null;cur=null;lastSig='';fxKey='';drafts={};revealed={};
  setBanner('');
}
function token(){
  var t=store.get('pocket-token');
  if(!t){t=Math.random().toString(36).slice(2)+Math.random().toString(36).slice(2);store.set('pocket-token',t)}
  return t;
}
function genCode(){var c='';for(var i=0;i<4;i++)c+=LETTERS[Math.floor(Math.random()*LETTERS.length)];return c}
function needPeer(){
  if(typeof window.Peer==='undefined'){fail('Could not load the connection library. Check your internet connection and reload.');return false}
  return true;
}
function startHost(name,tries){
  if(!needPeer())return;
  tries=tries||0;
  teardown();leaving=false;
  ME.role='host';ME.name=name;ME.code=genCode();ME.token='host';H.code=ME.code;
  viewMessage('Opening your room…');
  var opened=false;
  peer=new window.Peer(PREFIX+ME.code,{debug:0});
  peer.on('open',function(){
    opened=true;
    var me=addPlayer(name,'host',null);ME.id=me.id;
    showGameChrome();afterChange();wake();
  });
  peer.on('connection',function(c){
    c.on('data',function(m){onPlayerData(c,m)});
    c.on('close',function(){onPlayerClose(c)});
    c.on('error',function(){onPlayerClose(c)});
  });
  peer.on('disconnected',function(){setBanner('Lost the matchmaking service. Reconnecting…');try{peer.reconnect()}catch(e){}});
  peer.on('error',function(e){
    if(e.type==='unavailable-id'&&!opened&&tries<5){startHost(name,tries+1);return}
    if(!opened){fail('Could not open a room ('+(e.type||'error')+'). Check your connection and try again.');return}
    if(e.type==='network'||e.type==='server-error'||e.type==='socket-error'||e.type==='socket-closed')setBanner('Connection trouble. Players may need to rejoin.');
  });
  peer.on('open',function(){setBanner('')});
}
function joinRoom(code,name){
  if(!needPeer())return;
  teardown();leaving=false;
  ME.role='player';ME.name=name;ME.code=code;ME.token=token();
  viewMessage('Joining room '+code+'…');
  peer=new window.Peer({debug:0});
  peer.on('open',function(){connectToHost()});
  peer.on('disconnected',function(){try{peer.reconnect()}catch(e){}});
  peer.on('error',function(e){
    if(e.type==='peer-unavailable'){
      if(!joined){fail('No room with code '+code+'. Check the code with your host.');return}
      connecting=false;clearTimeout(retryTimer);retryTimer=setTimeout(connectToHost,2000);return;
    }
    if(!joined){fail('Could not reach the matchmaking service ('+(e.type||'error')+'). Check your connection.');return}
    setNet(false);
  });
  wake();
}
function connectToHost(){
  if(connecting||leaving||!peer||peer.destroyed)return;
  connecting=true;
  try{if(conn)conn.close()}catch(e){}
  var c=peer.connect(PREFIX+ME.code,{reliable:true,serialization:'json'});
  conn=c;
  clearTimeout(openTimer);
  openTimer=setTimeout(function(){
    if(c.open||leaving)return;
    connecting=false;
    if(!joined)fail('Could not connect to the host. Check the code, and make sure you are both online.');
    else{try{c.close()}catch(e){}retryTimer=setTimeout(connectToHost,2000)}
  },15000);
  c.on('open',function(){
    connecting=false;clearTimeout(openTimer);
    c.send({t:'join',name:ME.name,token:ME.token});
    if(joined)setNet(true);
  });
  c.on('data',function(m){onMsg(m)});
  c.on('close',function(){
    connecting=false;
    if(leaving||conn!==c)return;
    if(joined){setNet(false);clearTimeout(retryTimer);retryTimer=setTimeout(connectToHost,1500)}
  });
  c.on('error',function(){connecting=false});
}
document.addEventListener('visibilitychange',function(){
  if(document.visibilityState!=='visible')return;
  wake();
  if(ME.role==='player'&&joined&&(!conn||!conn.open)){
    if(peer&&peer.disconnected){try{peer.reconnect()}catch(e){}}
    clearTimeout(retryTimer);connecting=false;connectToHost();
  }
});
var wl=null;
function wake(){try{if(navigator.wakeLock&&navigator.wakeLock.request)navigator.wakeLock.request('screen').then(function(l){wl=l},function(){})}catch(e){}}

/* ===================== start ===================== */
window.pocketStart=function(){viewLanding('')};
})();
</script>
<script>
(function(){
  var urls=['https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js','https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js'];
  function go(){if(window.pocketStart)window.pocketStart()}
  function load(i){
    if(typeof window.Peer!=='undefined'||i>=urls.length){go();return}
    var s=document.createElement('script');s.src=urls[i];
    s.onload=go;s.onerror=function(){load(i+1)};
    document.head.appendChild(s);
  }
  load(0);
})();
</script>
