<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bird!</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f0fdf4;
            text-align: center;
            overflow: hidden;
        }

        #game-container, #instruction-screen {
            display: none;
        }

        .screen-content {
            max-width: 400px;
            padding: 20px;
        }

        #bird-container {
            height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 20px 0;
        }

        #bird-img {
            max-width: 250px;
            max-height: 250px;
            cursor: pointer;
            transition: transform 0.1s;
            user-select: none;
            filter: hue-rotate(0deg);
        }

        #bird-img:active {
            transform: scale(0.9) !important;
        }

        #exultation {
            margin-bottom: 20px;
            font-size: 28px;
            font-weight: bold;
            color: #166534;
            height: 40px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }

        button.main-btn {
            padding: 15px 40px;
            font-size: 22px;
            background-color: #22c55e;
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin: 10px;
            transition: background 0.2s;
        }

        button.main-btn:hover {
            background-color: #16a34a;
        }

        button.secondary-btn {
            background-color: #94a3b8;
            font-size: 18px;
        }

        .instruction-list {
            text-align: left;
            font-size: 20px;
            line-height: 1.6;
            color: #334155;
            margin-bottom: 30px;
        }

        .footer-text {
            margin-top: 20px;
            font-size: 18px;
            color: #666;
        }
    </style>
</head>
<body>

    <!-- FRONT PAGE -->
    <div id="start-screen" class="screen-content">
        <h1>Bird Game</h1>
        <p>Ready to spot some real birds?</p>
        <button class="main-btn" onclick="startGame()">New Game</button>
        <br>
        <button class="main-btn secondary-btn" onclick="showInstructions()">Instructions</button>
    </div>

    <!-- INSTRUCTION PAGE -->
    <div id="instruction-screen" class="screen-content">
        <h2>How to Play</h2>
        <div class="instruction-list">
            <p>• To play Bird move to a window or go outside.</p>
            <p>• Look around.</p>
            <p>• When you see a bird touch the bird image and enjoy your rewards.</p>
        </div>
        <button class="main-btn" onclick="startGame()">Play Now</button>
    </div>

    <!-- GAME PAGE -->
    <div id="game-container">
        <div id="exultation">Keep your eyes peeled!</div>
        
        <div id="bird-container">
            <img id="bird-img" src="birdasset/birdimage1.png" onclick="spotBird()" alt="A bird!">
        </div>

        <p class="footer-text">Click the bird when you see a "BIRD!"</p>
        
        <button class="main-btn secondary-btn" onclick="location.reload()" style="margin-top: 40px; font-size: 14px; padding: 10px 20px;">Reset Game</button>
    </div>

    <script>
        const exultations = [
            "Great work!", "Nice birding!", "Eagle eyes!", "What a find!",
            "Absolutely majestic!", "You've got the knack!", "Bird-tastic!",
            "Splendid spotting!", "A rare sight indeed!", "Top-tier birding!",
            "Look at those feathers!", "Incredible observation!", "You're a natural!",
            "Phenomenal focus!", "Wing-tastic catch!", "Feather-finder extraordinaire!",
            "Simply tweet-heart!", "Spectacular sighting!", "Bird-spotting champion!",
            "Magical discovery!", "Breathtaking!", "Expert level birding!"
        ];

        function showInstructions() {
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('instruction-screen').style.display = 'block';
        }

        function startGame() {
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('instruction-screen').style.display = 'none';
            document.getElementById('game-container').style.display = 'block';
            changeBird();
        }

        function changeBird() {
            const birdImg = document.getElementById('bird-img');
            const randomIndex = Math.floor(Math.random() * 5) + 1;
            birdImg.src = `birdasset/birdimage${randomIndex}.png`;
        }

        function playRandomSound() {
            const randomIndex = Math.floor(Math.random() * 5) + 1;
            const audio = new Audio(`birdasset/birdsound${randomIndex}.mp3`);
            audio.play().catch(e => console.log("Audio play blocked until first interaction."));
        }

        function spotBird() {
            playRandomSound();
            changeBird();

            const textElement = document.getElementById('exultation');
            textElement.innerText = exultations[Math.floor(Math.random() * exultations.length)];

            const birdImg = document.getElementById('bird-img');
            const randomHue = Math.floor(Math.random() * 360);
            birdImg.style.filter = `hue-rotate(${randomHue}deg)`;
            
            const randomRotate = Math.random() * 30 - 15;
            birdImg.style.transform = `rotate(${randomRotate}deg)`;
        }
    </script>
</body>
</html>
