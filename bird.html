<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bird!</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f0fdf4;
            text-align: center;
            overflow: hidden;
        }

        #game-container, #instruction-screen {
            display: none;
        }

        .screen-content {
            max-width: 500px;
            padding: 20px;
            z-index: 2;
        }

        .speech-bubble {
            position: relative;
            background: #ffffff;
            border: 4px solid #000000;
            border-radius: 20px;
            padding: 15px 25px;
            margin-bottom: 40px;
            display: inline-block;
            font-size: 24px;
            font-weight: bold;
            color: #000;
            box-shadow: 6px 6px 0px rgba(0,0,0,0.2);
            min-width: 200px;
            transition: transform 0.3s ease, background-color 0.3s ease, border-color 0.3s ease;
            white-space: pre-line;
        }

        .speech-bubble:after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            width: 0;
            height: 0;
            border: 20px solid transparent;
            border-top-color: inherit;
            border-bottom: 0;
            margin-left: -20px;
            margin-bottom: -20px;
        }

        #bird-container {
            height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 20px 0;
            z-index: 2;
        }

        #bird-img {
            max-width: 250px;
            max-height: 250px;
            cursor: pointer;
            transition: transform 0.1s;
            user-select: none;
        }

        #bird-img:active {
            transform: scale(0.9) !important;
        }

        button.main-btn {
            padding: 15px 40px;
            font-size: 22px;
            background-color: #22c55e;
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin: 10px;
            z-index: 5;
        }

        button.secondary-btn {
            background-color: #94a3b8;
            font-size: 18px;
        }

        .instruction-list {
            text-align: center;
            font-size: 20px;
            line-height: 1.8;
            color: #334155;
            margin-bottom: 30px;
        }

        #confetti-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }
    </style>
</head>
<body>

    <canvas id="confetti-canvas"></canvas>

    <div id="start-screen" class="screen-content">
        <h1>Bird!</h1>
        <p>Ready to spot some real birds?</p>
        <button class="main-btn" onclick="startGame()">New Game</button>
        <br>
        <button class="main-btn secondary-btn" onclick="showInstructions()">Instructions</button>
    </div>

    <div id="instruction-screen" class="screen-content">
        <h1>Bird!</h1>
        <div class="instruction-list">
            <p>To play Bird! move to a window or go outside.</p>
            <p>Look around.</p>
            <p>When you see a real bird touch the bird image and enjoy your rewards.</p>
        </div>
        <button class="main-btn" onclick="startGame()">Play Now</button>
    </div>

    <div id="game-container">
        <div class="speech-bubble" id="exultation">Keep your eyes peeled!</div>
        <div id="bird-container">
            <img id="bird-img" src="" onclick="spotBird()" alt="A bird!">
        </div>
        <p>Click the bird when you see a "BIRD!"</p>
        <button class="main-btn secondary-btn" onclick="location.reload()" style="margin-top: 40px; font-size: 14px; padding: 10px 20px;">Reset Game</button>
    </div>

    <script>
        /* --- UPDATED ASSET LISTS --- */
        const birdImages = [
            "birdimage1.png", "birdimage2.png", "birdimage3.png", "birdimage4.png", "birdimage5.png",
            "birdimage6.png", "birdimage7.png", "birdimage8.png", "birdimage9.png", "birdimage10.png",
            "birdimage11.png", "birdimage12.png", "birdimage13.png", "birdimage14.png", "birdimage15.png",
            "birdimage16.png", "birdimage17.png", "birdimage18.png", "birdimage19.png", "birdimage20.png",
            "birdimage21.png", "birdimage22.png"
        ];

        const birdSounds = [
            "birdsound1.mp3", "birdsound2.mp3", "birdsound3.mp3", "birdsound4.mp3", "birdsound5.mp3",
            "birdsound6.mp3", "birdsound7.mp3", "birdsound8.mp3"
        ];

        let internalBirdCount = 0;
        const exultations = [
            "Great work!", "Nice birding!", "Eagle eyes!", "What a find!",
            "Absolutely majestic!", "You've got the knack!", "Bird-tastic!",
            "Splendid spotting!", "A rare sight indeed!", "Top-tier birding!",
            "Look at those feathers!", "Incredible observation!", "You're a natural!",
            "Phenomenal focus!", "Wing-tastic catch!", "Feather-finder extraordinaire!",
            "Simply tweet-heart!", "Spectacular sighting!", "Bird-spotting champion!",
            "Magical discovery!", "Breathtaking!", "Expert level birding!",
            "Did you see that Booby?", "Lifer spotted!", "Ornithological excellence!",
            "Pure avian joy!", "Stunning silhouette!", "A twitcher's dream!",
            "Superb beak-work!", "Magnificent plumage!", "Sharpest eyes in the land!",
            "You're on a roll!", "The birds are impressed!", "Master of the skies!",
            "Incredible plumage!", "Fly high, spotter!", "Bird-dar is off the charts!",
            "Unbeatable spotting!", "Wingspan wizardry!", "Feathered friend found!",
            "You're a bird magnet!", "Truly flight-tastic!", "Birding legend!"
        ];

        const canvas = document.getElementById('confetti-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = canvas.height + 10;
                this.size = Math.random() * 10 + 5;
                this.speedY = Math.random() * -15 - 5;
                this.speedX = Math.random() * 6 - 3;
                this.color = `hsl(${Math.random() * 360}, 100%, 50%)`;
            }
            update() {
                this.y += this.speedY;
                this.x += this.speedX;
                this.speedY += 0.2;
            }
            draw() {
                ctx.fillStyle = this.color;
                ctx.fillRect(this.x, this.y, this.size, this.size);
            }
        }

        function triggerCelebration() {
            for (let i = 0; i < 150; i++) {
                particles.push(new Particle());
            }
            animateParticles();
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach((p, i) => {
                p.update();
                p.draw();
                if (p.y > canvas.height) particles.splice(i, 1);
            });
            if (particles.length > 0) requestAnimationFrame(animateParticles);
        }

        function startGame() {
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('instruction-screen').style.display = 'none';
            document.getElementById('game-container').style.display = 'block';
            changeBird();
        }

        function showInstructions() {
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('instruction-screen').style.display = 'block';
        }

        function changeBird() {
            const birdImg = document.getElementById('bird-img');
            const randomImg = birdImages[Math.floor(Math.random() * birdImages.length)];
            birdImg.src = `birdasset/${randomImg}`;
        }

        function playRandomSound() {
            const randomSnd = birdSounds[Math.floor(Math.random() * birdSounds.length)];
            const audio = new Audio(`birdasset/${randomSnd}`);
            audio.play().catch(e => {});
        }

        function spotBird() {
            internalBirdCount++;
            playRandomSound();
            changeBird();

            const bubble = document.getElementById('exultation');

            if (internalBirdCount === 20) {
                triggerCelebration();
                bubble.innerHTML = "🏆 20 BIRDS!<br>UN-BIRD-LIEVABLE!";
            } else {
                bubble.innerText = exultations[Math.floor(Math.random() * exultations.length)];
            }

            const randomHue = Math.floor(Math.random() * 360);
            const bgColor = `hsl(${randomHue}, 90%, 95%)`;
            const borderColor = `hsl(${randomHue}, 90%, 30%)`;
            
            bubble.style.backgroundColor = bgColor;
            bubble.style.borderColor = borderColor;
            bubble.style.color = borderColor;

            bubble.style.transform = `rotate(${Math.random() * 10 - 5}deg)`;
            
            const birdImg = document.getElementById('bird-img');
            birdImg.style.transform = `rotate(${Math.random() * 30 - 15}deg)`;
        }
    </script>
</body>
</html>
