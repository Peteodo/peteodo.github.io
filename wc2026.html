<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FIFA World Cup 2026 — Match Ratings</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #0A1628;
    --navy-mid: #112240;
    --navy-light: #1a3460;
    --red: #C8102E;
    --gold: #F5A623;
    --white: #FFFFFF;
    --grey: #8899AA;
    --card-bg: #0F1E38;
    --border: rgba(255,255,255,0.08);
    --green: #4ade80;
    --blue: #60a5fa;
    --orange: #fb923c;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--navy); color: var(--white); font-family: 'Inter', sans-serif; min-height: 100vh; overflow-x: hidden; }

  /* HEADER */
  header { background: var(--navy); position: relative; overflow: hidden; padding: 0; }
  .header-stripe {
    background: linear-gradient(135deg, var(--red) 0%, #8B0019 100%);
    padding: 28px 40px 22px; position: relative;
    clip-path: polygon(0 0, 100% 0, 97% 100%, 0 100%);
  }
  .header-stripe::before {
    content: ''; position: absolute; top: 0; right: -20px; bottom: 0; width: 80px;
    background: var(--gold); clip-path: polygon(30% 0, 100% 0, 70% 100%, 0 100%); opacity: 0.9;
  }
  .header-inner { display: flex; align-items: center; gap: 20px; position: relative; z-index: 1; }
  .trophy-icon { font-size: 2.2rem; filter: drop-shadow(0 0 8px rgba(245,166,35,0.6)); }
  .header-text h1 { font-family: 'Anton', sans-serif; font-size: 2.4rem; letter-spacing: 2px; text-transform: uppercase; line-height: 1; text-shadow: 0 2px 8px rgba(0,0,0,0.4); }
  .header-text .subtitle { font-size: 0.75rem; letter-spacing: 4px; text-transform: uppercase; color: rgba(255,255,255,0.75); margin-top: 4px; font-weight: 600; }
  .header-meta { margin-left: auto; text-align: right; font-size: 0.7rem; letter-spacing: 2px; text-transform: uppercase; color: rgba(255,255,255,0.7); font-weight: 500; }
  .live-dot { display: inline-block; width: 7px; height: 7px; background: var(--gold); border-radius: 50%; margin-right: 5px; animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

  /* CONTROLS */
  .controls { padding: 24px 40px 0; display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-end; }
  .control-group { display: flex; flex-direction: column; gap: 6px; }
  .control-label { font-size: 0.65rem; letter-spacing: 3px; text-transform: uppercase; color: var(--grey); font-weight: 600; }
  .tab-group { display: flex; background: var(--card-bg); border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
  .tab-btn { padding: 9px 18px; border: none; background: transparent; color: var(--grey); font-family: 'Inter', sans-serif; font-size: 0.8rem; font-weight: 600; letter-spacing: 1px; cursor: pointer; text-transform: uppercase; transition: all 0.2s; }
  .tab-btn.active { color: var(--navy); background: var(--gold); }
  .tab-btn:hover:not(.active) { color: var(--white); background: var(--navy-light); }
  select.ctrl { background: var(--card-bg); border: 1px solid var(--border); border-radius: 6px; color: var(--white); font-family: 'Inter', sans-serif; font-size: 0.8rem; font-weight: 600; padding: 9px 14px; cursor: pointer; outline: none; text-transform: uppercase; letter-spacing: 1px; }
  select.ctrl:focus { border-color: var(--gold); }
  .refresh-btn { padding: 9px 18px; background: var(--red); border: none; border-radius: 6px; color: var(--white); font-family: 'Inter', sans-serif; font-size: 0.75rem; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; cursor: pointer; transition: background 0.2s; }
  .refresh-btn:hover { background: #a50d26; }

  /* MAIN */
  .main { padding: 28px 40px 60px; }
  .status-msg { text-align: center; padding: 60px; color: var(--grey); font-size: 0.9rem; letter-spacing: 2px; text-transform: uppercase; }
  .section-eyebrow { font-size: 0.65rem; letter-spacing: 4px; text-transform: uppercase; color: var(--gold); font-weight: 700; margin-bottom: 6px; }
  .section-title { font-family: 'Anton', sans-serif; font-size: 1.8rem; letter-spacing: 1.5px; text-transform: uppercase; color: var(--white); margin-bottom: 22px; }

  /* TABLE VIEW */
  .round-block { margin-bottom: 40px; }
  .round-label { font-family: 'Anton', sans-serif; font-size: 1rem; letter-spacing: 3px; text-transform: uppercase; color: var(--red); margin-bottom: 12px; display: flex; align-items: center; gap: 12px; }
  .round-label::after { content: ''; flex: 1; height: 1px; background: linear-gradient(to right, var(--red), transparent); }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
  thead th { background: var(--navy-light); padding: 9px 10px; text-align: left; font-size: 0.62rem; letter-spacing: 1.5px; text-transform: uppercase; color: var(--grey); font-weight: 700; white-space: nowrap; }
  thead th.avg-q { color: #C8102E; border-bottom: 2px solid #C8102E; }
  thead th.avg-e { color: #60a5fa; border-bottom: 2px solid #60a5fa; }
  thead th.avg-v { color: var(--gold); border-bottom: 2px solid var(--gold); }
  thead th.voter-q { border-bottom: 2px solid rgba(200,16,46,0.4); }
  thead th.voter-e { border-bottom: 2px solid rgba(96,165,250,0.4); }
  thead th.voter-v { border-bottom: 2px solid rgba(245,166,35,0.4); }
  thead th.sort-active { color: var(--white) !important; }
  tbody tr { border-bottom: 1px solid var(--border); transition: background 0.15s; }
  tbody tr:hover { background: rgba(255,255,255,0.04); }
  td { padding: 10px 10px; color: var(--white); vertical-align: middle; }
  td.match-name { font-weight: 600; font-size: 0.82rem; min-width: 180px; }
  td.rank-cell { font-family: 'Anton', sans-serif; font-size: 1rem; color: var(--grey); text-align: center; width: 32px; }
  td.avg-cell { text-align: center; font-weight: 700; font-size: 0.95rem; font-variant-numeric: tabular-nums; min-width: 52px; }
  td.avg-cell.q { color: #C8102E; }
  td.avg-cell.e { color: #60a5fa; }
  td.avg-cell.v { color: var(--gold); }
  td.score-cell { text-align: center; min-width: 44px; padding: 10px 6px; }
  td.no-data { color: var(--grey); font-size: 0.7rem; text-align: center; }
  .mini-bar { width: 100%; height: 3px; background: rgba(255,255,255,0.1); border-radius: 2px; margin-top: 3px; }
  .mini-bar-fill { height: 100%; border-radius: 2px; }

  /* VOTER CARDS */
  .voter-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 20px; margin-bottom: 40px; }
  .voter-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; transition: transform 0.2s, box-shadow 0.2s; }
  .voter-card:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,0.4); }
  .voter-card-header { background: linear-gradient(135deg, var(--navy-light), var(--navy-mid)); padding: 14px 18px; display: flex; align-items: center; justify-content: space-between; border-bottom: 2px solid var(--red); }
  .voter-name { font-family: 'Anton', sans-serif; font-size: 1.3rem; letter-spacing: 2px; text-transform: uppercase; }
  .voter-avg-badge { background: var(--gold); color: var(--navy); font-family: 'Anton', sans-serif; font-size: 1.1rem; padding: 4px 10px; border-radius: 4px; letter-spacing: 1px; }
  .voter-card-body { padding: 14px 18px; }
  .voter-stat-row { display: flex; justify-content: space-between; align-items: center; padding: 7px 0; border-bottom: 1px solid var(--border); font-size: 0.8rem; }
  .voter-stat-row:last-child { border-bottom: none; }
  .voter-stat-label { color: var(--grey); font-weight: 500; max-width: 55%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .voter-stat-val { font-weight: 700; font-size: 0.88rem; font-variant-numeric: tabular-nums; }

  /* CHART WRAP */
  .chart-wrap { background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px; padding: 24px; margin-bottom: 32px; }
  .chart-title { font-family: 'Anton', sans-serif; font-size: 1.1rem; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 18px; color: var(--white); }

  /* TEAMS VIEW */
  .teams-table-wrap { overflow-x: auto; }
  .medal-1 { color: #FFD700; }
  .medal-2 { color: #C0C0C0; }
  .medal-3 { color: #CD7F32; }

  @media (max-width: 700px) {
    .controls { padding: 16px 16px 0; flex-direction: column; align-items: stretch; }
    .main { padding: 20px 16px 40px; }
    .header-stripe { padding: 20px 20px 16px; }
    .header-text h1 { font-size: 1.6rem; }
    .voter-grid { grid-template-columns: 1fr; }
    table { font-size: 0.72rem; }
    td, thead th { padding: 8px 6px; }
  }
</style>
</head>
<body>

<header>
  <div class="header-stripe">
    <div class="header-inner">
      <div class="trophy-icon">🏆</div>
      <div class="header-text">
        <h1>World Cup 2026</h1>
        <div class="subtitle">Match Ratings Dashboard</div>
      </div>
      <div class="header-meta">
        <div><span class="live-dot"></span>Live from Sheets</div>
        <div id="last-updated" style="margin-top:4px;"></div>
      </div>
    </div>
  </div>
</header>

<div class="controls">
  <div class="control-group">
    <div class="control-label">View</div>
    <div class="tab-group">
      <button class="tab-btn active" id="view-matches" onclick="setView('table')">All Matches</button>
      <button class="tab-btn" id="view-voter" onclick="setView('voter')">By Voter</button>
      <button class="tab-btn" id="view-teams" onclick="setView('teams')">Teams</button>
    </div>
  </div>

  <div class="control-group" id="metric-group">
    <div class="control-label">Sort / Highlight</div>
    <div class="tab-group">
      <button class="tab-btn active" id="m-quality" onclick="setMetric('quality')">Quality</button>
      <button class="tab-btn" id="m-enjoyment" onclick="setMetric('enjoyment')">Enjoyment</button>
      <button class="tab-btn" id="m-viewer" onclick="setMetric('viewer')">Viewer</button>
    </div>
  </div>

  <div class="control-group" id="round-group">
    <div class="control-label">Round</div>
    <select class="ctrl" id="round-select" onchange="render()">
      <option value="all">All Rounds</option>
    </select>
  </div>

  <div class="control-group" id="voter-group" style="display:none;">
    <div class="control-label">Voter</div>
    <select class="ctrl" id="voter-select" onchange="render()">
      <option value="all">All Voters</option>
    </select>
  </div>

  <div class="control-group">
    <div class="control-label">&nbsp;</div>
    <button class="refresh-btn" onclick="fetchData()">↻ Refresh</button>
  </div>
</div>

<div class="main" id="main">
  <div class="status-msg">Loading match data…</div>
</div>

<script>
const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQx-qLMvef6-AbPW2xpSI1QYMASqrPhGx-3Y1kxqJ-Q3WDUafMAz3JfIwircULcQwh1ujB5IORmquFZ/pub?output=csv';
const VOTERS = ['Pete','Kyle','Nathan','Michael','Chris R','Ryan'];
const VOTER_COLS = {
  Pete:      { quality:3,  enjoyment:4,  viewer:5  },
  Kyle:      { quality:6,  enjoyment:7,  viewer:8  },
  Nathan:    { quality:9,  enjoyment:10, viewer:11 },
  Michael:   { quality:12, enjoyment:13, viewer:14 },
  'Chris R': { quality:15, enjoyment:16, viewer:17 },
  Ryan:      { quality:18, enjoyment:19, viewer:20 },
};
const METRIC_COLOR = { quality:'#C8102E', enjoyment:'#60a5fa', viewer:'#F5A623' };
const METRIC_MAX   = { quality:10, enjoyment:10, viewer:3 };

let allData = [];
let currentView   = 'table';
let currentMetric = 'quality';

/* ── Helpers ── */
function pf(v){ const n=parseFloat(v); return isNaN(n)?null:n; }

function scoreColor(val, metric) {
  if (val===null) return 'var(--grey)';
  const pct = val / METRIC_MAX[metric];
  if (pct>=0.80) return '#4ade80';
  if (pct>=0.60) return '#facc15';
  if (pct>=0.40) return '#fb923c';
  return '#f87171';
}

function fixEncoding(s){
  return s.replace(/Ã§/g,'ç').replace(/Ã¼/g,'ü').replace(/Ã©/g,'é')
          .replace(/Ã¨/g,'è').replace(/Ãº/g,'ú').replace(/Ã¡/g,'á');
}

/* ── CSV Parsing ── */
function parseCSV(text) {
  const lines = text.trim().split('\n').map(l=>l.split(','));
  const rounds = [];
  let curRound = null;

  for (let i=3; i<lines.length; i++) {
    const row = lines[i];
    const cell = (row[0]||'').trim();
    if (!cell) continue;
    if (cell.toLowerCase().includes('viewer score total')) continue;

    const up = cell.toUpperCase();
    if (up.startsWith('ROUND') || up==='ROUND 1'||up==='ROUND 2'||up==='ROUND 3') {
      curRound = cell;
      rounds.push({ round: cell, matches: [] });
      continue;
    }
    if (!curRound) { curRound='Round 1'; rounds.push({ round:'Round 1', matches:[] }); }

    const scores = {};
    let hasAny = false;
    VOTERS.forEach(v => {
      const c = VOTER_COLS[v];
      const q=pf(row[c.quality]), e=pf(row[c.enjoyment]), vs=pf(row[c.viewer]);
      scores[v] = { quality:q, enjoyment:e, viewer:vs };
      if (q!==null||e!==null||vs!==null) hasAny=true;
    });
    if (!hasAny) continue;

    // Sheet averages for quality & enjoyment
    const sheetAvgQ = pf(row[1]);
    const sheetAvgE = pf(row[2]);

    // Compute our own averages (including viewer /3)
    const computeAvg = metric => {
      let tot=0, cnt=0;
      VOTERS.forEach(v=>{ const val=scores[v][metric]; if(val!==null){tot+=val;cnt++;} });
      return cnt>0 ? tot/cnt : null;
    };

    rounds[rounds.length-1].matches.push({
      match: fixEncoding(cell),
      avgQuality:  sheetAvgQ !== null ? sheetAvgQ : computeAvg('quality'),
      avgEnjoyment: sheetAvgE !== null ? sheetAvgE : computeAvg('enjoyment'),
      avgViewer:   computeAvg('viewer'),
      scores,
    });
  }
  return rounds;
}

/* ── View / Metric switching ── */
function setView(v) {
  currentView = v;
  ['table','voter','teams'].forEach(id => {
    const map = {table:'view-matches', voter:'view-voter', teams:'view-teams'};
    document.getElementById(map[id]).classList.toggle('active', id===v);
  });
  document.getElementById('voter-group').style.display  = v==='voter'  ? 'flex':'none';
  document.getElementById('round-group').style.display  = v==='teams'  ? 'none':'flex';
  render();
}

function setMetric(m) {
  currentMetric = m;
  ['quality','enjoyment','viewer'].forEach(k =>
    document.getElementById('m-'+k).classList.toggle('active', k===m));
  render();
}

/* ── Data fetch ── */
async function fetchData() {
  document.getElementById('main').innerHTML = '<div class="status-msg">⚡ Fetching live data…</div>';
  try {
    const r = await fetch(CSV_URL+'&t='+Date.now());
    const text = await r.text();
    allData = parseCSV(text);

    const rs = document.getElementById('round-select');
    const prev = rs.value;
    rs.innerHTML = '<option value="all">All Rounds</option>';
    allData.forEach(rd=>{ const o=document.createElement('option'); o.value=rd.round; o.textContent=rd.round; rs.appendChild(o); });
    if(prev && [...rs.options].find(o=>o.value===prev)) rs.value=prev;

    const vs = document.getElementById('voter-select');
    vs.innerHTML = '<option value="all">All Voters</option>';
    VOTERS.forEach(v=>{ const o=document.createElement('option'); o.value=v; o.textContent=v; vs.appendChild(o); });

    document.getElementById('last-updated').textContent =
      new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
    render();
  } catch(e) {
    document.getElementById('main').innerHTML = `<div class="status-msg">⚠ Could not load data — ${e.message}</div>`;
  }
}

function getFiltered() {
  const rv = document.getElementById('round-select').value;
  return rv==='all' ? allData : allData.filter(r=>r.round===rv);
}

/* ── RENDER: ALL MATCHES ── */
function renderTable() {
  const data = getFiltered();
  const metric = currentMetric;
  let html = '';

  data.forEach(rd => {
    if (!rd.matches.length) return;

    // Sort by selected metric avg, descending
    const sorted = [...rd.matches].sort((a,b) => {
      const av = metric==='quality'?a.avgQuality : metric==='enjoyment'?a.avgEnjoyment : a.avgViewer;
      const bv = metric==='quality'?b.avgQuality : metric==='enjoyment'?b.avgEnjoyment : b.avgViewer;
      if (av===null && bv===null) return 0;
      if (av===null) return 1;
      if (bv===null) return -1;
      return bv - av;
    });

    html += `<div class="round-block">
      <div class="round-label">${rd.round}</div>
      <div class="table-wrap"><table><thead><tr>
        <th style="width:28px">#</th>
        <th>Match</th>
        <th class="avg-q${metric==='quality'?' sort-active':''}">Avg Q</th>
        <th class="avg-e${metric==='enjoyment'?' sort-active':''}">Avg E</th>
        <th class="avg-v${metric==='viewer'?' sort-active':''}">Avg V</th>`;
    VOTERS.forEach(v => {
      const cls = metric==='quality'?'voter-q':metric==='enjoyment'?'voter-e':'voter-v';
      html += `<th class="${cls}${metric!=='viewer'?'':''}">${v}</th>`;
    });
    html += `</tr></thead><tbody>`;

    sorted.forEach((m, idx) => {
      html += `<tr><td class="rank-cell">${idx+1}</td><td class="match-name">${m.match}</td>`;

      // Three avg columns
      const avgs = [
        { val: m.avgQuality,   cls:'q', max:10  },
        { val: m.avgEnjoyment, cls:'e', max:10  },
        { val: m.avgViewer,    cls:'v', max:3   },
      ];
      avgs.forEach(a => {
        const sorted_metric = a.cls==='q'?'quality':a.cls==='e'?'enjoyment':'viewer';
        const isActive = sorted_metric===metric;
        html += `<td class="avg-cell ${a.cls}" style="${isActive?'font-size:1.05rem':'opacity:0.7'}">`;
        html += a.val!==null ? a.val.toFixed(2) : '<span style="color:var(--grey);font-size:0.7rem">—</span>';
        html += `</td>`;
      });

      // Per-voter column for selected metric
      VOTERS.forEach(v => {
        const val = m.scores[v][metric];
        const max = METRIC_MAX[metric];
        if (val!==null) {
          const color = scoreColor(val, metric);
          const barW = Math.round((val/max)*100);
          const barCol = METRIC_COLOR[metric];
          html += `<td class="score-cell">
            <span style="color:${color};font-weight:700;font-size:0.85rem">${val}</span>
            <div class="mini-bar"><div class="mini-bar-fill" style="width:${barW}%;background:${barCol}"></div></div>
          </td>`;
        } else {
          html += `<td class="no-data">—</td>`;
        }
      });
      html += `</tr>`;
    });

    html += `</tbody></table></div></div>`;
  });

  if (!html) html = '<div class="status-msg">No scored matches yet</div>';
  document.getElementById('main').innerHTML = `
    <div class="section-eyebrow">All Matches</div>
    <div class="section-title">Sorted by ${currentMetric.charAt(0).toUpperCase()+currentMetric.slice(1)}</div>
    ${html}`;
}

/* ── RENDER: BY VOTER ── */
function renderVoterView() {
  const data = getFiltered();
  const metric = currentMetric;
  const voterFilter = document.getElementById('voter-select').value;
  const voters = voterFilter==='all' ? VOTERS : [voterFilter];
  const max = METRIC_MAX[metric];

  const vStats = {};
  voters.forEach(v => { vStats[v]={scores:[],total:0,count:0}; });

  data.forEach(rd => rd.matches.forEach(m => {
    voters.forEach(v => {
      const val = m.scores[v][metric];
      if (val!==null) {
        vStats[v].scores.push({match:m.match, val});
        vStats[v].total+=val; vStats[v].count++;
      }
    });
  }));

  // Bar chart
  const chartData = voters.map(v=>({
    label:v, avg: vStats[v].count>0 ? vStats[v].total/vStats[v].count : null
  })).filter(d=>d.avg!==null);

  let chartHtml = `<div class="chart-wrap">
    <div class="chart-title">Avg ${metric.charAt(0).toUpperCase()+metric.slice(1)} by Voter${metric==='viewer'?' (out of 3)':''}</div>
    <div style="display:flex;flex-direction:column;gap:10px;">`;
  chartData.forEach(d => {
    const pct = (d.avg/max)*100;
    const col = METRIC_COLOR[metric];
    chartHtml += `<div style="display:flex;align-items:center;gap:12px;">
      <div style="width:72px;font-size:0.78rem;font-weight:700;text-align:right;letter-spacing:1px;">${d.label}</div>
      <div style="flex:1;background:rgba(255,255,255,0.07);border-radius:4px;height:26px;overflow:hidden;position:relative;">
        <div style="width:${pct}%;height:100%;background:${col};border-radius:4px;"></div>
        <span style="position:absolute;left:${pct>25?pct-2:pct+1}%;top:50%;transform:translateY(-50%) ${pct>25?'translateX(-100%)':''};font-size:0.8rem;font-weight:700;color:${pct>25?'var(--navy)':'var(--white)'};white-space:nowrap;padding:0 6px">${d.avg.toFixed(2)}</span>
      </div>
    </div>`;
  });
  chartHtml += `</div></div>`;

  // Voter cards
  let cardsHtml = `<div class="voter-grid">`;
  voters.forEach(v => {
    const st = vStats[v];
    if (!st.count) return;
    const avg = (st.total/st.count).toFixed(2);
    const sorted = [...st.scores].sort((a,b)=>b.val-a.val);
    const top3 = sorted.slice(0,3);
    const bot3 = sorted.slice(-3).reverse();

    cardsHtml += `<div class="voter-card">
      <div class="voter-card-header">
        <div class="voter-name">${v}</div>
        <div class="voter-avg-badge">${avg}</div>
      </div>
      <div class="voter-card-body">
        <div style="font-size:0.65rem;letter-spacing:3px;text-transform:uppercase;color:var(--gold);margin-bottom:8px;font-weight:700;">Top Rated</div>`;
    top3.forEach(s => {
      cardsHtml += `<div class="voter-stat-row">
        <div class="voter-stat-label" title="${s.match}">${s.match}</div>
        <div class="voter-stat-val" style="color:#4ade80">${s.val}</div>
      </div>`;
    });
    cardsHtml += `<div style="font-size:0.65rem;letter-spacing:3px;text-transform:uppercase;color:var(--red);margin:12px 0 8px;font-weight:700;">Lowest Rated</div>`;
    bot3.forEach(s => {
      cardsHtml += `<div class="voter-stat-row">
        <div class="voter-stat-label" title="${s.match}">${s.match}</div>
        <div class="voter-stat-val" style="color:#f87171">${s.val}</div>
      </div>`;
    });
    cardsHtml += `<div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--border);display:flex;justify-content:space-between;font-size:0.75rem;">
      <span style="color:var(--grey)">Matches rated</span>
      <span style="font-weight:700">${st.count}</span>
    </div></div></div>`;
  });
  cardsHtml += `</div>`;

  // H2H
  let h2hHtml = '';
  if (voters.length===2) {
    const [v1,v2]=voters;
    let rows='', w1=0, w2=0, draws=0;
    data.forEach(rd=>rd.matches.forEach(m=>{
      const s1=m.scores[v1][metric], s2=m.scores[v2][metric];
      if(s1===null||s2===null) return;
      const diff=s1-s2;
      if(diff>0) w1++; else if(diff<0) w2++; else draws++;
      const col=diff>0?'#4ade80':diff<0?'#f87171':'var(--grey)';
      const c1 = diff>0 ? '#4ade80' : 'var(--white)';
      const c2 = diff<0 ? '#f87171' : 'var(--white)';
      rows+=`<tr><td class="match-name">${m.match}</td>
        <td class="score-cell" style="color:${c1};font-weight:700">${s1}</td>
        <td class="score-cell" style="color:${c2};font-weight:700">${s2}</td>
        <td class="score-cell" style="color:${col};font-weight:700">${diff>0?'+':''}${diff}</td></tr>`;
    }));
    if (rows) {
      h2hHtml=`<div class="chart-wrap">
        <div class="chart-title">${v1} vs ${v2} — Head-to-Head</div>
        <div style="display:flex;gap:20px;margin-bottom:16px;font-size:0.8rem;">
          <span style="color:#4ade80;font-weight:700">${v1}: ${w1}</span>
          <span style="color:#f87171;font-weight:700">${v2}: ${w2}</span>
          <span style="color:var(--grey);font-weight:700">Draws: ${draws}</span>
        </div>
        <div class="table-wrap"><table><thead><tr><th>Match</th><th>${v1}</th><th>${v2}</th><th>Diff</th></tr></thead>
        <tbody>${rows}</tbody></table></div></div>`;
    }
  }

  document.getElementById('main').innerHTML = `
    <div class="section-eyebrow">Voter Analysis</div>
    <div class="section-title">${metric.charAt(0).toUpperCase()+metric.slice(1)} — Voter Breakdown</div>
    ${chartHtml}${cardsHtml}${h2hHtml}`;
}

/* ── RENDER: TEAMS ── */
function renderTeams() {
  const metric = currentMetric;
  const max = METRIC_MAX[metric];
  const teamMap = {};

  // Use ALL data regardless of round filter
  allData.forEach(rd => rd.matches.forEach(m => {
    const parts = m.match.split(' vs ');
    if (parts.length!==2) return;
    const [t1, t2] = parts.map(s=>s.trim());

    const getAvg = () => {
      if (metric==='quality')   return m.avgQuality;
      if (metric==='enjoyment') return m.avgEnjoyment;
      return m.avgViewer;
    };
    const avg = getAvg();
    if (avg===null) return;

    [t1, t2].forEach(team => {
      if (!teamMap[team]) teamMap[team]={ total:0, count:0, matches:[] };
      teamMap[team].total  += avg;
      teamMap[team].count  += 1;
      teamMap[team].matches.push({ opponent: team===t1?t2:t1, val:avg, round:rd.round });
    });
  }));

  const teams = Object.entries(teamMap)
    .map(([name,d])=>({ name, avg:d.total/d.count, count:d.count, matches:d.matches }))
    .filter(t=>t.count>0)
    .sort((a,b)=>b.avg-a.avg);

  if (!teams.length) {
    document.getElementById('main').innerHTML='<div class="status-msg">No team data yet</div>';
    return;
  }

  const medalClass = i => i===0?'medal-1':i===1?'medal-2':i===2?'medal-3':'';
  const medalEmoji = i => i===0?'🥇':i===1?'🥈':i===2?'🥉':'';

  let rows = '';
  teams.forEach((t,i) => {
    const barW = Math.round((t.avg/max)*100);
    const col   = METRIC_COLOR[metric];
    const mc    = medalClass(i);
    rows += `<tr>
      <td class="rank-cell ${mc}" style="font-size:${i<3?'1.2':'0.9'}rem">${i<3?medalEmoji(i):i+1}</td>
      <td class="match-name" style="${i<3?'font-size:0.9rem':''}">${t.name}</td>
      <td class="avg-cell" style="color:${col}">${t.avg.toFixed(2)}</td>
      <td style="min-width:140px;padding:10px;">
        <div style="background:rgba(255,255,255,0.07);border-radius:4px;height:18px;overflow:hidden;position:relative;">
          <div style="width:${barW}%;height:100%;background:${col};border-radius:4px;"></div>
        </div>
      </td>
      <td style="color:var(--grey);font-size:0.78rem;text-align:center;">${t.count} match${t.count!==1?'es':''}</td>
    </tr>`;
  });

  const metricLabel = metric.charAt(0).toUpperCase()+metric.slice(1);
  document.getElementById('main').innerHTML = `
    <div class="section-eyebrow">Team Rankings</div>
    <div class="section-title">Ranked by Avg ${metricLabel}${metric==='viewer'?' (out of 3)':' (out of 10)'}</div>
    <div class="chart-wrap">
      <div class="chart-title">All Teams — ${metricLabel} Leaderboard</div>
      <div class="teams-table-wrap">
        <table>
          <thead><tr>
            <th style="width:40px">#</th>
            <th>Team</th>
            <th class="avg-${metric==='quality'?'q':metric==='enjoyment'?'e':'v'} sort-active">Avg ${metricLabel}</th>
            <th style="min-width:140px">Rating</th>
            <th>Played</th>
          </tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    </div>`;
}

/* ── Main render dispatcher ── */
function render() {
  if (!allData.length) return;
  if (currentView==='table')  renderTable();
  else if (currentView==='voter') renderVoterView();
  else renderTeams();
}

setInterval(fetchData, 5*60*1000);
fetchData();
</script>
</body>
</html>
