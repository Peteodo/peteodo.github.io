<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MNF Season 11 - Match Report Cast</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Barlow:wght@300;400;500;600&family=Unbounded:wght@400;700;800&display=swap');

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}

:root{
  --pl-purple:#37003c;--pl-green:#00ff85;--pl-blue:#04f5ff;--pl-pink:#e90052;
  --pl-white:#fff;--pl-off:#f7f7f7;--pl-grey:#8c8c8c;--pl-light:#ebebeb;--pl-dark:#1e1e1e;
  --font:'Barlow',sans-serif;
  --cond:'Barlow Condensed',sans-serif;
  --numeric:'Unbounded', sans-serif;
}

body{background:var(--pl-off);color:var(--pl-dark);font-family:var(--font);font-size:14px;min-height:100vh;}

.pl-header{background:var(--pl-purple);position:relative;overflow:hidden;}
.pl-header::before{content:'';position:absolute;top:-70px;right:-50px;width:300px;height:300px;border-radius:50%;background:rgba(0,255,133,0.05);pointer-events:none;}
.pl-header::after{content:'';position:absolute;bottom:-90px;left:38%;width:220px;height:220px;border-radius:50%;background:rgba(4,245,255,0.04);pointer-events:none;}

.header-inner{max-width:1100px;margin:0 auto;padding:24px 24px;display:flex;align-items:flex-end;justify-content:space-between;gap:16px;}
.header-badge{display:flex;align-items:center;gap:14px;}
.badge-circle{width:54px;height:54px;border-radius:50%;background:var(--pl-green);display:flex;align-items:center;justify-content:center;font-family:var(--numeric);font-weight:800;font-size:12px;color:var(--pl-purple);flex-shrink:0;}

.header-titles h1{font-family:var(--numeric);font-size:30px;font-weight:800;color:var(--pl-white);text-transform:uppercase;letter-spacing:0.5px;line-height:1;}
.header-titles h1 em{color:var(--pl-green);font-style:normal;}
.header-titles p{font-size:12px;color:rgba(255,255,255,0.45);margin-top:5px;}

.header-meta{text-align:right;font-size:11px;color:rgba(255,255,255,0.4);line-height:2.1;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;}

.content{max-width:1100px;margin:0 auto;padding:36px 24px;}

.player-card{background:white;border-radius:14px;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,0.06);}

.player-top{background:var(--pl-purple);padding:26px 28px;position:relative;overflow:hidden;}
.player-top::before{content:'';position:absolute;top:-40px;right:-30px;width:160px;height:160px;border-radius:50%;background:rgba(0,255,133,0.06);pointer-events:none;}
.track-label{font-size:10px;color:rgba(255,255,255,0.4);text-transform:uppercase;letter-spacing:0.8px;font-weight:600;margin-bottom:6px;}
.track-title{font-family:var(--numeric);font-size:20px;font-weight:700;color:var(--pl-white);text-transform:uppercase;letter-spacing:0.3px;position:relative;z-index:1;}
.track-title em{color:var(--pl-green);font-style:normal;}

.player-body{padding:26px 28px 30px;}

.transport{display:flex;align-items:center;gap:16px;margin-bottom:20px;}
.play-btn{width:52px;height:52px;border-radius:50%;background:var(--pl-purple);border:none;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:background 0.15s, transform 0.1s;}
.play-btn:hover{background:#4a0052;}
.play-btn:active{transform:scale(0.95);}
.play-btn svg{fill:var(--pl-green);}

.skip-btn{width:36px;height:36px;border-radius:50%;background:none;border:1px solid var(--pl-light);cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all 0.15s;}
.skip-btn:hover{border-color:var(--pl-purple);background:var(--pl-off);}
.skip-btn svg{fill:var(--pl-grey);}

.seek-area{flex:1;}
.time-row{display:flex;justify-content:space-between;font-family:var(--numeric);font-size:10px;color:var(--pl-grey);margin-bottom:6px;}
.progress-wrap{background:var(--pl-light);border-radius:3px;height:7px;cursor:pointer;position:relative;}
.progress-fill{height:7px;border-radius:3px;background:var(--pl-purple);width:0%;position:relative;}
.progress-fill::after{content:'';position:absolute;right:-5px;top:50%;transform:translateY(-50%);width:12px;height:12px;border-radius:50%;background:var(--pl-green);box-shadow:0 1px 4px rgba(0,0,0,0.3);opacity:0;transition:opacity 0.15s;}
.progress-wrap:hover .progress-fill::after{opacity:1;}

.bottom-row{display:flex;align-items:center;justify-content:space-between;margin-top:22px;padding-top:18px;border-top:1px solid var(--pl-light);}
.vol-area{display:flex;align-items:center;gap:8px;}
.vol-area svg{fill:var(--pl-grey);}
.vol-slider{width:80px;accent-color:var(--pl-purple);}
.speed-btn{background:none;border:1px solid var(--pl-light);color:var(--pl-grey);font-family:var(--cond);font-size:11px;font-weight:700;letter-spacing:0.5px;padding:5px 12px;border-radius:4px;cursor:pointer;transition:all 0.15s;}
.speed-btn:hover{border-color:var(--pl-purple);color:var(--pl-purple);}
.dl-link{font-size:11px;color:var(--pl-purple);text-transform:uppercase;letter-spacing:0.5px;font-weight:700;text-decoration:none;font-family:var(--cond);}
.dl-link:hover{color:var(--pl-pink);}

footer{max-width:1100px;margin:6px auto 32px;padding:14px 24px;font-size:11px;color:var(--pl-grey);text-transform:uppercase;letter-spacing:0.5px;font-weight:600;border-top:1px solid var(--pl-light);}
</style>
</head>
<body>

<div class="pl-header">
  <div class="header-inner">
    <div class="header-badge">
      <div class="badge-circle">MNF</div>
      <div class="header-titles">
        <h1>MNF <em>Season 11</em></h1>
        <p>Match Report Cast</p>
      </div>
    </div>
    <div class="header-meta">
      <span>Audio Broadcast</span>
    </div>
  </div>
</div>

<div class="content">
  <div class="player-card">
    <div class="player-top">
      <div class="track-label">Now Playing</div>
      <div class="track-title">Season 11 <em>Match Report</em> Cast</div>
    </div>
    <div class="player-body">
      <div class="transport">
        <button class="skip-btn" id="back-btn" title="Back 10s">
          <svg width="16" height="16" viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/></svg>
        </button>
        <button class="play-btn" id="play-btn" title="Play/Pause">
          <svg id="play-icon" width="20" height="20" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          <svg id="pause-icon" width="20" height="20" viewBox="0 0 24 24" style="display:none"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
        </button>
        <button class="skip-btn" id="fwd-btn" title="Forward 10s">
          <svg width="16" height="16" viewBox="0 0 24 24"><path d="M12 5V1l5 5-5 5V7c-3.31 0-6 2.69-6 6s2.69 6 6 6 6-2.69 6-6h2c0 4.42-3.58 8-8 8s-8-3.58-8-8 3.58-8 8-8z"/></svg>
        </button>
        <div class="seek-area">
          <div class="time-row">
            <span id="time-current">0:00</span>
            <span id="time-total">0:00</span>
          </div>
          <div class="progress-wrap" id="progress-wrap">
            <div class="progress-fill" id="progress-fill"></div>
          </div>
        </div>
      </div>
      <div class="bottom-row">
        <div class="vol-area">
          <svg width="16" height="16" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
          <input type="range" class="vol-slider" id="vol-slider" min="0" max="1" step="0.01" value="1">
        </div>
        <button class="speed-btn" id="speed-btn">1.0x</button>
        <a class="dl-link" id="dl-link" href="audio/MNF_Season_11_Match_Report_Cast.m4a" download>Download</a>
      </div>
    </div>
  </div>
</div>

<footer>MNF Season 11 &middot; Match Report Cast</footer>

<audio id="audio-el" src="audio/MNF_Season_11_Match_Report_Cast.m4a" preload="metadata"></audio>

<script>
const audio = document.getElementById('audio-el');
const playBtn = document.getElementById('play-btn');
const playIcon = document.getElementById('play-icon');
const pauseIcon = document.getElementById('pause-icon');
const progressWrap = document.getElementById('progress-wrap');
const progressFill = document.getElementById('progress-fill');
const timeCurrent = document.getElementById('time-current');
const timeTotal = document.getElementById('time-total');
const volSlider = document.getElementById('vol-slider');
const speedBtn = document.getElementById('speed-btn');
const backBtn = document.getElementById('back-btn');
const fwdBtn = document.getElementById('fwd-btn');

const speeds = [1, 1.25, 1.5, 1.75, 2, 0.75];
let speedIdx = 0;

function fmt(s){
  if (!isFinite(s)) return '0:00';
  const m = Math.floor(s/60);
  const sec = Math.floor(s%60).toString().padStart(2,'0');
  return m+':'+sec;
}

playBtn.addEventListener('click', () => {
  if (audio.paused) { audio.play(); } else { audio.pause(); }
});

audio.addEventListener('play', () => {
  playIcon.style.display = 'none';
  pauseIcon.style.display = 'block';
});
audio.addEventListener('pause', () => {
  playIcon.style.display = 'block';
  pauseIcon.style.display = 'none';
});

audio.addEventListener('loadedmetadata', () => {
  timeTotal.textContent = fmt(audio.duration);
});

audio.addEventListener('timeupdate', () => {
  const pct = (audio.currentTime / audio.duration) * 100 || 0;
  progressFill.style.width = pct + '%';
  timeCurrent.textContent = fmt(audio.currentTime);
});

audio.addEventListener('ended', () => {
  playIcon.style.display = 'block';
  pauseIcon.style.display = 'none';
});

progressWrap.addEventListener('click', (e) => {
  const rect = progressWrap.getBoundingClientRect();
  const pct = (e.clientX - rect.left) / rect.width;
  audio.currentTime = pct * audio.duration;
});

volSlider.addEventListener('input', () => {
  audio.volume = volSlider.value;
});

speedBtn.addEventListener('click', () => {
  speedIdx = (speedIdx + 1) % speeds.length;
  audio.playbackRate = speeds[speedIdx];
  speedBtn.textContent = speeds[speedIdx].toFixed(2).replace(/0$/,'').replace(/\.$/,'.0') + 'x';
});

backBtn.addEventListener('click', () => {
  audio.currentTime = Math.max(0, audio.currentTime - 10);
});
fwdBtn.addEventListener('click', () => {
  audio.currentTime = Math.min(audio.duration || 0, audio.currentTime + 10);
});
</script>
</body>
</html>
